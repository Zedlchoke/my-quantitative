<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>PaperDesk — SPORTS-PAPERTRADE-EXEC-V1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark">PD</div>
        <div>
          <div class="brand-name">PaperDesk</div>
          <div class="brand-sub">SPORTS-PAPERTRADE-EXEC-V1</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="gov-box">
        <div class="gov-row"><span class="dot" id="chain-dot"></span>
          <div><div class="gov-cap">ledger chain</div>
          <div class="gov-val mono" id="chain-val">…</div></div></div>
        <div class="gov-row"><span class="dot blue"></span>
          <div><div class="gov-cap">PM cutover GO</div>
          <div class="gov-val mono">REGISTERED_NOT_CONSUMED</div>
          <div class="gov-note">app consumes nothing</div></div></div>
      </div>
      <div class="foot">PaperDesk v1.0 · AMENDMENT_MACOS_APP_UI_V1</div>
    </aside>

    <main id="main">
      <div id="banner" class="banner paper"></div>
      <div id="runner-strip">
        <span class="dot" id="runner-dot"></span>
        <span class="mono" id="runner-label">probing…</span>
        <span id="paused-chip" class="chip orange hidden">
          ⏸ DECISIONS PAUSED (settle continues)</span>
        <span id="stale-chip" class="chip red hidden">state stale</span>
        <span class="spacer"></span>
        <span class="dim" id="policy-label">window close: ask</span>
        <select id="policy-select" title="Window close policy">
          <option value="ask">ask</option>
          <option value="pauseDecisions">pause decisions</option>
          <option value="keepRunning">keep running</option>
        </select>
        <div class="menu-wrap">
          <button id="runner-menu-btn">Runner ▾</button>
          <div id="runner-menu" class="menu hidden">
            <button data-act="pause">Pause decisions</button>
            <button data-act="resume">Resume decisions</button>
            <hr />
            <button data-act="takeover">Take over from launchd…</button>
            <button data-act="stop">Graceful stop runner…</button>
            <button data-act="start">Start paper runner</button>
          </div>
        </div>
      </div>
      <div id="view" class="view"></div>
    </main>
  </div>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
