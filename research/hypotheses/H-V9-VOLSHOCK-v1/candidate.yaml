# H-V9-VOLSHOCK-v1 - V9 time-series trend candidate spec (A1-frozen, pre-scoring).
hypothesis_id: H-V9-VOLSHOCK-v1
family: volume_shock_continuation
stage: S0_EXPLORATORY
owner_agent: A1
mechanism_class: liq_shock_continuation
economic_mechanism: >
  Dollar-volume outliers mark attention/liquidity events; short-horizon
  continuation among shocked names as flow absorbs over days. Counterparty:
  liquidity providers demanding immediacy from shock-driven flow.
expected_regimes: trending low-noise regimes reward; choppy mean-reverting regimes punish.
invalidating_regimes: high churn / reversal-dominated tape (as measured in V8).
signal_clock: monday_00_00_utc_completed_bars_only
direction_rule: >
  Shock_i = dv(t-1)/mean(dv last 20d excl. t-1). Universe-per-stamp = top-6 by
  shock (shock>=1.5 required else ALL FLAT). Among shocked: LONG 2 highest 3d
  return, SHORT 2 lowest, slot gross 0.20 each (max 0.80 book).
universe:
  traded_symbols: [ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ENAUSDT, SUIUSDT,
                   1000PEPEUSDT, ADAUSDT, BNBUSDT, LINKUSDT]
  benchmark_symbol: BTCUSDT
  benchmark_role: measurement_only
  universe_policy: fixed_before_run_no_pnl_changes
data_window:
  scope: common_completed_bar_window_from_v9_universe_audit
parameters_frozen:
  variants:
    - {id: XSECT-VOLSHK-S15, shock_threshold: 1.5}
  negative_control: {id: XSECT-VOLSHK-CTRL, note: bottom-6-by-shock selection (--reverse)}
  dv_baseline_days: 20
  return_lookback_days: 3
  universe_top_n: 6
  positions_per_side: 2
  slot_gross: 0.20
execution:
  fill_event: next_completed_15m_event
  slippage: one_tick_adverse
  fee_rate: 0.0005
  funding_accounting: native
split:
  folds: chronological_3fold
  purge_embargo_days: 7
  warmup_days_min: 21
allowed_outcomes: [V9_REJECTED_CANDIDATE, STAGE_A_PASS_EXPLORATORY, LOCK_FOR_FUTURE_S1]
forbidden_labels: [EDGE_CONFIRMED, PRODUCTION_READY, LIVE_READY]
