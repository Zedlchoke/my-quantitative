# H-XSECT-REVERSAL-BREADTH-CRYPTO-v1 — V8X Cohort C pre-registration contract (A6 blind draft).
# Every field below is VERBATIM from PLAN.md sections 8-9 ("V8X preregistration",
# "V8X Cohort C — 10 Binance crypto USD-M co >=1 nam") plus section 11 trial
# inventory. No parameter invented, no deviation. Drafted BEFORE any scored V8
# core artifact exists; this spec must be hash-frozen before the first scored V8
# artifact (PLAN section 8). Verdicts/metadata go to status.yaml. Do not edit
# values after freeze.
hypothesis_id: H-XSECT-REVERSAL-BREADTH-CRYPTO-v1
cohort: CRYPTO_USDM_1Y_10
family: cross_sectional_weekly_reversal_breadth
stage: S0_EXPLORATORY_BREADTH_SCREEN   # breadth screen only; never OOS/S1 or promotion evidence
owner_agent: A6
universe_agent: A8              # applies the deterministic selection rule below, performance-blind
validator_agent: A7             # hash + novelty check at freeze

universe:
  selection_mode: deterministic_rule_frozen_before_performance
  exchange: binance_usdm
  instrument: PERPETUAL
  quote_asset: USDT
  status_at_cutoff: valid_trading_status_at_frozen_cutoff
  rules:
    - onboardDate <= window_start - 365 days
    - ">= 365 days of common 15m bars"
    - native funding coverage over the scored window
    - zero unexplained gaps inside the scored window
    - PIT metadata/hash complete for every accepted symbol
  ranking_rule: >
    rank eligible symbols by median daily quote volume measured in the 30 days
    STRICTLY BEFORE the scored window start; take exactly the top 10.
  record_accepted_and_rejected: true   # anti-survivorship / anti-cherry-pick ledger
  min_required_eligible: 10
  below_min_action: V8X_CRYPTO_NOT_STARTED_DATA_INCOMPLETE   # gates are NOT lowered
  benchmark_symbol: BTCUSDT            # context only if used at all; never traded, never ranked
  universe_policy: rule_frozen_before_run_no_pnl_based_changes

data_window:
  scope: common_one_year_intersection_of_selected_ten
  window_end_utc_hard_cap: "2026-08-21T00:00Z"
  endpoint_note: >
    exact completed-bar endpoints decided by the A8 data audit; the hard cap
    above is not self-executing. One year of data is explicitly NOT enough
    for promotion (PLAN section 8).

signal_clock: monday_00_00_utc_completed_bars_only
formation_lookbacks_days: [3, 7, 14]     # exactly these three; none may be added
direction:
  long_rule: bottom_2_past_return_losers
  short_rule: top_2_past_return_winners

negative_control:
  id: V8X-C-WMOM-7D-CONTROL
  rule: long_winners_short_losers_at_7D

rebalance:
  cadence_days: 7                        # every Monday 00:00 UTC
  intraweek_discretionary_rebalance: false
holding_horizon: 7 days (one full rebalance cycle)

portfolio:
  gross_target: 0.80
  net_target: 0.0
  max_abs_symbol_weight: per_leg_half_of_leg_gross   # bottom-2/top-2 => equal weight legs

eligibility:
  required_symbols: all_ten              # all ten selected symbols required
  incomplete_cross_section_action: skip_whole_rebalance

execution:
  session: 24_7_utc                      # crypto clock; NO equity calendar borrowing
  fill_event: next_completed_15m_event
  slippage: one_tick_adverse
  fee_rate: 0.0005
  funding_accounting: native             # native funding accounting on held legs

split:
  folds: chronological_3fold
  purge_embargo_days: 7                  # at each fold boundary
  warmup_days_min: 14

trial_budget:
  normal_trials: 3                       # exactly three normal
  negative_controls: 1                   # + one negative control
  total_scored_candidates: 4

trial_inventory:
  - {id: V8X-C-WREV-3D,          formation: 3D,  direction: reversal}
  - {id: V8X-C-WREV-7D,          formation: 7D,  direction: reversal}
  - {id: V8X-C-WREV-14D,         formation: 14D, direction: reversal}
  - {id: V8X-C-WMOM-7D-CONTROL,  formation: 7D,  direction: momentum_control}

forbidden_after_freeze:
  - hand-picking symbols by chart or PnL
  - removing/replacing any of the ten symbols after scoring starts
  - using V8 core results to pick universe/lookback/cost
  - adding formation lookbacks beyond 3D/7D/14D
  - changing thresholds, costs, folds, window, cadence or weekday
  - treating one-year breadth as promotion/OOS evidence
  - pooling this cohort's PBO/scores with equities or with V8 two-year results
  - replacement trials if a trial errors after publishing any scored metric

outcome_caps:
  best_case: V8X_CRYPTO_BREADTH_PASS_EXPLORATORY
  s1_live_authorization: none            # no V8X outcome self-authorizes S1/live

provenance_constraints:
  prereg_freeze_deadline: before_first_scored_V8_core_artifact
  v8x_agent_must_not_read:
    - results/portfolio_v8
    - V8 partial logs
    - V8 metrics
    - V8 verdicts
  missed_window_label: V8X_PREREG_WINDOW_MISSED
