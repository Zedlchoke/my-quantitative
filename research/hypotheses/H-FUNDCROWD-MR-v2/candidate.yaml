# ONLY in signal); OI excluded; exactly 3 declared combinations, HTF fixed ON.
# Supersedes H-FUNDCROWD-MR-v1 (never scored; family trials to date = 0).
# Written by A4 BEFORE any scored run. A1 locks after H4/H9/H14 confirmation.
