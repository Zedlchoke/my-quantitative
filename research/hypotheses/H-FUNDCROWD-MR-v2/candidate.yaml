htf_filter: true                    # fixed ON for all combos; NOT tuned
oi_overlay: false                   # OI explicitly OUT of signal this version
declared_parameter_combinations: 3
trial_budget_combinations: 3

economic_mechanism: >
  Perpetual funding transfers between directional holders are largest when the
  crowd is one-sided. When the latest settled funding rate sits in the upper
  tail of its trailing distribution, longs are crowded and pay elevated carry:
  mean-reversion longs entered into that tail bleed carry while held and face
  forced-deleveraging air-pockets if price stalls. Gating the frozen reclaim-MR
  entries by point-in-time funding percentile should remove entries whose
  expected carry + unwind asymmetry exceeds the reversion edge, while leaving
  uncrowded-regime reversion untouched. Shorts mirrored at the lower tail.
expected_counterparty: >
  Over-leveraged crowded-side perp holders paying/receiving extreme funding who
  must unwind into adverse moves, plus late mean-reversion chasers entering
  without any crowding check; we take the other side only when carry terms are
  neutral-to-favourable.
holding_horizon: hours-to-days on 15m bars, bounded by reclaim-MR stop/TP.
expected_regimes:
  - transition_range_with_elevated_one_sided_funding
  - accumulation_after_long_liquidation_cluster

entry_exit_rules: >
  BASE (unchanged, frozen): strategy_reclaim_mr reclaim logic — Bollinger band
  reclaim + RSI extreme within VHF/ADX/volume range gate and phase gate;
  stop 1.5xATR, TP 2x; engine daily-loss/cooldown limits unchanged.
  NEW PRE-REGISTERED GATE: decision_ts = the current signal bar's CLOSE
  timestamp (bar.ts_event, the moment of decision). percentile =
  FundingPIT.percentile_asof(decision_ts, window_days=30) — rank of the most
  recently SETTLED funding rate among settlements already PUBLISHED at or
  before decision_ts (8h settlement lag respected; no forward-fill beyond the
  last settled timestamp). LONG blocked when percentile > threshold_p/100;
  SHORT blocked when percentile <= (100 - threshold_p)/100 (crowded-short
  zone). If FundingPIT returns None (empty bundle / insufficient history / no
  settlement asof) BOTH sides are BLOCKED fail-closed and the block is counted
  (strategy.funding_gate_blocks). HTF filter fixed ON; no other parameter may
  vary.

invalidating_evidence:
  # Primary quantitative rule — ANY of these => REJECT this family version:
  - aggregate after-cost expectancy <= 0 on the S0 chrono-3-fold scored window
    => REJECT family version
  - aggregate position PF < 1.10 on the scored window => REJECT family version
  - positive folds < 2/3 on the scored window (after cost) => REJECT family
    version
  # Supporting evidence (same rejection path):
  - any fold with >=5 trades and PF < 0.80
  - single fold contributes >50% of total PnL (concentration)
  - gated variant does NOT beat the ungated frozen reclaim_mr baseline on
    identical folds (gate adds complexity without edge; baseline stays
    rejected too)
  - expectancy non-positive under +50% fee stress or one-bar-delayed-entry
    stress while baseline stress run is positive
  # Not a rejection but blocks PASS:
  - fewer than 20 closed trades total across required universe =>
    INCONCLUSIVE (never PASS)

warmup_bars: 320
universe:                            # S0-seven (contracts/README.md)
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - LINKUSDT
  - ADAUSDT
  - ETHUSDT

cost_assumptions: >
  Maker/taker commission model, one-tick slippage, post-trade funding audit
  (native engine funding not available; carry enters via audit AND via the
  gate itself). Survivor gate additionally requires positive expectancy under
  +50% fee stress and one-bar-delayed-entry stress (PLAN §9 G4): same-bar-close
  fills are optimistic, so delay stress is mandatory (A4 challenge memo,
  Finding 1).

