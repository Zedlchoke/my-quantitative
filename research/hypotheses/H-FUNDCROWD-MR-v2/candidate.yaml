notes_for_lock_reviewer: >
  Family name is funding_crowding because ONLY the funding percentile enters
  the signal (PLAN §11 / H18-H22 correction list). Adding OI later requires a
  new candidate version, OI timestamp/publication-delay evidence, an updated
  trial budget, and renaming to funding_oi_crowding. Gate boundary asymmetry
  is intentional per spec text: long uses strict > at threshold_p/100; short
  uses inclusive <= at (100-threshold_p)/100. Unit tests encode both bounds.
