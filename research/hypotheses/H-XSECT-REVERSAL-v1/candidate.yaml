# H-XSECT-REVERSAL-v1 — pre-registration (state machine: IDEA, DRAFT-ONLY)
# Fields conform to contracts.protocol.HypothesisSpec (+ mandated parameter_grid
# and split_policy). NO implementation. Blocked on data. Owner: A4.
hypothesis_id: H-XSECT-REVERSAL-v1
family: cross_sectional_reversal
state: IDEA
candidate_version: 1
economic_mechanism: >
  Weekly cross-sectional losers among liquid perps outperform recent winners
  over the following week (short-term reversal): crowded-momentum names mean-
  revert once positioning saturates; a weekly rank-based long-losers/
  short-winners basket harvests this without timing any single name.
expected_counterparty: >
  Momentum chasers holding saturated winners into the reversal week.
expected_regimes:
  - post_momentum_saturation
  - high_dispersion_low_trend_weeks
invalidating_evidence:
  - common price history across the universe < declared minimum
  - after-cost expectancy non-positive at +50% fee stress while baseline positive
  - positive folds < 2/3 under the declared chronological split
entry_exit_rules: >
  DRAFT ONLY - no scored rules. Sketch: rank symbols by trailing 7d return;
  long bottom quintile / short top quintile equal-weight, rebalance weekly.
holding_horizon: 1 week rebalance cadence
warmup_bars: 672
universe:
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - LINKUSDT
  - ADAUSDT
  - ETHUSDT
cost_assumptions: >
  Maker/taker fees + one-tick slippage per leg; funding audit for held shorts;
  portfolio-level engine required (shared capital) - not available in current
  single-symbol matrix runner.
trial_budget_combinations: 0
parameter_grid: []   # none pre-registered; idea stage only
split_policy: S0_chrono3fold
implementation:
  status: NOT_IMPLEMENTED
blocked_on_data: DATA_INCOMPLETE
data_incomplete_note: >
  Common multi-symbol intersection is ~1y of 15m bars (contracts/README.md H0
  limitation); weekly-rank reversal needs longer common history for stable
  quintile ranks and >=20 observations per fold, and requires a careful
  portfolio engine (cross-sectional baskets cannot run in the current
  per-symbol cell runner). Do NOT score until both gaps close.
