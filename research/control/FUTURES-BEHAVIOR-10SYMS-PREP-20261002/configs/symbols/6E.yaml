  roll_rule:
    baseline: declared_calendar_last_trade_month
    baseline_definition: 'hold until last session BEFORE day-1 of the expiry month (last-trade month), roll at that close; last trade 09:16 CT, 2nd exchange-business-day before 3rd Wednesday of delivery month (IMM holiday shift: 6EF7 2027-01-15 MLK, 6EG7 2027-02-12 Presidents)'
