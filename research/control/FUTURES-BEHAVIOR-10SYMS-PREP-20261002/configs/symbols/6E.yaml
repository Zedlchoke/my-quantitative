    target_adjustment: next_HMUZ_quarterly - literal "next listed" routes into serial books (broken, OBSERVED) and rolls ~2 weeks before migration (old 23k-88k/day vs next 530-1,365 at declared rolls)
    dossier_finding: 'OBSERVED 6E S1: migration is quarterly->quarterly in IMM expiry week itself (next >=50k on 2025-12-12, 2026-03-13, 2026-06-11, 2026-09-11, 1-2 sessions before old expiry); 4-7 declared-rule thin sessions per quarter; CME FX Quarterly Roll Analyzer institutionalizes quarterly roll'
