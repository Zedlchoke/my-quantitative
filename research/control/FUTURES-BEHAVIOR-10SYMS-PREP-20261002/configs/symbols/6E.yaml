hypotheses:
- id: 6E-H1
  dossier_ref: 'dossiers/6E_DOSSIER.md S5 H1 (mechanics-level, testable NOW)'
  hypothesis_kind: construction_rule
  mechanism_class: POSTULATED
  mechanism: >-
    Quarterly IMM expiries concentrate options/roll/swap-related flow (CME's own FX Quarterly
    Roll Analyzer institutionalizes this); serials never attract the migration. Quarterly-only
    selection + expiry-week roll avoids (i) serial books (333:1 volume ratio) and (ii) 4-7
    declared-rule thin sessions per quarter, matching the 4/4 measured migration ramps.
  pit_trigger:
    mechanizable: true
    observable: calendar-only - front = nearest HMUZ; roll at last session of the week before IMM expiry week (or T-2 sessions before old last trade), IMM holiday shift applied
    field: exchange listing calendar + holiday-shifted lastTradeDate set (20/20 matched with holidays modeled)
    source: S1 chain (resolves to 2031)
    as_of_rule: fully knowable in advance; naive Mon-Fri expiry arithmetic is WRONG for Jan/Feb contracts (MLK/Presidents shift)
    timestamp_at_decision: deterministic calendar date
  direction: n/a (construction rule)
  entry: switch reference contract at declared calendar time
  exit: n/a
  take_profit: n/a
  stop_loss: n/a
  time_rules: quarterly
  universe: 6E HMUZ chain
  roll_rule_ref: this IS the roll A/B (declared timing + quarterly target vs expiry-week roll)
  sizing: n/a
  regime_tags: [all_regimes_mechanical]
  counter_hypothesis: migration is volume/OM-driven not calendar (exact crossover unmeasurable - prospective collector can test)
  failure_conditions:
  - a cycle where the next-quarterly ramp deviates >3 sessions from IMM week
  - serial-month volume exceeding next-quarterly during any migration window
  - nearest-expiry or IB-front symbol mapping (lands on serials); naive Mon-Fri expiry arithmetic
  minimal_test:
    kind: construction_rule_check_against_measured_ramps
    requirements:
    - {class: daily_trades_per_contract, symbols: [6E], use: construction_check, floor: 'ALREADY MET by raw daily files (4/4 ramps + serial windows measured)', floor_met: true, available_today: true, acquisition: in_hand_now}
    nondata_blockers: []
  scored_run:
    kind: construction_rule_embedded_in_all_arm_b_cells
    requirements:
    - {class: daily_trades_per_contract, symbols: [6E], use: backtest_fill, floor: '>=24m true volume (front-scale era 2025-09-09..2026-10-01 n=247)', floor_met: false, available_today: false, acquisition: vendor_paid}
    nondata_blockers: [REGISTRATION_REQUIRED_FOR_SCORED_RUN, REAL_HOLIDAY_CALENDAR_NOT_RUN]
  param_gaps: []
  feasibility:
    mechanization: high
    acquisition_cost: in_hand_now
    rank_basis_note: 'dossier: data requirements ALREADY MET, floor none, budget 0'
  rank: 1
- id: 6E-H2
  dossier_ref: 'dossiers/6E_DOSSIER.md S5 H2'
  hypothesis_kind: structural_relation
  mechanism_class: POSTULATED
  mechanism: >-
    Covered-interest parity anchors deferred futures vs spot (cash-futures arbitrage): the
    quarterly roll-gap sign tracks the USD-EUR short-rate differential (4/4 measured positive
    2025-11..2026-08, +82..+106 ticks = +1.4-1.8%/yr); sign flips if EUR rates rise above USD.
  pit_trigger:
    mechanizable: true
    observable: adjacent-quarterly close gap at each roll vs contemporaneous ~3M USD and EUR short rates
    field: roll gaps (measured) + SOFR/EUR short-rate series
    source: raw roll tables + FRED SOFR / ECB SDW EUR STR (free, not pulled)
    as_of_rule: contemporaneous quarter values; settlement-derived deferred closes are marks, never fills; roll-boundary returns excluded from unadjusted series
    timestamp_at_decision: quarterly roll dates
  direction: n/a (structural relation informing construction drift + calendar-spread ideas)
  entry: n/a
  exit: n/a
  take_profit: n/a
  stop_loss: n/a
  time_rules: quarterly
  universe: adjacent HMUZ pairs
  roll_rule_ref: defaults.roll_rule (gaps are its byproduct)
  sizing: n/a
  regime_tags: [usd_rates_above_eur, rate_convergence_flip]
  counter_hypothesis: gaps driven by roll-flow pressure, not rates
  failure_conditions:
  - persistent positive gap while r_USD < r_EUR (hedging-flow premium dominates CIP)
  - roll-boundary returns left in unadjusted series (contamination)
  minimal_test:
    kind: descriptive_gap_vs_rate_differential_sign
    requirements:
    - {class: derived_roll_gaps, symbols: [6E], use: signal_reference, floor: '>=8 quarters for a sign statement (4 measured)', floor_met: false, available_today: true, acquisition: in_hand_now}
