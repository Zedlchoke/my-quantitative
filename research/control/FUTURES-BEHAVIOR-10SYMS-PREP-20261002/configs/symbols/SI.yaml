  counter_hypothesis: 'apparent amplification is a volatility-scaling artifact - must normalize by vol before claiming convexity (framework S4 explicit question)'
  failure_conditions:
  - elasticity < 1 persistently, or convexity absent (linear beta suffices) across >=2 regimes
  - single-episode attribution (the Jan-2026 squeeze IS one event)
  - vol-normalization not performed
  minimal_test:
