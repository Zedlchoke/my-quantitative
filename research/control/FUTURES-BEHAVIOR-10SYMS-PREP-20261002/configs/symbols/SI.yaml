    nondata_blockers: [PARAM_GAP_MUST_BE_PRE_REGISTERED]
  scored_run:
    kind: daily_backtest_arm_b
    requirements:
    - {class: daily_trades_per_contract, symbols: [SI, GC], use: backtest_fill, floor: multi-year two-leg daily, floor_met: false, available_today: false, acquisition: vendor_paid}
