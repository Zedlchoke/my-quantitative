    source: raw daily both symbols
    as_of_rule: regime label trailing-only; response measured after the shock session
    timestamp_at_decision: daily close-to-close
  direction: same sign as GC shock
  entry: next-session open after GC shock (PARAM-GAP threshold)
  exit: declared horizon (PARAM-GAP)
  take_profit: 'PARAM_GAP: SI-H4-P1'
  stop_loss: 'PARAM_GAP: SI-H4-P1'
  time_rules: short horizon (days)
  universe: SI cycle front + GC cycle front
  roll_rule_ref: defaults.roll_rule both
  sizing: beta-scaled (declared formula)
