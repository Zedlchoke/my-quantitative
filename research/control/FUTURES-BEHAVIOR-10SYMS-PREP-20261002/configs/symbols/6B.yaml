    commission: {usd_per_side: 0.85, provenance: 'PUBLISHED IBKR 2026-10-02'}
    exchange_fee: {provenance: NOT_RUN_NOT_FETCHED}
    spread: {median_usd_per_contract: 12.5, provenance: 'MEASURED daily-BBO close proxy 2 ticks = $12.50 on quarterly front-scale days (n=239, 0 crossed; S6 3-tick row used thin serial 6BV6)', caveat: non-synchronous, not executable; tick-size public conflict 0.0001 vs 0.0002 flagged (S1 0.0001 governs)}
    slippage: {provenance: NOT_RUN_NO_DECLARED_VALUE}
    stress_multipliers: [1.0, 1.5, 2.0]
hypotheses:
- id: 6B-H5
  dossier_ref: 'dossiers/6B_DOSSIER.md S5 H5 (partial proxy measurable, descriptive-only)'
  hypothesis_kind: event_reaction
  mechanism_class: POSTULATED
  mechanism: >-
    Pre-positioning + release repricing: on BLS 08:30 ET CPI days the 6B RTH open-vs-prior-close
    gap (which embeds the 07:30 CT release minute) should be larger in magnitude than on
    non-release days.
  pit_trigger:
    mechanizable: true
    observable: verified BLS CPI release calendar (12 of 2026 dates verified, FACT) + daily gap machinery
    field: release-date flag; RTH open vs prior RTH close
    source: bls.gov schedule (fetched 2026-10-02) + raw daily quarterly chain
    as_of_rule: calendar known in advance; gap normalized by trailing-20d mean|ret| (strict past, window ends prior session)
    timestamp_at_decision: 08:30 CT open (the release lands inside the hidden gap - NOT an executable signal)
  direction: n/a (descriptive magnitude comparison only)
  entry: none (entry timing inside the gap is unknowable without intraday)
  exit: n/a
  take_profit: n/a
  stop_loss: n/a
  time_rules: release days vs matched non-release days
  universe: 6B quarterly chain (front-scale era ~13 months, ~12 CPI dates)
  roll_rule_ref: defaults.roll_rule
  sizing: n/a (measurement)
  regime_tags: [all_regimes_descriptive]
  counter_hypothesis: gap distribution on release days ~ non-release days (no pre-positioning)
  failure_conditions:
  - gap distributions indistinguishable
  - treated as an executable signal (forbidden without intraday)
  minimal_test:
    kind: descriptive_release_day_gap_distribution
    requirements:
    - {class: event_release_calendars, symbols: [US], use: event_calendar_descriptive, floor: 'BLS CPI schedule (FACT, fetched; NFP dates NOT_RUN this lane)', floor_met: true, available_today: true, acquisition: in_hand_now}
    - {class: daily_trades_per_contract, symbols: [6B], use: conditional_descriptive, floor: 'front-scale era gap series (measured: 11.9% of days gap >=2x trailing mean)', floor_met: false, available_today: true, acquisition: in_hand_now}
    nondata_blockers: []
  scored_run:
    kind: descriptive_only_no_scored_version (design ready; measurement NOT_RUN this cycle by scope)
    requirements:
    - {class: daily_trades_per_contract, symbols: [6B], use: conditional_descriptive, floor: same, floor_met: false, available_today: true, acquisition: in_hand_now}
    nondata_blockers: [REGISTRATION_REQUIRED_FOR_SCORED_RUN]
  param_gaps: []
  feasibility:
    mechanization: high
    acquisition_cost: in_hand_now
    rank_basis_note: 'dossier: design ready, PREP-legal descriptive on data in hand; kept descriptive-only'
  rank: 1
- id: 6B-H1
  dossier_ref: 'dossiers/6B_DOSSIER.md S5 H1 (rank 1 in dossier: measured on data in hand)'
  hypothesis_kind: execution_rule
  mechanism_class: POSTULATED
  mechanism: >-
    Liquidity network effects: MM quotes concentrate where open interest sits; hedgers follow.
    The calendar roll is an artifact of the generic data-lane rule, not of 6B
    microstructure - a volume-crossover roll (new contract's own trailing volume, PIT-legal)
    tracks true liquidity better and captures more liquid sessions.
  pit_trigger:
    mechanizable: true
    observable: new quarterly trailing-5d RTH volume >= x% of old's trailing-5d (x PARAM-GAP - only 4 real-era rolls exist; do not invent)
    field: per-contract daily RTH volume
    source: raw daily files (front-scale era 2025-09-11..2026-10-01; old-side inside expiry month unobservable)
    as_of_rule: trailing windows strictly past; decision at close; forced exit at old last-trade minus 1 session
    timestamp_at_decision: daily close
  direction: long/short agnostic (execution-quality hypothesis)
  entry: switch old->next-quarterly at first close satisfying the condition
  exit: forced at old last trade - 1 session
  take_profit: n/a
  stop_loss: n/a
  time_rules: one quarter per decision
  universe: quarterly HMUZ chain only (serials excluded)
  roll_rule_ref: this IS the roll A/B (declared calendar vs volume-crossover)
  sizing: 1 contract unit (descriptive)
  regime_tags: [all_regimes_mechanical]
  counter_hypothesis: liquidity flips exactly at month-end; the measured "8-9 sessions late" is a fetch-window artifact of the NEW contract's early ramp
  failure_conditions:
  - crossover date varies >+-5 sessions across future rolls
  - old-side volume (unobservable here) shows the flip happened before the declared date
  - only-4-rolls sample treated as stable; settlement-derived old bars used
  minimal_test:
    kind: descriptive_roll_migration_measurement
    requirements:
    - {class: daily_trades_per_contract, symbols: [6B], use: construction_check, floor: 'daily per-contract RTH volume >=24 months (have 13.5 front-scale; 4 rolls measured; floor >=12 rolls before stability claim)', floor_met: false, available_today: true, acquisition: in_hand_now}
    nondata_blockers: []
  scored_run:
    kind: daily_backtest_arm_b
    requirements:
    - {class: daily_trades_per_contract, symbols: [6B], use: backtest_fill, floor: '>=24m incl. >=12 rolls', floor_met: false, available_today: false, acquisition: vendor_paid}
    nondata_blockers: [REGISTRATION_REQUIRED_FOR_SCORED_RUN]
  param_gaps:
