  roll_rule:
    baseline: declared_calendar_last_trade_month
    baseline_definition: hold until last session BEFORE day-1 of the expiry month (last trade 09:16 CT, 2nd business day before 3rd Wednesday, holiday-shifted), roll at that close
    reference: code/futbt/roll.py + BACKTEST_LAUNCH_DRAFT.md S0
    target_adjustment: next_HMUZ_quarterly - literal next-listed includes serials (2-3 orders thin; expired serials absent from snapshot entirely so literal rule NOT reconstructable pre-2026-10)
    dossier_finding: 'OBSERVED 6B S1: at all 4 measured rolls the OLD quarterly printed 17.6k-58.4k while NEXT had 28-572; next reaches front scale 8-9 sessions AFTER the declared roll; old-side inside expiry month unobservable (fetch cut)'
