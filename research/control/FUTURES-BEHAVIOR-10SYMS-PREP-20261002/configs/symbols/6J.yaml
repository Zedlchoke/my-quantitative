  roll_rule:
    baseline: declared_calendar_last_trade_month
    baseline_definition: hold until last session BEFORE day-1 of the held quarterly's delivery month (last trade 09:16 CT, 2 business days before 3rd Wednesday), roll at that close
    reference: code/futbt/roll.py + BACKTEST_LAUNCH_DRAFT.md S0
    target_adjustment: next_HMUZ_quarterly_MANDATORY - literal next-listed routes into dead serials (declared rule is a DEFECT for 6J, not a baseline) and 8 serial targets are absent from the snapshot anyway
    dossier_finding: 'OBSERVED 6J S1: old quarterly dominant through its final pre-delivery session (no pre-roll crossover within +-10 sessions); new quarterly ramps ~2 weeks post-roll; roll gaps always positive (quarterly +92..+109 ticks; serial +28/+34)'
    alternative_required: volume/OI-gated rule (OI NOT_RUN); calendar-serial rule recorded as known defect
  execution_laws:
    decision_point: session_close_through_pit_view
    default_fill: next_session_open_tick_rounded_cost_shifted
    ambiguous_order: same_bar_tp_sl_worst_case_bound_no_point_pnl
    close_only_bars: never_fill_any_path
    tb_labels: TRAIN_ONLY_never_validation_features
    adjusted_series: causal_additive_features_only_never_fills_mtm_pnl
    attribution: full_path_leave_one_out_only_additive_leg_sums_forbidden
  cost_model:
    commission: {usd_per_side: 0.85, provenance: 'PUBLISHED IBKR 2026-10-02'}
    exchange_fee: {provenance: NOT_RUN_NOT_FETCHED}
    spread: {median_usd_per_contract: 12.5, provenance: 'MEASURED daily-BBO close proxy: quarterly fronts last-20 1-2 ticks ($6.25-12.50); S6 4-tick row was the serial 6JV6 (quotes tight on dead serials while depth ~nil)', caveat: non-synchronous, not executable}
    slippage: {provenance: NOT_RUN_NO_DECLARED_VALUE}
    stress_multipliers: [1.0, 1.5, 2.0]
hypotheses:
- id: 6J-H1
  dossier_ref: 'dossiers/6J_DOSSIER.md S5 H1 (rank 1 in dossier: fully measured already)'
  hypothesis_kind: construction_rule
  mechanism_class: POSTULATED
  mechanism: >-
    Liquidity lives on the HMUZ quarterly chain exclusively: a roll/selection rule restricted
    to HMUZ (roll at the declared session = last session before the held quarterly's delivery
    month) is the only executable baseline; the literal next-listed rule is a defect (serial
    fronts carry <=0.3% of volume).
  pit_trigger:
    mechanizable: true
    observable: calendar-only - exchange listing calendar + contract delivery months
    field: HMUZ delivery months (published years ahead)
    source: S1 chain (resolves to Sep-2031)
    as_of_rule: no lookahead; fully knowable in advance
    timestamp_at_decision: deterministic calendar date
  direction: none (execution/construction choice)
  entry: the roll switch itself
  exit: holding ~3 months (quarterly)
  take_profit: n/a
  stop_loss: n/a
  time_rules: quarterly cycle
  universe: 6J HMUZ chain
  roll_rule_ref: this IS the roll rule (quarterly-restricted)
  sizing: 1 contract baseline
  regime_tags: [all_regimes_mechanical]
  counter_hypothesis: serials someday liquid (CME incentives change)
  failure_conditions:
  - any future sample where a serial month carries >20% of the concurrent quarterly's volume over a full front window
  - vendor volume levels used for absolute liquidity (only relative shares are reliable)
  minimal_test:
    kind: construction_rule_check_measured_volumes
    requirements:
    - {class: daily_trades_per_contract, symbols: [6J], use: construction_check, floor: 'HAVE daily per-contract TRADES+BID/ASK (2020-12.., real-volume era 2025-05..2026-10)', floor_met: true, available_today: true, acquisition: in_hand_now}
    nondata_blockers: []
  scored_run:
    kind: construction_rule_embedded_in_all_arm_b_cells
    requirements:
    - {class: daily_trades_per_contract, symbols: [6J], use: backtest_fill, floor: '>=24m true volume (real-volume era 2025-05-20..2026-10-01, 342 returns)', floor_met: false, available_today: false, acquisition: vendor_paid}
    nondata_blockers: [REGISTRATION_REQUIRED_FOR_SCORED_RUN]
  param_gaps: []
  feasibility:
    mechanization: high
    acquisition_cost: in_hand_now
    rank_basis_note: 'dossier: fully measured already; budget $0; PARAM-GAP none for the rule itself'
  rank: 1
- id: 6J-H3
  dossier_ref: 'dossiers/6J_DOSSIER.md S5 H3 (measured structure, immediate use)'
  hypothesis_kind: structural_relation
  mechanism_class: POSTULATED
  mechanism: >-
    Covered-parity carry: the 6J curve embeds a -0.22..-0.33%/month roll drag for longs (100%
    of sessions near<far). COST-MODEL, not alpha: any FX-spot-derived long-JPY signal must
    clear ~2.2-2.7%/yr + spread/commission in futures; short-JPY signals receive that
    tailwind. Spot-corpus PnL does not transfer.
  pit_trigger:
    mechanizable: true
    observable: measured monthly/quarterly adjacent-contract gaps vs US-JPY short-rate differential
    field: curve gaps (measured) + USD/JPY rate series (vintaged, not fetched)
    source: raw curve + BOJ TONA + Fed/FRED ALFRED vintages
    as_of_rule: contemporaneous differentials; real-volume curve agrees 2025+; settlement-derived pre-2025 disclosed
    timestamp_at_decision: roll sessions / monthly curve points
  direction: both (hurdle applied to any directional hypothesis)
  entry: n/a (hurdle model)
  exit: n/a
  take_profit: n/a
  stop_loss: n/a
  time_rules: per roll cycle
  universe: HMUZ chain
  roll_rule_ref: defaults.roll_rule (6J-H1)
  sizing: '1'
  regime_tags: [usd_jpy_differential_positive, convergence_flip]
  counter_hypothesis: curve moves are expectations-driven, not covered-parity
  failure_conditions:
  - gap sign flips while the differential stays positive
  - settlement-derived bars misstate the curve pre-2025 (real-volume curve agrees 2025+)
  minimal_test:
    kind: descriptive_gap_vs_differential_sign
    requirements:
    - {class: derived_roll_gaps, symbols: [6J], use: signal_reference, floor: 'curve measured (100% near<far); rate loop needs vintaged series', floor_met: false, available_today: true, acquisition: in_hand_now}
    - {class: external_rates_vintages, symbols: [US, JP], use: regime_split_feature, floor: 'BOJ TONA + Fed funds/FRED vintages (free, not fetched)', floor_met: false, available_today: false, acquisition: free_public}
    nondata_blockers: []
  scored_run:
    kind: structural_input_to_arm_b
    requirements:
    - {class: derived_roll_gaps, symbols: [6J], use: signal_reference, floor: same, floor_met: false, available_today: true, acquisition: in_hand_now}
    nondata_blockers: [REGISTRATION_REQUIRED_FOR_SCORED_RUN]
  param_gaps:
  - {id: 6J-H3-P1, piece: rate series tenor pair, reason: 'vintaged USD/JPY series not fetched (free)'}
  feasibility:
