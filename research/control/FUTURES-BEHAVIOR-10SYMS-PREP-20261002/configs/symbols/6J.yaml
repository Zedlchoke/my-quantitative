  measured), costs ($6.25/tick), margin. Snapshot defects encoded: 8 missing serial months
  (6JV5,6JX5,6JF6,6JG6,6JJ6,6JK6,6JN6,6JQ6) so the literal next-listed rule is NOT
  executable 2025-09..2026-08; BoJ decisions land US-overnight (outside RTH bars).
defaults:
  universe:
    exchange: CME (Globex)
    contract_cycle: ~24 consecutive monthlies + HMUZ quarterlies to Sep-2031
