    nondata_blockers: [DECLARED_SLIPPAGE_MISSING, EXCHANGE_FEE_NOT_FETCHED, REGISTRATION_REQUIRED_FOR_SCORED_RUN]
  param_gaps:
  - {id: NQ-H5-P1, piece: any trade rule (entry/exit/TP/SL), reason: 'dossier: none specifiable until spread series is computed on >=2y real-volume data'}
  feasibility:
