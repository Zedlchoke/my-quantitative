    requirements:
    - {class: consensus_surprise_archive, symbols: [US], use: backtest_fill, floor: same as minimal, floor_met: false, available_today: false, acquisition: owner_declaration}
    - {class: minute_trades_m1, symbols: [NQ], use: intraday_execution, floor: multi-year M1, floor_met: false, available_today: false, acquisition: vendor_paid}
    nondata_blockers: [DECLARED_SLIPPAGE_MISSING, EXCHANGE_FEE_NOT_FETCHED, REGISTRATION_REQUIRED_FOR_SCORED_RUN, CONSENSUS_LICENSE_OWNER_DECISION]
  param_gaps:
