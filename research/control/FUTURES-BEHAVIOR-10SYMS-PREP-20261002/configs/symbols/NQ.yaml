  feasibility:
    mechanization: medium
    acquisition_cost: vendor_paid
    rank_basis_note: BLOCKED on consensus archive + deep intraday (dossier)
  rank: 4
- id: NQ-H5
  dossier_ref: 'dossiers/NQ_DOSSIER.md S5 H5'
  hypothesis_kind: structural_relation
  mechanism_class: POSTULATED
  mechanism: >-
    The adjacent-quarter calendar premium (~0.8-1.1%/quarter OBSERVED) embeds
    financing-minus-dividends; it should compress/persist predictably around macro rate
    repricing, and roll-week microstructure (spread widening, volume handoff) should be
    systematic at quarterly cadence.
  pit_trigger:
    mechanizable: true
    observable: adjacent-quarter spread change series vs FRED rate changes (descriptive clustering)
    field: new-minus-old adjacent-quarter closes per session + daily rate changes
    source: per-contract real-volume closes (>=2y needed) + FRED rates
    as_of_rule: both series as-of <= decision session close; settlement-derived deferred closes flagged, never fills
    timestamp_at_decision: daily close-to-close
  direction: n/a (descriptive-first; no rule specifiable yet per dossier)
  entry: none until spread series exists on >=2y real-volume data (dossier)
  exit: none (descriptive-first)
  take_profit: 'PARAM_GAP: none specifiable until spread series computed on >=2y real-volume data'
  stop_loss: 'PARAM_GAP: none specifiable'
  time_rules: quarterly cadence clustering
  universe: NQ adjacent quarterly pairs
  roll_rule_ref: defaults.roll_rule (roll table is the object of study)
  sizing: n/a
  regime_tags: [rate_repricing_windows, roll_week]
  counter_hypothesis: premium behavior dominated by settlement-quote noise (snapshot caveat)
  failure_conditions:
  - spread levels dominated by settlement-quote noise on deeper data
  - no clustering vs rate changes beyond chance
  minimal_test:
    kind: descriptive_term_structure_clustering
    requirements:
    - {class: daily_trades_per_contract, symbols: [NQ], use: signal_reference, floor: '>=2y real-volume per-contract for spread series (have ~16 months front + settlement-derived deep flagged)', floor_met: false, available_today: true, acquisition: in_hand_now, note: 'available at 16m depth only; floor 24m unmet - depth acquisition is the vendor line in scored_run'}
