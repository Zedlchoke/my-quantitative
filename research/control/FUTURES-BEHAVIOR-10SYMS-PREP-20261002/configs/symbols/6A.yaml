    liquid_chain_evidence: 'OBSERVED 6A S1 quarterly_vs_serial (serials 3-4 orders of magnitude below quarterlies)'
  roll_rule:
    baseline: declared_calendar_last_trade_month
    baseline_definition: hold until last session BEFORE day-1 of the delivery month (last trade 09:16 CT, 2nd business day before 3rd Wednesday), roll at that close
    reference: code/futbt/roll.py + BACKTEST_LAUNCH_DRAFT.md S0
    target_adjustment: 'next_HMUZ_quarterly - literal next-listed NOT executable on this snapshot 2025-11-28..2026-08-31 (6 serials absent: 6AF6,6AG6,6AJ6,6AK6,6AN6,6AQ6) and would hold 17-lot serial books when executable'
    dossier_finding: 'OBSERVED 6A S1: new quarterly reaches front scale 6-11 sessions AFTER the roll date (no pre-roll migration, unlike GC); old-side decay unobservable (files truncated at day-1 of expiry month); quarterly adaptation executable and IS the liquidity chain'
    alternative_required: 'volume/OI roll (OI not in raw; crossover unobservable - old-side truncated); TIME-CRITICAL $0 fix: re-fetch 6 serials before expired-resolve wall (6AF6/6AG6 age out ~Jan-Mar 2027)'
  execution_laws:
    decision_point: session_close_through_pit_view
    default_fill: next_session_open_tick_rounded_cost_shifted
    ambiguous_order: same_bar_tp_sl_worst_case_bound_no_point_pnl
    close_only_bars: never_fill_any_path
    tb_labels: TRAIN_ONLY_never_validation_features
    adjusted_series: causal_additive_features_only_never_fills_mtm_pnl
    attribution: full_path_leave_one_out_only_additive_leg_sums_forbidden
  cost_model:
    commission: {usd_per_side: 0.85, provenance: 'PUBLISHED IBKR 2026-10-02'}
    exchange_fee: {provenance: NOT_RUN_NOT_FETCHED}
    spread: {median_usd_per_contract: 10.0, provenance: 'MEASURED daily-BBO close proxy 2 ticks = $10 on QUARTERLY front (n=241, 0 crossed; supersedes S6 4-tick row measured on serial 6AV6 = $20)', caveat: non-synchronous, not executable; tick-size conflict 0.00005 (S1) vs 0.0001 (legacy mirrors) unadjudicated}
    slippage: {provenance: NOT_RUN_NO_DECLARED_VALUE}
    stress_multipliers: [1.0, 1.5, 2.0]
hypotheses:
- id: 6A-H1
  dossier_ref: 'dossiers/6A_DOSSIER.md S5 H1 (rank 1 in dossier: only event family fully in legal daily data)'
  hypothesis_kind: event_reaction
  mechanism_class: POSTULATED
  mechanism: >-
    Policy-rate path repricing -> carry/flow rebalancing: AUD is the direct policy asset and
    the RBA decision (14:30 Sydney = 22:30 CT prior day) hits the home session; the next RTH
    open gap should carry the decision direction more than non-event days.
  pit_trigger:
    mechanizable: true
    observable: 'RBA decision timestamp (calendar known years ahead, FACT: 8 meetings/yr, 14:30 Sydney announcement) + event-day vs non-event-day gap distribution comparison (descriptive first)'
    field: event-date flag; RTH open vs prior close on the quarterly chain
    source: rba.gov.au decision + interest-rate-decisions pages (fetched 2026-10-02, primary) + raw daily
    as_of_rule: decision lands 22:30 CT prior calendar day - captured ONLY as the next RTH open gap; hawkish/dovish classification needs market pricing (PARAM-GAP) - weaker proxy = cash-rate change vs prior-meeting pricing from RBA media releases (FACT)
    timestamp_at_decision: next RTH session open after the decision
  direction: conditional (hawkish -> long 6A) - descriptive magnitude comparison first
  entry: 'descriptive first (no trade): event-day vs non-event-day gap distributions; any trade version requires Globex data at 22:30 CT (PARAM-GAP)'
  exit: n/a (descriptive)
  take_profit: 'PARAM_GAP: 6A-H1-P2 (trade version only)'
  stop_loss: 'PARAM_GAP: 6A-H1-P2'
  time_rules: overnight -> first RTH session
  universe: 6A quarterly front (declared roll, quarterly adaptation - serials un-executable)
  roll_rule_ref: defaults.roll_rule
  sizing: n/a (measurement)
  regime_tags: [active_easing_cycle, active_tightening_cycle, hold_streak_priced_in]
  counter_hypothesis: RBA decisions fully pre-priced (long hold streaks) - no gap differential
  failure_conditions:
  - RBA-day gap distribution indistinguishable from non-event days over >=16 meetings
  - surprise classification requires consensus data not in corpus (weak-proxy version must be labeled as such)
  minimal_test:
    kind: descriptive_event_day_gap_distribution
    requirements:
    - {class: event_release_calendars, symbols: [AU], use: event_calendar_descriptive, floor: 'RBA decision dates + times (FACT, fetched 2026-10-02; 8/yr)', floor_met: true, available_today: true, acquisition: in_hand_now}
    - {class: daily_trades_per_contract, symbols: [6A], use: conditional_descriptive, floor: 'daily RTH opens around all meetings + gap machinery (front-scale era 2025-09-10..2026-10-01)', floor_met: false, available_today: true, acquisition: in_hand_now}
    nondata_blockers: []
  scored_run:
    kind: daily_backtest_arm_b
    requirements:
    - {class: rba_market_pricing, symbols: [AU], use: signal_reference, floor: '5-min AUD/USD or Globex M1 at 22:30 CT (vendor) for surprise classification + entry realism', floor_met: false, available_today: false, acquisition: vendor_paid}
    - {class: daily_trades_per_contract, symbols: [6A], use: backtest_fill, floor: '>=24m true volume', floor_met: false, available_today: false, acquisition: vendor_paid}
    nondata_blockers: [DECLARED_SLIPPAGE_MISSING, EXCHANGE_FEE_NOT_FETCHED, REGISTRATION_REQUIRED_FOR_SCORED_RUN]
  param_gaps:
  - {id: 6A-H1-P1, piece: hawkish/dovesh surprise classification rule, reason: 'market pricing NOT in corpus (dossier: PARAM-GAP); weak RBA-release proxy must be labeled'}
  - {id: 6A-H1-P2, piece: trade-version entry/TP/SL, reason: 'entry realism requires Globex 22:30 CT data'}
  feasibility:
    mechanization: high
    acquisition_cost: in_hand_now
    rank_basis_note: 'dossier: only event family fully in legal daily data; $0 for the daily version'
  rank: 1
