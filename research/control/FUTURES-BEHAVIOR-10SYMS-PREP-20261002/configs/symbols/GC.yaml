- id: GC-H2
  dossier_ref: 'dossiers/GC_DOSSIER.md S5 H2'
  hypothesis_kind: event_reaction
  mechanism_class: POSTULATED
  mechanism: >-
    Gold = duration-like zero-coupon real asset: GC's same-day move should follow the
    REAL-rate implication of a CPI print (breakeven path vs nominal path), not the headline
    inflation sign.
  pit_trigger:
    mechanizable: true
    observable: CPI first print + same-morning nominal yield & breakeven moves (all 08:30 ET)
    field: CPI actual vs consensus + TIPS/breakeven intraday response
    source: BLS schedule FACT + treasury.gov/FRED vintages (not fetched) + consensus (licensed, MISSING)
    as_of_rule: first-print vintage; same-morning window; entry 08:30:05 ET requires M1 depth (NOT_RUN before ~2025-12)
    timestamp_at_decision: 08:30 ET release minute
  direction: conditional (sign(real-rate change))
  entry: '08:30:05 ET (PARAM-GAP: no M1 depth; test-0 = measurement first, no trade)'
  exit: same close
  take_profit: none in test-0 (measurement first)
