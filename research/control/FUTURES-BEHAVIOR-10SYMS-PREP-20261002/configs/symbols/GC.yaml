    source: treasury.gov / FRED ALFRED vintages (not fetched)
    as_of_rule: vintage-clean first-release values mandatory
    timestamp_at_decision: daily close alignment
  direction: short GC on real-yield-up shocks (outside crisis regime)
  entry: not specifiable as a trade rule yet (dossier)
  exit: not specifiable
  take_profit: 'PARAM_GAP: not specifiable'
  stop_loss: 'PARAM_GAP: not specifiable'
  time_rules: days-weeks horizon (mechanism only)
  universe: GC front
  roll_rule_ref: defaults.roll_rule
  sizing: n/a at this stage
  regime_tags: [real_rate_led, crisis_bid]
  counter_hypothesis: USD co-move dominates the real-rate channel
  failure_conditions:
