- id: NG-H2
  dossier_ref: 'dossiers/NG_DOSSIER.md S5 H2 (rank 2 in dossier)'
  hypothesis_kind: regime_conditional
  mechanism_class: POSTULATED
  mechanism: >-
    Traders reprice the balance as forecast vintages revise: day-over-day HDD/CDD forecast
    revisions predict 1-5 day front drift in the demand direction - but only when the storage
    buffer is thin; ample-storage regimes mute or reverse the response.
  pit_trigger:
    mechanizable: true
    observable: consecutive GFS vintage (00Z vs prior 00Z) population-weighted HDD/CDD forecast change exceeding k degree-days (PARAM-GAP)
    field: forecast degree-days by run date + cycle hour (immutable vintages)
    source: NOAA NOMADS archive keyed by run date + cycle dir (FACT archive structure, accessed 2026-10-02); storage percentile from EIA WNGSR
    as_of_rule: FORECAST VINTAGES ONLY (never realized weather); entry 10:00 ET after vintage availability - per-cycle latency must be MEASURED first (NOT_RUN)
    timestamp_at_decision: cycle run timestamp; entry gate on measured latency
  direction: with the revision (demand direction)
  entry: 10:00 ET after vintage availability (latency-gated)
  exit: 1-5 days or offsetting revision
  take_profit: 'PARAM_GAP: NG-H2-P2'
  stop_loss: 'PARAM_GAP: NG-H2-P2'
  time_rules: 1-5 day horizon
  universe: NG front chain
  roll_rule_ref: defaults.roll_rule
  sizing: vol-scaled (declared formula)
  regime_tags: [tight_storage_low_percentile, ample_storage, winter, shoulder]
  counter_hypothesis: revisions already priced intraday (test entry-delay sensitivity)
  failure_conditions:
  - symmetric fade absent / response dies at 2x costs
  - sign flips by season without percentile control
  - realized weather accidentally used as a PIT feature (forbidden)
  minimal_test:
    kind: descriptive_forecast_revision_conditioned_return
    requirements:
    - {class: weather_forecast_vintages, symbols: [NG], use: signal_reference, floor: 'NOMADS vintages collector + latency measurement (not built)', floor_met: false, available_today: false, acquisition: free_public}
    - {class: eia_wngsr_vintages, symbols: [NG], use: regime_split_feature, floor: 'storage percentile series (free, not pulled)', floor_met: false, available_today: false, acquisition: free_public}
    - {class: daily_trades_per_contract, symbols: [NG], use: conditional_descriptive, floor: '14m true-volume + deeper settlement reference', floor_met: false, available_today: true, acquisition: in_hand_now}
    nondata_blockers: []
  scored_run:
    kind: daily_backtest_arm_b
    requirements:
    - {class: weather_forecast_vintages, symbols: [NG], use: backtest_fill, floor: multi-year vintages, floor_met: false, available_today: false, acquisition: free_public}
    nondata_blockers: [DECLARED_SLIPPAGE_MISSING, EXCHANGE_FEE_NOT_FETCHED, REGISTRATION_REQUIRED_FOR_SCORED_RUN]
  param_gaps:
  - {id: NG-H2-P1, piece: 'k degree-days threshold', reason: no measured basis}
  - {id: NG-H2-P2, piece: exit/TP/SL + vol-scaling formula, reason: pre-registration required}
  feasibility:
    mechanization: medium
    acquisition_cost: free_public
    rank_basis_note: weather vintages + storage both free; collector build effort only
  rank: 3
- id: NG-H4
  dossier_ref: 'dossiers/NG_DOSSIER.md S5 H4 (rank 4 in dossier)'
  hypothesis_kind: regime_conditional
  mechanism_class: POSTULATED
  mechanism: >-
    Risk premium unwinds faster than fundamentals justify: extreme k-day front moves driven by
    a cold-forecast spike that then normalizes in the next vintage should partially retrace
    over 1-3 days; strongest in winter, weakest when normalization confirms a physical shock
    (freeze-off).
  pit_trigger:
    mechanizable: true
    observable: 'front k-day return extreme AND cold-forecast spike that normalizes in the next GFS vintage'
    field: k-day front return (strict past threshold) + forecast-vintage normalization flag
    source: daily futures + NOMADS vintages
    as_of_rule: entry only after the NORMALIZING vintage is available (not after the price move); freeze-off confirmation is a disclosed failure regime
    timestamp_at_decision: normalizing-vintage availability timestamp
  direction: against the spike (retrace)
  entry: after normalizing vintage
  exit: 1-3 days (PARAM-GAP)
  take_profit: 'PARAM_GAP: NG-H4-P2'
  stop_loss: 'PARAM_GAP: NG-H4-P2'
  time_rules: 1-3 day horizon
  universe: NG front chain
  roll_rule_ref: defaults.roll_rule
  sizing: vol-scaled (declared formula)
  regime_tags: [winter, freeze_off_confirmed, normal]
  counter_hypothesis: drift continues (underreaction)
  failure_conditions:
  - retrace <= declared costs
  - freeze-off weeks (normalization = physical shock) dominate the sample
  minimal_test:
    kind: descriptive_premium_reversion
    requirements:
    - {class: weather_forecast_vintages, symbols: [NG], use: signal_reference, floor: vintages collector (not built), floor_met: false, available_today: false, acquisition: free_public}
    - {class: daily_trades_per_contract, symbols: [NG], use: conditional_descriptive, floor: '>=3y daily true-volume for episode count (have 14m)', floor_met: false, available_today: true, acquisition: in_hand_now, note: 'available at 14m depth only; floor >=3y unmet'}
    nondata_blockers: []
  scored_run:
    kind: daily_backtest_arm_b
    requirements:
    - {class: daily_trades_per_contract, symbols: [NG], use: backtest_fill, floor: '>=3y true volume', floor_met: false, available_today: false, acquisition: vendor_paid}
    nondata_blockers: [DECLARED_SLIPPAGE_MISSING, EXCHANGE_FEE_NOT_FETCHED, REGISTRATION_REQUIRED_FOR_SCORED_RUN]
  param_gaps:
  - {id: NG-H4-P1, piece: 'k-day extreme threshold + normalization definition', reason: no measured basis}
  - {id: NG-H4-P2, piece: retrace fraction target + TP/SL, reason: pre-registration required}
  feasibility:
    mechanization: medium
    acquisition_cost: free_public
    rank_basis_note: free weather vintages gate it; daily depth also thin for episode count
  rank: 4
- id: NG-H1
  dossier_ref: 'dossiers/NG_DOSSIER.md S5 H1 (rank 1 in dossier by testability x causal plausibility)'
  hypothesis_kind: event_reaction
  mechanism_class: POSTULATED
  mechanism: >-
    Inventory is the binding state variable of a storable commodity: WNGSR print vs consensus
    at 10:30:00 ET Thursday moves the front in the surprise direction over minutes-to-hours,
    strongest at low storage percentile and in withdrawal season.
  pit_trigger:
    mechanizable: true
    observable: 'WNGSR print deviating from consensus by more than X Bcf (PARAM-GAP: X has no measured basis)'
    field: weekly storage Bcf + consensus median
    source: EIA WNGSR (schedule FACT; holiday moves Fri 10:30 / Wed 12:00) + consensus archive (vendor, not owned)
    as_of_rule: 'release 10:30 ET; stocks "as of Friday" prior week; weekly estimates are preliminary - vintages, never revised history; consensus as-known-before-release'
    timestamp_at_decision: first bar >= 10:31 ET
  direction: with the surprise
  entry: first bar >= 10:31 ET in surprise direction
  exit: time-stop same session or 1-3 days (PARAM-GAP)
  take_profit: none pre-registered (PARAM-GAP until post-release vol measured)
  stop_loss: none pre-registered (PARAM-GAP)
  time_rules: same-session to 1-3 days
  universe: NG front chain
  roll_rule_ref: defaults.roll_rule
  sizing: vol-scaled (PARAM-GAP)
  regime_tags: [low_storage_percentile, withdrawal_season, injection_season_weak]
  counter_hypothesis: 'reaction is a weather-revision proxy (control: same-week forecast deltas)'
  failure_conditions:
  - median post-event move <= costs at 1.5x
  - edge only on delayed (>=5 min) entries disappearing
  - only one winter in sample
  minimal_test:
    kind: descriptive_event_reaction
    requirements:
    - {class: eia_wngsr_vintages, symbols: [NG], use: signal_reference, floor: 'WNGSR vintages 1994+ (free, not pulled)', floor_met: false, available_today: false, acquisition: free_public}
    - {class: consensus_surprise_archive, symbols: [NG], use: signal_reference, floor: 'consensus archive (vendor)', floor_met: false, available_today: false, acquisition: owner_declaration}
    - {class: minute_trades_m1, symbols: [NG], use: intraday_event, floor: 'M1 >=5y around 10:30 (corpus has only 2-day M1 windows; ~2.2y requestable)', floor_met: false, available_today: false, acquisition: vendor_paid, note: '>=100 events floor'}
    nondata_blockers: [CONSENSUS_LICENSE_OWNER_DECISION]
  scored_run:
    kind: daily_backtest_arm_b
    requirements:
    - {class: minute_trades_m1, symbols: [NG], use: intraday_execution, floor: multi-year M1, floor_met: false, available_today: false, acquisition: vendor_paid}
    nondata_blockers: [DECLARED_SLIPPAGE_MISSING, EXCHANGE_FEE_NOT_FETCHED, REGISTRATION_REQUIRED_FOR_SCORED_RUN, CONSENSUS_LICENSE_OWNER_DECISION]
  param_gaps:
  - {id: NG-H1-P1, piece: 'surprise threshold X Bcf', reason: no measured basis (dossier explicit)}
  - {id: NG-H1-P2, piece: exit time-stop + TP/SL, reason: 'PARAM-GAP until post-release vol is measured'}
  feasibility:
    mechanization: medium
    acquisition_cost: vendor_paid
    rank_basis_note: highest causal plausibility in dossier but consensus (paid) + M1 depth gate it
  rank: 5
