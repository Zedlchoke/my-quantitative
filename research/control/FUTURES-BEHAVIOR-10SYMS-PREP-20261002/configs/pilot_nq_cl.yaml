controls:
  flat_baseline:
    description: no positions ever; measures cost-less drift of the journal/accounting harness (1 cell)
    n_cells: 1
  always_on_baselines:
    description: always-long and always-short in each leg universe, same roll/fill/cost path as active arms; any active-arm claim must beat these (2 cells)
    n_cells: 2
    variants: [always_long, always_short]
  single_leg_baselines:
    description: 'each leg alone on the identical execution/cost path (2 cells: NQ-only, CL-only) - the attribution anchor for combined arms'
    n_cells: 2
  leave_one_leg:
    description: FULL-PATH re-runs of the combined system with one leg removed (2 cells); leg-PnL SUMS are forbidden as attribution (engine law additive_attribution_guard); every leave-one-out cell re-runs the entire journal from t0
    n_cells: 2
    mode: FULL_PATH_RERUN
  on_off_accounting:
    missed_winners: 'for each leg and each session: trigger fired but the combined arm had the leg DISABLED (post leave-one-out or regime gate) -> the counterfactual labeled outcome is recorded from the single-leg full path; a missed winner = counterfactual net-positive after declared costs at 1.0x. Ex-post labels are DESCRIPTION-ONLY accounting, never entry features.'
    false_admissions: 'trades the combined arm ADMITTED (trigger on, leg enabled) whose realized net outcome after declared costs at 1.0x is negative; reported per leg per arm alongside missed winners so on/off asymmetry is visible, not just totals'
    bookkeeping: journal-level, per-session, deterministic; no counterfactual is ever netted into point PnL totals
  tb_labels_policy: TRAIN_ONLY_never_validation_features
  declared_cost_scenarios:
    stress_multipliers_variable_costs: [1.0, 1.5, 2.0]
    components:
      commission: {value: 0.85, unit: usd_per_side, provenance: PUBLISHED_IBKR}
      exchange_fee: {status: NOT_RUN_NOT_FETCHED, placeholder_class: 'ES-documented all-in 2.24/side as DECLARED placeholder ceiling for NQ/CL - never a measured cost; cells touching it report cost_incomplete=true and cannot claim pass bars'}
      spread: {NQ: {median_usd: 32.5, provenance: MEASURED_daily_bbo_proxy}, CL: {median_usd: 30.0, provenance: MEASURED_daily_bbo_proxy}}
      slippage: {status: NOT_RUN_NO_DECLARED_VALUE, scenario_S0: 'no declared value - all cost-complete claims FORBIDDEN', scenario_S1: 'owner-declared nonzero USD/contract/side + declarer + rationale REQUIRED before any Arm-B pass/fail statement (proposed-for-discussion default 1 tick/side is a DECLARED assumption, not a measurement)'}
    hard_rule: a complete cost total refuses to compute while any component is NOT_RUN (engine cost book law)
  entry_delay_sensitivity:
    slots_sessions: [0, 1, 2]
    requirement: 'framework test #9 / launch draft V4: every leg evaluated at all three entry delays; an edge that exists only at delay 0 is reported as execution-fragile, not as an edge'
  roll_rule_ab:
    arm_A_declared_calendar: 'declared calendar baseline (last session before day-1 of last-trade month; canonical basis) - both symbols per configs/symbols/{NQ,CL}.yaml defaults.roll_rule'
    arm_B_volume_switch: 'PIT volume-migration rule: cutoff t-1 (strictly-earlier volume only), confirmation 2 consecutive sessions (launch draft V1) - dossier tension being tested: NQ declared-rule thin first ~2 weeks of quarter vs CL old-contract 3-7x volume advantage at declared rolls (13/14) with n=1 leadership switch 4 days pre-LTD'
    hard_rule: 'roll-rule conclusions are separate cells, never mixed; result flipping sign between roll arms = construction-alpha disclosure (framework test #11)'
  ambiguous_order_law: same_bar_tp_sl_worst_case_bound_no_point_pnl
