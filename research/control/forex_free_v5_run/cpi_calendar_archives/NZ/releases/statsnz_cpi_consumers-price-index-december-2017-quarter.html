quot;,&quot;DocumentFileType&quot;:&quot;Adobe Acrobat PDF file&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788483994&quot;,&quot;DocumentSize&quot;:&quot;193 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;9734&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;cpi-dec17-tables-updated.xls&quot;,&quot;FileName&quot;:&quot;cpi-dec17-tables-updated.xls&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 tables&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:8439,&quot;OwnerID&quot;:37,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Consumers-price-index\/Consumers-price-index-December-2017-quarter\/CSV\/cpi-dec17-tables-updated.xls&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xls&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788483994&quot;,&quot;DocumentSize&quot;:&quot;611 KB&quot;,&quot;DocumentPreviewImage&quot;:false}],&quot;Heading&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}},&quot;Presentation&quot;:null},{&quot;ID&quot;:&quot;9545&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;&lt;p&gt;Inflation rate for the December 2017 quarter:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;quarterly change was 0.1 percent&lt;\/li&gt;\n&lt;li&gt;annual change was 1.6 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Annual change&lt;\/h3&gt;&lt;p&gt;From the December 2016 quarter to the December 2017 quarter, the CPI inflation rate was 1.6 percent.&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities increased 3.0 percent, with construction up 5.3 percent, and rentals for housing up 2.3 percent.&lt;\/li&gt;\n&lt;li&gt;Food prices increased 2.3 percent, with grocery food prices up 2.5 percent, and restaurant meals and ready-to-eat food up 2.3 percent.&lt;\/li&gt;\n&lt;li&gt;Telecommunication services prices fell 6.3 percent, due to better-value data plans.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;9365&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Consumers price index, annual change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2315,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Consumers price index, annual change &quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Dec-13,Mar-14,Jun-14,Sep-14,Dec-14,Mar-15,Jun-15,Sep-15,Dec-15,Mar-16,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17\r\nPercentage change,1.6,1.5,1.6,1,0.8,0.3,0.4,0.4,0.1,0.4,0.4,0.4,1.3,2.2,1.7,1.9,1.6\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, annual change&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9548&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Quarterly change&lt;\/h3&gt;&lt;p&gt;In the December 2017 quarter compared with the September 2017 quarter, the CPI rose 0.1 percent (up 0.4 percent with seasonal adjustment).&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Transport prices rose 3.2 percent, driven by higher petrol prices (up 6.1 percent), and international air fares (up 11 percent).&lt;\/li&gt;\n&lt;li&gt;Housing and household utilities rose 0.6 percent, influenced by a 1.3 percent rise in construction.&lt;\/li&gt;\n&lt;li&gt;Food prices fell 1.7 percent (up 0.2 percent after seasonal adjustment), with lower prices for vegetables (down 19 percent).&lt;\/li&gt;\n&lt;li&gt;Prices fell across a range of retail goods, including new cars, clothing, and appliances.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;9368&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Consumers price index, quarterly change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2318,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Consumers price index, quarterly chan&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Dec-13,Mar-14,Jun-14,Sep-14,Dec-14,Mar-15,Jun-15,Sep-15,Dec-15,Mar-16,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17\r\nPercentage change,0.1,0.3,0.3,0.3,-0.2,-0.2,0.4,0.3,-0.5,0.2,0.4,0.3,0.4,1,0,0.5,0.1\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, quarterly change&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9551&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Average quarterly prices&lt;\/h3&gt;&lt;ul&gt;\n&lt;li&gt;The average price for 1 litre of 91 octane petrol was $1.94 in the December 2017 quarter, up from $1.83 in the September 2017 quarter, and $1.82 in the December 2016 quarter.&lt;\/li&gt;\n&lt;li&gt;The average price of a pack of 25 cigarettes was $31.68 in the December 2017 quarter, up from $28.82 in the December 2016 quarter.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Annual increase in housing-related costs&lt;\/h3&gt;&lt;p&gt;&lt;strong&gt;Construction&lt;\/strong&gt; was a major contributor to the 1.6 percent annual increase in the CPI. Nationally, newly built houses saw a 5.3 percent increase in the year to December 2017. Regionally, newly built houses increased 6.5 percent in Auckland, 3.1 percent in Wellington, and 2.3 percent in Canterbury.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;9371&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI purchase of new housing by region, annual change to December 2017 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2321,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI purchase of new housing by region&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Region,New Zealand,Auckland,Wellington,Rest of North Island,Canterbury\r\nPercentage change,5.3,6.5,3.1,5.8,2.3\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI purchase of new housing by region, annual change to December 2017 quarter&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9554&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;&lt;strong&gt;Actual rentals for housing&lt;\/strong&gt; was another leading contributor to the annual increase in the CPI. Nationally, rents increased 2.3 percent in the year to December 2017. Regionally, rents increased 2.7 percent in Auckland and 3.6 percent in Wellington. Rents decreased 1.7 percent in Canterbury.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;9386&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI actual rentals for housing by region, annual change to December 2017 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2327,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI actual rentals for housing by reg&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Region,New Zealand,Auckland,Wellington,Rest of North Island,Canterbury\r\nPercentage change,2.3,2.7,3.6,2.7,-1.7\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI actual rentals for housing by region, annual change to December 2017 quarter&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9557&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Other housing-related costs that had large annual increases were local authority rates and payments (up 3.5 percent), property maintenance services (up 4.3 percent), electricity prices (up 2.0 percent), and dwelling insurance (up 13 percent).&lt;\/p&gt;&lt;h3&gt;Quarterly rise in transport offsets fall in food&lt;\/h3&gt;&lt;p&gt;&lt;strong&gt;Transport prices&lt;\/strong&gt; made the largest upward contribution to the CPI in the December 2017 quarter, mainly due to higher petrol prices (up 6.1 percent). Regionally, petrol prices rose the most in Wellington (up 7.1 percent) and the South Island (up 6.9 percent). Auckland petrol prices rose 5.8 percent, while prices were up 5.5 percent across the rest of the North Island.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;9389&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI petrol by region, quarterly change, December 2017 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2330,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI petrol by region, quarterly chang&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Region,New Zealand,Auckland,Wellington,Rest of North Island,South Island\r\nPercentage change,6.1,5.8,7.1,5.5,6.9\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI petrol by region, quarterly change, December 2017 quarter&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9560&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 6&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Regional petrol price movements started diverging from the September 2013 quarter.&lt;\/p&gt;&lt;p&gt;Seasonally higher international air fares rose 11 percent in the December 2017 quarter (up 0.5 percent after seasonal adjustment). International air fares typically rise in December quarters due to greater demand over the holiday period.&lt;\/p&gt;&lt;p&gt;Specialing on new car prices partly offset other rises in transport, with new car prices falling 6.2 percent this quarter. As part of the 2017 CPI review, we have increased our sample size and updated models of new cars to better reflect price changes experienced by consumers.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;9392&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Percentage points contribution to CPI, December 2017 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:null,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2333,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Percentage points contribution to CPI&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Household contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage point contribution,-0.331,-0.04,-0.052,0.146,-0.064,-0.013,0.436,-0.051,0.074,0.005,0.022\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Percentage points contribution to CPI, December 2017 quarter&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9563&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 7&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;&lt;strong&gt;Food prices&lt;\/strong&gt; fell 1.7 percent in the December 2017 quarter. Vegetable prices fell 19 percent due to seasonally lower prices for tomatoes, lettuce, and cucumbers. Tomatoes fell 48 percent, lettuce fell 34 percent, and cucumbers fell 59 percent.&lt;\/p&gt;&lt;p&gt;&lt;a title=\&quot;Link to Stats NZ&amp;#039;s archive site. \&quot; href=\&quot;http:\/\/archive.stats.govt.nz\/browse_for_stats\/economic_indicators\/CPI_inflation\/cpi-infogr-animation\&quot;&gt;Consumers price index \u2013 animation and infographic&lt;\/a&gt; has more about how the CPI works.&lt;\/p&gt;&lt;h3&gt;Retail prices fall&lt;\/h3&gt;&lt;p&gt;Lower prices for retail goods brought the CPI down in the December 2017 quarter. This partly reflects changing retail pricing structures, as major retailers have moved away from using short-term discounts or specials, to holding some prices consistently lower.&lt;\/p&gt;&lt;p&gt;Prices for household contents and services fell 1.5 percent. Glassware, tableware, and household utensil prices fell 6.2 percent this quarter, and are 2.7 percent lower than they were last year.&lt;\/p&gt;&lt;p&gt;Clothing and footwear fell 1.2 percent in the December 2017 quarter, despite fewer specials than in the September 2017 quarter. Women\u2019s clothing made the greatest contribution to the fall in clothing this quarter, down 2.3 percent.&lt;\/p&gt;&lt;h3&gt;Tradable inflation lower than CPI&lt;\/h3&gt;&lt;p&gt;&lt;strong&gt;Tradables&lt;\/strong&gt; increased 0.5 percent in the year to December 2017, with higher prices for petrol, dairy products, and fruit. Lower prices for new cars partly offset the increases.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Non-tradables&lt;\/strong&gt; increased 2.5 percent in the year to December 2017. Higher prices for cigarettes and tobacco, construction, and rents made the major contributions. Better value telecommunication services partly offset this increase, with more data on offer for consumers on their mobile devices.&lt;\/p&gt;&lt;h3&gt;Underlying price change higher for the quarter&lt;\/h3&gt;&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 1.4 to 1.8 for the year. On a quarterly basis, trimmed means ranged from 0.2 to 0.3, which is higher than the 0.1 percent overall rise in CPI.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;9398&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI trimmed means and all groups, percentage changes, December 2017 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Level of trim (percent)&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2339,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI trimmed means and all groups, per&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Groups,All groups,5,10,15,20,25,30\r\nQuarterly,0.1,0.3,0.3,0.3,0.2,0.2,0.3\r\nAnnual,1.6,1.4,1.5,1.6,1.7,1.8,1.8\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI trimmed means and all groups, percentage changes, December 2017 quarter&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9566&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 8&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Table 3.02 of the attached Excel tables shows selected groupings in the year to the December 2017 quarter:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding transport fell 0.3 percent this quarter&lt;\/li&gt;\n&lt;li&gt;CPI excluding food rose 0.6 percent this quarter&lt;\/li&gt;\n&lt;li&gt;CPI excluding housing and household utilities group was flat at 0.0 percent this quarter.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;New items and new weights after 2017 CPI review&lt;\/h3&gt;&lt;p&gt;This quarter we implemented the 2017 consumers price index review. Every three years, we conduct a review of items held within the CPI, and their relative importance, based on current household expenditure. As spending patterns change over time, we update our basket of goods and services to ensure we are accurately tracking the price changes households are experiencing.&lt;\/p&gt;&lt;p&gt;As a result of the review, we added 15 items to the CPI basket and removed 23 .We added a new item within the recreation and culture group, private accommodation rented from others, to get better coverage of accommodation services which has grown in relative importance. Private accommodation rented from others rose 13 percent in the December 2017 quarter.&lt;\/p&gt;&lt;p&gt;We also reviewed the relative weights of items in the CPI based on household expenditure. Expenditure on constructing new houses has increased and so its relative weight within the CPI has increased. The weight of petrol has fallen in this review.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;9407&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Consumer price index weights&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2342,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Consumer price index weights&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Household contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\n2011,18.8,6.9,4.4,23.6,4.4,5.4,15.1,3.5,9.1,1.8,6.8\r\n2014,18.8,7,4.2,24.2,4.7,3.9,15,3.6,9.4,1.9,7.3\r\n2017,19.3,7,4.3,24.5,4.5,3.8,13.9,3.2,9.5,2,8\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index weights&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9569&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 9&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;New weights affect price movements this quarter&lt;\/h3&gt;&lt;p&gt;The following graph shows how the change in weights has affected price movements in the December 2017 quarter. Food, clothing, and new cars have increased in weight during the 2017 review, so their price falls this quarter have made a greater contribution to the overall CPI, compared with using 2014 weights. This contrasts with petrol, which has decreased in weight, and so the quarterly rise has made a smaller contribution to the overall CPI.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;9413&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI groups, quarterly movement and index weight change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:2345,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 CPI groups, quarterly movement and in&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Household contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercent change in weight (2017-2014 review),0.5,0,0.1,0.2,-0.2,-0.1,-1,-0.4,0.1,0.1,0.7\r\nQuarterly price movement (Dec 2017),-1.7,-0.6,-1.2,0.6,-1.5,-0.3,3.2,-1.5,0.8,0.2,0.3\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI groups, quarterly movement and index weight change&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;9629&quot;,&quot;Title&quot;:&quot;CPI Dec17 - Correction note for graph CPI grps, qtrly movement and index weight change&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;div class=\&quot;WordSection1\&quot;&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;26 January 2018: We swapped the legend order of the graph above since this was first published at 10:45am on 25 January. We apologise for any inconvenience caused by this correction.&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/div&gt;&quot;},{&quot;ID&quot;:&quot;9572&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2017 quarter \u2013 key facts 10&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Within transport, the quarterly rise in petrol prices was partly offset by a decrease in weight. It was further offset by an increase in weight for purchase of new cars, which fell in price this quarter.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;9416&quot;,&quot;Title&quot;:&quot;CPI Dec 17 \u2013 Transport selected classes, quarterly movement and index weight change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Transport class&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quo
