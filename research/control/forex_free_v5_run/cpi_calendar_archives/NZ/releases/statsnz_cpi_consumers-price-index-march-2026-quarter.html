,Dec-25,Mar-26\r\nCPI all groups (annual),6.9,7.3,7.2,7.2,6.7,6,5.6,4.7,4,3.3,2.2,2.2,2.5,2.7,3,3.1,3.1\r\nTradeables (annual),8.5,8.7,8.1,8.2,6.4,5.2,4.7,3,1.6,0.3,-1.6,-1.1,0.3,1.2,2.2,2.6,2.5\r\nNon-tradeables (annual),6,6.3,6.6,6.6,6.8,6.6,6.3,5.9,5.8,5.4,4.9,4.5,4,3.7,3.5,3.5,3.5\r\n&quot;},{&quot;ID&quot;:35322,&quot;Title&quot;:&quot;Column&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffQuarter,Mar-22,Jun-22,Sept-22,Dec-22,Mar-23,Jun-23,Sept-23,Dec-23,Mar-24,Jun-24,Sept-24,Dec-24,Mar-25,Jun-25,Sept-25,Dec-25,Mar-26\r\nCPI all groups (quarterly),1.8,1.7,2.2,1.4,1.2,1.1,1.8,0.5,0.6,0.4,0.6,0.5,0.9,0.5,1,0.6,0.9\r\n&quot;}],&quot;GraphType&quot;:&quot;columnLine&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, percentage change, March 2022\u2013March 2026&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;133079&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2026 quarter \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Quarterly change&lt;\/h2&gt;\n&lt;p&gt;Within the 0.9 percent rise in the CPI in the March 2026 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;petrol, up 3.5 percent (13.4 percent contribution to the 0.9 percent rise for all groups)&lt;\/li&gt;\n&lt;li&gt;pharmaceutical products, up 17.7 percent (13.0 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;confectionery, nuts, and snacks, up 6.2 percent (9.8 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Lower prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;international air transport, down 7.0 percent (-14.6 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;overseas accommodation prepaid in New Zealand, down 4.0 percent (-9.4 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;133085&quot;,&quot;Title&quot;:&quot;CPI March 26 qtr \u2013 g2 \u2013 Quarterly percentage point contribution to consumers price index, by group, March 2026 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage point contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35323,&quot;Title&quot;:&quot;Quarterly percentage point contribution to consumers price index, by group, March 2026 quarter&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffGroup,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Housing contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage point contribution,0.271,0.104,-0.008,0.176,0.006,0.124,0.217,0.007,-0.106,0.051,0.058\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Quarterly percentage point contribution to consumers price index, by group, March 2026 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;133080&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2026 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Annual change&lt;\/h2&gt;\n&lt;p&gt;Within the 3.1 percent increase in the CPI in the 12 months to the March 2026 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;electricity, up 12.5 percent (10.9 percent contribution to the 3.1 percent rise for all groups)&lt;\/li&gt;\n&lt;li&gt;local authority rates and payments, up 8.8 percent (8.7 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;meat and poultry, up 8.6 percent (6.4 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Lower prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;audio-visual equipment, down 21.2 percent (-1.4 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;real estate services, down 4.8 percent (-1.0 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;133088&quot;,&quot;Title&quot;:&quot;CPI March 26 qtr \u2013 g3 \u2013 Annual percentage point contribution to consumers price index, by group, March 2026 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage point contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35324,&quot;Title&quot;:&quot;Annual percentage point contribution to consumers price index, by group, March 2026 quarter&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffGroup,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Housing contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage point contribution,0.747,0.122,0.057,0.991,0.002,0.141,0.493,0.125,0.206,0.062,0.154\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Annual percentage point contribution to consumers price index, by group, March 2026 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;133161&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2026 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Tradeable and non-tradeable inflation&lt;\/h2&gt;\n&lt;p&gt;Tradeable inflation measures final goods and services that are influenced by foreign markets.&lt;\/p&gt;\n&lt;p&gt;Within the 2.5 percent increase in tradeable inflation in the 12 months to the March 2026 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;meat and poultry, up 11.8 percent (16.6 percent contribution to the 2.5 percent rise for all groups tradeable)&lt;\/li&gt;\n&lt;li&gt;cultural services, up 17.8 percent (10.0 percent contribution to all groups tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Lower prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;audio-visual equipment, down 21.2 percent (-4.1 percent contribution to all groups tradeable)&lt;\/li&gt;\n&lt;li&gt;computing equipment, down 8.6 percent (-2.3 percent contribution to all groups tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Non-tradeable inflation measures final goods and services that do not face foreign competition and is an indicator of domestic demand and supply conditions. However, the inputs of these goods and services can be influenced by foreign competition.&lt;\/p&gt;\n&lt;p&gt;Within the 3.5 percent increase in non-tradeable inflation in the 12 months to the March 2026 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;electricity, up 12.5 percent (16.9 percent contribution to the 3.5 percent rise for all groups non-tradeable)&lt;\/li&gt;\n&lt;li&gt;local authority rates, up 8.8 percent (13.4 percent contribution to all groups non-tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Lower prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;real estate services, down 4.8 percent (-1.5 percent contribution to all groups non-tradeable)&lt;\/li&gt;\n&lt;li&gt;milk, cheese, and eggs, down 4.3 percent (-0.7 percent contribution to all groups non-tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Additional central and local government charges series&lt;\/h2&gt;\n&lt;p&gt;We have reviewed and updated which items are included in the central and local government charges series to ensure the series reflect current government charges.&lt;\/p&gt;\n&lt;p&gt;The existing series will continue to be available in Infoshare and within our published CPI release Excel tables. The new series will be linked on (and replace) the existing series as part of the next CPI review.&lt;\/p&gt;\n&lt;p&gt;The five new series are:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Central government charges (brand new)&lt;\/li&gt;\n&lt;li&gt;Local government charges (brand new)&lt;\/li&gt;\n&lt;li&gt;Central and local government charges (new version of existing series)&lt;\/li&gt;\n&lt;li&gt;All groups less central and local government charges (new version of existing series)&lt;\/li&gt;\n&lt;li&gt;All groups less food, household energy, vehicle fuels, and government charges (new version of existing series).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p class=\&quot;u-font-size-base\&quot;&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/methods\/price-index-methods-updates-for-the-march-2026-quarter\/\&quot;&gt;&lt;\/a&gt;&lt;a href=\&quot;\/methods\/price-index-methods-updates-for-the-march-2026-quarter\/\&quot;&gt;Price index methods \u2013 updates for the March 2026 quarter&lt;\/a&gt; has more information.&lt;\/p&gt;\n&lt;p&gt;These series and weights can be accessed in the \u2018Central and local government charges\u2019 file under &lt;a class=\&quot;ss-broken\&quot; href=\&quot;\/information-releases\/consumers-price-index-march-2026-quarter\/#download-data\&quot;&gt;Download data&lt;\/a&gt;.&lt;\/p&gt;\n&lt;h2&gt;Annual inflation, international comparisons&lt;\/h2&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot; cellspacing=\&quot;0\&quot; cellpadding=\&quot;0\&quot;&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Country&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;159\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;12-month inflation rate&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;237\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;Time reference&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;New Zealand&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;159\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;3.1&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;237\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;March 2026&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;Australia&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;159\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;3.7*&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;237\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;February 2026&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;United Kingdom&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width
