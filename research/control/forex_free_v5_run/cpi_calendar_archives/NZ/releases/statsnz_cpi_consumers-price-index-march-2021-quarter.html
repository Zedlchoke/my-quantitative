;Adobe Acrobat PDF file&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788484197&quot;,&quot;DocumentSize&quot;:&quot;124 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;66480&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;Consumers-price-index-March-2021-quarter-summary-diagram.pdf&quot;,&quot;FileName&quot;:&quot;Consumers-price-index-March-2021-quarter-summary-diagram.pdf&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2021 quarter \u2013 summary diagram&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:66558,&quot;OwnerID&quot;:53,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Consumers-price-index\/Consumers-price-index-March-2021-quarter\/Download-data\/Consumers-price-index-March-2021-quarter-summary-diagram.pdf&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;pdf&quot;,&quot;DocumentFileType&quot;:&quot;Adobe Acrobat PDF file&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788484197&quot;,&quot;DocumentSize&quot;:&quot;123 KB&quot;,&quot;DocumentPreviewImage&quot;:false}],&quot;Heading&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}},&quot;Presentation&quot;:null},{&quot;ID&quot;:&quot;57828&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2021 quarter \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;&lt;p&gt;Inflation rate for the March 2021 quarter:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;quarterly \u2013 0.8 percent&lt;\/li&gt;\n&lt;li&gt;annual \u2013 1.5 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Quarterly change&lt;\/h3&gt;&lt;p&gt;In the March 2021 quarter compared with the December 2020 quarter, the CPI rose 0.8 percent (0.8 with seasonal adjustment).&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Transport rose 3.9 percent, influenced by higher prices for private transport supplies and services (up 4.9 percent) and purchase of vehicles (up 2.6 percent).&lt;\/li&gt;\n&lt;li&gt;Housing and household utilities rose 0.9 percent, influenced by actual rentals for housing (up 1.0 percent) and home ownership (1.2 percent).&lt;\/li&gt;\n&lt;li&gt;Alcoholic beverages and tobacco rose 1.6 percent, influenced by higher prices for cigarettes and tobacco (up 2.7 percent).&lt;\/li&gt;\n&lt;li&gt;Food rose 0.6 percent, influenced by grocery food (up 0.9 percent) and restaurant meals and ready to eat foods (up 0.9 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;57675&quot;,&quot;Title&quot;:&quot;CPI March 2021 qrt gr 3 \u2013 Consumers price index, quarterly change, March 2017\u2013March 2021&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:17145,&quot;Title&quot;:&quot;CPI quarterly change&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18,Mar-19,Jun-19,Sep-19,Dec-19,Mar-20,Jun-20,Sep-20,Dec-20,Mar-21\r\nPercentage change,1,0,0.5,0.1,0.5,0.4,0.9,0.1,0.1,0.6,0.7,0.5,0.8,-0.5,0.7,0.5,0.8\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, quarterly change, March 2017\u2013March 2021&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;57834&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2021 quarter \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Annual change&lt;\/h3&gt;&lt;p&gt;From the March 2020 quarter to the March 2021 quarter, the CPI inflation rate was 1.5 percent.&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities increased 2.6 percent, with higher prices for home ownership (up 3.5 percent) and actual rentals for housing (up 2.7 percent).&lt;\/li&gt;\n&lt;li&gt;Food prices increased 1.1 percent, with higher prices for restaurant meals and ready-to-eat foods (up 3.7 percent) and fruit and vegetables (up 3.9 percent).&lt;\/li&gt;\n&lt;li&gt;Alcoholic beverages and tobacco increased 2.5 percent, with higher prices for cigarettes and tobacco (up 2.9 percent) and alcoholic beverages (up 2.2 percent).&lt;\/li&gt;\n&lt;li&gt;Miscellaneous goods and services increased 1.9 percent, with higher prices for other miscellaneous services (up 6.1 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;57669&quot;,&quot;Title&quot;:&quot;CPI March 2021 qrt gr 1 \u2013 Consumers price index, annual change, March 2017\u2013March 2021  &quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:17133,&quot;Title&quot;:&quot;Consumers price index, annual change, March 2017\u2013M&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Year ended,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18,Mar-19,Jun-19,Sep-19,Dec-19,Mar-20,Jun-20,Sep-20,Dec-20,Mar-21\r\nPercentage change,2.2,1.7,1.9,1.6,1.1,1.5,1.9,1.9,1.5,1.7,1.5,1.9,2.5,1.5,1.4,1.4,1.5\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, annual change, March 2017\u2013March 2021  &quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;57837&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2021 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Average quarterly prices&lt;\/h3&gt;&lt;ul&gt;\n&lt;li&gt;The average price for 1 litre of 91 octane petrol was $2.00 in the March 2021 quarter, up from $1.87 in the December 2020 quarter, and down from $2.09 in the March 2020 quarter.&lt;\/li&gt;\n&lt;li&gt;The average price for 1 pack of 25 cigarettes was $42.95 in the March 2021 quarter, up from $42.03 in the December 2020 quarter, and up from $41.89 in the March 2020 quarter.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;57684&quot;,&quot;Title&quot;:&quot;CPI March 2021 qrt gr 5 \u2013 CPI weighted average price of petrol per litre ($), March 2016 \u2013 March 2021 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Price per litre ($)&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:17151,&quot;Title&quot;:&quot;CPI weighted average price of petrol&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Mar-16,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18,Mar-19,Jun-19,Sep-19,Dec-19,Mar-20,Jun-20,Sep-20,Dec-20,Mar-21\r\nWeighted average price,1.69,1.78,1.75,1.82,1.9,1.86,1.83,1.94,2,2.06,2.18,2.17,2.01,2.13,2.11,2.14,2.09,1.83,1.86,1.87,2\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI weighted average price of petrol per litre ($), March 2016\u2013March 2021 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;  &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;57840&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2021 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Transport drives up quarterly inflation&lt;\/h2&gt;&lt;p&gt;Transport was the main contributor to the 0.8 percent CPI increase in the March 2021 quarter, rising 3.9 percent. The main driver for this was higher prices for private transport supplies and services, up 4.9 percent, with an increase in price for petrol, and purchase of vehicles, up 2.6 percent, with an increase in the price for secondhand vehicles.&lt;\/p&gt;&lt;p&gt;Housing and household utilities was also up this quarter, rising 0.9 percent. This was mainly due to higher prices for actual rentals for housing and purchase of new housing, up 1.0 percent and 1.2 percent respectively. Regionally, rental prices increased 0.5 percent in Auckland, 1.7 percent in Wellington, and 0.8 percent in Canterbury.&lt;\/p&gt;&lt;p&gt;Alcoholic beverages and tobacco rose 1.6 percent in the March 2021 quarter, with cigarettes and tobacco up 2.7 percent. Alcoholic beverages were also up 0.7 percent.&lt;\/p&gt;&lt;p&gt;Recreation and culture partly offset these rises, falling 0.9 percent. Audio-visual and computing equipment was the main driver of this, down 6.7 percent. This was followed by newspapers, books, and stationery, down 4.0 percent.&lt;\/p&gt;&lt;h2&gt;Cigarette tax&lt;\/h2&gt;&lt;p&gt;Tobacco prices have been one of the main drivers of inflation over recent years. There were four annual increases of 10 percent plus CPI (all groups less credit services for the year to 30 September). However, these large annual excise increases have come to an end, and the annual increase on 1 January 2021 was only from the all groups CPI less credit services for the year to 30 September 2020.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;57693&quot;,&quot;Title&quot;:&quot;CPI March 2021 qrt gr 7 \u2013 CPI weighted average price of cigarettes ($), per pack of 25, March 2016 \u2013 March 2021 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Price per pack of 25 cigarettes ($)&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:17160,&quot;Title&quot;:&quot;CPI weighted price of cigarettes&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Mar-11,Jun-11,Sep-11,Dec-11,Mar-12,Jun-12,Sep-12,Dec-12,Mar-13,Jun-13,Sep-13,Dec-13,Mar-14,Jun-14,Sep-14,Dec-14,Mar-15,Jun-15,Sep-15,Dec-15,Mar-16,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18,Mar-19,Jun-19,Sep-19,Dec-19,Mar-20,Jun-20,Sep-20,Dec-20,Mar-21\r\nWeighted average price,16.39,16.39,16.39,16.39,18.46,18.46,18.46,18.46,20.79,20.79,20.79,20.79,22.88,22.86,23.25,23.3,26.42,26.42,26.43,26.43,28.79,28.8,28.81,28.82,31.6,31.63,31.69,31.68,35.14,35.19,35.17,34.57,37.48,37.49,37.51,37.51,41.89,41.61,41.74,42.03,42.95\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI weighted average price of cigarettes ($), per pack of 25, March 2016 \u2013 March 2021 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;57846&quot;,&quot;Title&quot;:&quot;Consumers price index: March 2021 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Reintroduction of international airfares&lt;\/h2&gt;&lt;p&gt;We are starting to see some international routes having more passengers on flights (due to quarantine-free travel to certain areas in Australia) and we are starting to reintroduce the price movements for these routes back into the CPI. When these missing items are reintroduced, their weight in the CPI will be much lower than pre COVID-19 weights due to the longer-term impact COVID-19 is having on travel.&lt;\/p&gt;&lt;p&gt;In the CPI, there are 19 individual routes (sub-items) for international transport. When a route returns to at least 20 percent of its expenditure value (weight) it is reintroduced back into the CPI calculation, the price movement is shown for that route, and it is no longer imputed from the headline CPI movement. All other routes (that are defined as still missing) continue to be imputed off headline CPI.&lt;\/p&gt;&lt;p&gt;The 20 percent threshold is consistent with how other national statistics offices are treating items that are defined as missing.&lt;\/p&gt;&lt;p&gt;In the December 2020 quarter, we reintroduced the Auckland to Sydney route.&lt;\/p&gt;&lt;p&gt;In the March 2021 quarter, we have reintroduced one international air transport route as it passed the 20 percent threshold described above \u2013 Auckland to Melbourne.&lt;\/p&gt;&lt;p&gt;When an international air transport route comes back, we will also reintroduce the associated overseas accommodation costs when it returns to at least 20 percent of its original expenditure value. In the March 2021 quarter, there was a high proportion of people who travelled to Sydney and Melbourne indicating they were visiting friends or relatives. Because of this, the estimated expenditure for overseas accommodation in Sydney and Melbourne did not cross the 20 percent threshold, and we are not going to reintroduce overseas accommodation costs this quarter.&lt;\/p&gt;&lt;p&gt;Due to the reintroduction of the Auckland to Melbourne route into the CPI and imputation of the other routes, international airfare prices rose 10 percent. The contribution to the CPI was 0.72 percentage points. International airfares have a relatively low weight in the CPI, but prices are much higher than they were pre-COVID. Therefore, the contribution to the CPI is relatively high.&lt;\/p&gt;&lt;p&gt;See &lt;a href=\&quot;methods\/impacts-of-covid-19-on-methodology-for-the-march-2021-quarter-cpi\&quot;&gt;Impacts of COVID-19 on methodology for the March 2021 quarter CPI&lt;\/a&gt; for more information about the methodological changes.&lt;\/p&gt;&lt;h2&gt;Housing costs drive up annual non-tradables&lt;\/h2&gt;&lt;p&gt;Tradables rose 0.9 percent in the March 2021 quarter, compared with the December 2020 quarter.&lt;\/p&gt;&lt;p&gt;In the year to March 2021 quarter, tradable increased 0.5 percent, with higher prices for second-hand vehicles and international air transport partly offset by lower prices for petrol.&lt;\/p&gt;&lt;p&gt;Non-tradables rose 0.7 percent in the March 2021 quarter, compared with the December 2020 quarter.&lt;\/p&gt;&lt;p&gt;In the year to March 2021 quarter, non-tradables increased 2.1 percent, with higher prices for purchase of housing and actual rentals for housing.&lt;\/p&gt;&lt;h2&gt;Underlying price showed higher inflation for the year&lt;\/h2&gt;&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 1.4 percent to 1.7 percent for the year ended March 2021 quarter. This indicates that underlying inflation is generally higher than the 1.5 percent overall increase in CPI. On a quarterly basis, trimmed means were between 0.8 and 0.9 percent.&lt;\/p&gt;&lt;p&gt;For the year ended March 2021:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding food increased 1.6 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding housing and household utilities increased 1.2 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding alcoholic beverages and tobacco increased 1.4 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding food group, household energy subgroup, and vehicle fuels increased 2.0 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href
