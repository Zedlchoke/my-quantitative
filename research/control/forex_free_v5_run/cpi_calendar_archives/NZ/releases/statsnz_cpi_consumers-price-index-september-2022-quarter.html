t;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;90058&quot;,&quot;Title&quot;:&quot;Consumers price index: September 2022 quarter \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Annual change&lt;\/h3&gt;&lt;p&gt;In the September 2022 quarter compared with the September 2021 quarter, the CPI inflation rate was 7.2 percent.&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities increased 8.7 percent, influenced by home ownership (up 17 percent) and actual rentals for housing (up 4.6 percent).&lt;\/li&gt;\n&lt;li&gt;Transport increased 12 percent, influenced by private transport supplies and services (up 16 percent) and passenger transport services (up 0.7 percent).&lt;\/li&gt;\n&lt;li&gt;Food increased 8.0 percent, influenced by grocery food (up 8.0 percent) and fruit and vegetables (up 14 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;89839&quot;,&quot;Title&quot;:&quot;CPI Sep22 G6 Consumers price index, annual percentage change, September 2018\u2013September 2022&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percentage change&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:24313,&quot;Title&quot;:&quot;Consumers price index, annual percentage change, September 2018\u2013September 2022&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Sep-18,Dec-18,Mar-19,Jun-19,Sep-19,Dec-19,Mar-20,Jun-20,Sep-20,Dec-20,Mar-21,Jun-21,Sep-21,Dec-21,Mar-22,Jun-22,Sep-22\r\nAnnual percentage change,1.9,1.9,1.5,1.7,1.5,1.9,2.5,1.5,1.4,1.4,1.5,3.3,4.9,5.9,6.9,7.3,7.2\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, annual percentage change, September 2018\u2013September 2022&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;89842&quot;,&quot;Title&quot;:&quot;CPI Sep22 G7 Annual percentage point contribution to consumers price index, by group, September 2022 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage points contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:24316,&quot;Title&quot;:&quot;Annual percentage point contribution to consumers price index, by group, September 2022 quarter&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Household contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage points contribution,1.473,0.348,0.057,2.477,0.307,0.188,1.503,0.085,0.337,0.053,0.372\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Annual percentage point contribution to consumers price index, by group, September 2022 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;90064&quot;,&quot;Title&quot;:&quot;Consumers price index: September 2022 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Food top contributor to quarterly inflation&lt;\/h3&gt;&lt;p&gt;Food was the main contributor to the 2.2 percent rise in the CPI in the September 2022 quarter, rising 4.1 percent. The main driver for this was higher prices for fruit and vegetables, up 17 percent. Grocery foods also contributed, up 2.2 percent.&lt;\/p&gt;&lt;p&gt;The next largest contributor was housing and household utilities up 2.3 percent. This was mainly influenced by higher prices for home ownership, up 3.3 percent, and property rates and related services, up 7.1 percent.&lt;\/p&gt;&lt;p&gt;Transport also contributed to the increase, up 1.7 percent from the previous quarter. Within this group the main driver was passenger transport services, up 18 percent.&lt;\/p&gt;&lt;p&gt;Non-tradeable items rose 2.0 percent from the June 2022 quarter to the September 2022 quarter. The most significant contributor to this movement was home ownership.&lt;\/p&gt;&lt;p&gt;Tradeable items also rose, up 2.2 percent over the same period. The main contributors for this were fruit and vegetables and passenger transport services.&lt;\/p&gt;&lt;h3&gt;Housing costs largest contributor to annual inflation&lt;\/h3&gt;&lt;p&gt;The most significant contributor to the 7.2 percent annual increase in the CPI between September 2021 and September 2022 was housing and household utilities, which increased 8.7 percent.&lt;\/p&gt;&lt;p&gt;The most significant contributor to the increase in housing and household utilities was purchase of housing, up 17 percent. Actual rentals for housing also contributed to this increase, up 4.6 percent.&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/methods\/how-housing-costs-are-measured-in-consumer-price-indexes-at-stats-nz\&quot;&gt;&lt;span&gt;How housing costs are measured in consumer price indexes at Stats NZ&lt;\/span&gt;&lt;\/a&gt; &lt;span&gt;has more information on housing in the CPI.&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Transport was the second most significant contributor to the annual increase, up 12 percent. The largest driver to this was a 19 percent increase in petrol.&lt;\/p&gt;&lt;p&gt;The increase in the cost of food also contributed to the annual movement, with food prices up 8.0 percent annually. The largest contributors to this were grocery food (up 8.0 percent) and fruit and vegetables (up 14 percent).&lt;\/p&gt;&lt;p&gt;The cost of non-tradeable items was up 6.6 percent in the year to September 2022 quarter. The most significant driver of this movement was home ownership.&lt;\/p&gt;&lt;p&gt;The cost of tradeable items was up 8.1 percent annually. The most significant driver of this movement was private transport supplies and services.&lt;\/p&gt;&lt;h3&gt;Trimmed-mean measures&lt;\/h3&gt;&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 6.4 percent to 7.0 percent for the year. This indicates that underlying inflation is lower than the 7.2 percent overall increase in the CPI. On a quarterly basis, trimmed means were between 1.3 and 1.5 percent.&lt;\/p&gt;&lt;p&gt;For the year ended September 2022:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding food increased 7.0 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding housing and household utilities increased 6.5 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding alcoholic beverages and tobacco increased 7.5 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding food group, household energy subgroup, and vehicle fuels increased 6.3 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;June 2022 used cars error&lt;\/h3&gt;&lt;p&gt;In June 2022 we found an error in the calculation of the clean car programme rebate\/fee for used cars. As this error did not impact the \u2018all groups\u2019 movement it was not revised, which means a catch-up movement is reflected in the September 2022 quarter data.&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/information-releases\/consumers-price-index-june-2022-quarter\/\&quot;&gt;Consumers price index: June 2022 quarter&lt;\/a&gt; has details of the impact and a corrected Excel file.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/65543d91-a280-4739-b90f-c49cbb7da68c\/#\/nz.govt.stats\/24daf577-e941-4a5c-9ba1-f43c5afb5e1e\/1\&quot;&gt;Consumers price index concepts \u2013 DataInfo+&lt;\/a&gt;&amp;nbsp;gives definitions of terms used in this release and&amp;nbsp;general methodology used to produce&amp;nbsp;the CPI&amp;nbsp;and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;h
