($), September 2010\u2013September 2020 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;47287&quot;,&quot;Title&quot;:&quot;Consumers price index: September 2020 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Food and housing drive annual inflation&lt;\/h3&gt;&lt;p&gt;Food was the main contributor to the 1.4 percent CPI increase in the September 2020 year, increasing 3.7 percent. This was driven by a 15 percent price increase in fruit and vegetables, a 3.8 percent increase in restaurant meals and ready-to-eat foods, and a 1.3 percent increase in grocery foods for the year ending September 2020.&lt;\/p&gt;&lt;p&gt;Housing and household utilities was another leading contributor to the annual CPI, increasing by 2.6 percent. The rise in this group was influenced by higher prices for rents, purchase of housing, and property rates and related services.&lt;\/p&gt;&lt;p&gt;Actual rentals for housing increased 3.1 percent nationwide in the year to September 2020. Regionally, rental prices increased 1.6 percent in Auckland, 5.1 percent in Wellington, and 1.6 percent in Canterbury.&lt;\/p&gt;&lt;p&gt;Alcoholic beverages and tobacco increased 5.1 percent for the year, with cigarettes and tobacco up 11 percent.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;47054&quot;,&quot;Title&quot;:&quot;CPI September 2020 quarter \u2013 CPI actual rentals for housing, by region, annual change, September 2008\u2013September 2020&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:& e&quot;:&quot;Consumers price index: September 2020 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Quarterly inflation also driven by food and housing&lt;\/h3&gt;&lt;p&gt;Food rose 1.2 percent this quarter. The main driver for this was higher prices for fruit and vegetables, up 12 percent. This was partly offset by grocery food, which fell by 1.4 percent.&lt;\/p&gt;&lt;p&gt;Housing and household utilities rose 0.6 percent this quarter, with property rates and related services up 2.9 percent. Actual rentals for housing rose 0.5 percent this quarter. Regionally, rental prices rose 0.1 percent in Auckland, 0.8 percent in Wellington, and 0.2 percent in Canterbury.&lt;\/p&gt;&lt;p&gt;Transport prices rose 0.7 percent in the September 2020 quarter, due to private transport supplies and services, up 1.4 percent.&lt;\/p&gt;&lt;p&gt;Communication prices partly offset this, falling 2.5 percent for the quarter. This was driven by a 15 percent fall in telecommunication equipment.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;47418&quot;,&quot;Title&quot;:&quot;Consumer price index: September 2020 quarter \u2013 correction block&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;div style=\&quot;background-color: #f6f6f6; border-left: #ec6607 3px solid; padding: 30px;\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;23 October 2020&lt;\/strong&gt;: We changed the following heading to better reflect the situation.&lt;\/p&gt;\n&lt;\/div&gt;&quot;},{&quot;ID&quot;:&quot;47421&quot;,&quot;Title&quot;:&quot;Consumer price index: September 2020 quarter \u2013 key facts 6&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Tradables up in quarter, down in year&lt;\/h3&gt;&lt;p&gt;Tradables rose 0.6 percent in the September 2020 quarter. In the year, tradables fell 0.1 percent, with lower prices for private transport supplies and services, partly offset by higher prices for fruit and vegetables.&lt;\/p&gt;&lt;p&gt;Non-tradables rose 0.6 percent in the September 2020 quarter, mainly driven by higher prices for property rates and related services, recreational and cultural services, and rents.&lt;\/p&gt;&lt;p&gt;In the year to September 2020, non-tradables increased 2.6 percent. Higher prices for cigarettes and tobacco, rents, and restaurant meals and ready-to-eat food made the largest contributions.&lt;\/p&gt;&lt;h3&gt;Underlying price showed higher inflation for the year&lt;\/h3&gt;&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 1.4 percent to 1.7 percent for the year. This indicates that underlying inflation is slightly higher than the 1.4 percent overall increase in CPI. On a quarterly basis, trimmed means were all 0.4 percent.&lt;\/p&gt;&lt;p&gt;For the year ended September 2020:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding food increased 0.9 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding housing and household utilities increased 1.0 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding alcoholic beverages and tobacco increased 1.2 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;New items and new weights after 2020 CPI review&lt;\/h3&gt;&lt;p&gt;This quarter we implemented the 2020 consumers price index review. Every three years, we conduct a review of items held within the CPI, and their relative importance, based on current household expenditure. As spending patterns change over time, we update our basket of goods and services to ensure we are accurately tracking the price changes households are experiencing. See&amp;nbsp;&lt;a href=\&quot;http:\/\/www.stats.govt.nz\/methods\/consumers-price-index-review-2020\&quot;&gt;Consumers price index review: 2020&lt;\/a&gt;&amp;nbsp;for more information.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/65543d91-a280-4739-b90f-c49cbb7da68c\/#\/nz.govt.stats\/24daf577-e941-4a5c-9ba1-f43c5afb5e1e\/1\&quot;&gt;Consumers price index concepts \u2013 DataInfo+&lt;\/a&gt;&amp;nbsp;gives definitions of terms used in this release and&amp;nbsp;general methodology used to produce&amp;nbsp;the CPI&amp;nbsp;and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/8b0860b8-cf63-4f12-a578-8eed8ba69ac3\/?_ga=2.200485870.1749673349.1620332052-1586433161.1610308723\&quot;&gt;Consumers price index \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce the CPI and related metadata.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5399&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 media enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Media e
