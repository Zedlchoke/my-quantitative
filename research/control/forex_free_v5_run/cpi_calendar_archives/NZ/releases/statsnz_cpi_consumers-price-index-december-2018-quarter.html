lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities increased 3.1 percent, with rentals for housing up 2.4 percent, construction up 3.6 percent, and local authority rates up 5.1 percent.&lt;\/li&gt;\n&lt;li&gt;Transport increased 3.5 percent, with petrol up 11 percent.&lt;\/li&gt;\n&lt;li&gt;Alcoholic beverages and tobacco increased 3.8 percent, with cigarettes and tobacco up 9.2 percent.&lt;\/li&gt;\n&lt;li&gt;Communication prices decreased 3.7 percent, with telecommunication equipment down 21 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;22415&quot;,&quot;Title&quot;:&quot;CPI December 2018 quarter \u2013 Consumers price index, annual change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:6401,&quot;Title&quot;:&quot;cpi annual change&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Year ended,Dec-14,Mar-15,Jun-15,Sep-15,Dec-15,Mar-16,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18\r\nPercentage change,0.8,0.3,0.4,0.4,0.1,0.4,0.4,0.4,1.3,2.2,1.7,1.9,1.6,1.1,1.5,1.9,1.9\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, annual change, December 2014\u2013December 2018&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;22455&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2018 quarter  \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Quarterly change&lt;\/h3&gt;&lt;p&gt;In the December 2018 quarter compared with the September 2018 quarter, the CPI rose 0.1 percent (up 0.4 percent with seasonal adjustment).&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Food prices fell 1.3 percent, influenced by lower prices for vegetables (down 21 percent).&lt;\/li&gt;\n&lt;li&gt;Recreation and culture rose 2.5 percent, influenced by higher prices for games, toys, and hobbies (up 13 percent), and overseas accommodation prepaid in New Zealand (up 4.9 percent).&amp;nbsp;&lt;\/li&gt;\n&lt;li&gt;Transport rose 1.1 percent, influenced by seasonally higher prices for international air transport (up 7.6 percent) and rental cars (up 108 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;22421&quot;,&quot;Title&quot;:&quot;CPI December 2018 quarter \u2013 Consumers price index, quarterly change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:6407,&quot;Title&quot;:&quot;cpi quarterly chg&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Dec-14,Mar-15,Jun-15,Sep-15,Dec-15,Mar-16,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18\r\nPercentage change,-0.2,-0.2,0.4,0.3,-0.5,0.2,0.4,0.3,0.4,1,0,0.5,0.1,0.5,0.4,0.9,0.1\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, quarterly change, December 2014\u2013December 2018&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;22458&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2018 quarter  \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Average quarterly prices&lt;\/h3&gt;&lt;p&gt;In the December 2018 quarter:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;The average price for 1 litre of 91 octane petrol was $2.17, down from $2.18 in the September 2018 quarter, and up from $1.94 in the December 2017 quarter.&lt;\/li&gt;\n&lt;li&gt;The average price for 1 pack of 25 cigarettes in supermarkets and convenience stores was $34.57, down from $35.17 in the September 2018 quarter, and up from $31.68 in the December 2017 quarter.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;22433&quot;,&quot;Title&quot;:&quot;CPI December 2018 \u2013 CPI weighted average price of cigarettes, per pack of 25&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Price per pack of 25 ($)&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:6419,&quot;Title&quot;:&quot;Price per pack of 25 ($)&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;timeseries&quot;,&quot;GraphCsvData&quot;:&quot;2008-12-01,12.9\r\n2009-03-01,13.43\r\n2009-06-01,13.43\r\n2009-09-01,13.32\r\n2009-12-01,13.28\r\n2010-03-01,13.46\r\n2010-06-01,14.31\r\n2010-09-01,14.73\r\n2010-12-01,15.02\r\n2011-03-01,16.39\r\n2011-06-01,16.39\r\n2011-09-01,16.39\r\n2011-12-01,16.39\r\n2012-03-01,18.46\r\n2012-06-01,18.46\r\n2012-09-01,18.46\r\n2012-12-01,18.46\r\n2013-03-01,20.79\r\n2013-06-01,20.79\r\n2013-09-01,20.79\r\n2013-12-01,20.79\r\n2014-03-01,22.88\r\n2014-06-01,22.86\r\n2014-09-01,23.25\r\n2014-12-01,23.3\r\n2015-03-01,26.42\r\n2015-06-01,26.42\r\n2015-09-01,26.43\r\n2015-12-01,26.43\r\n2016-03-01,28.79\r\n2016-06-01,28.8\r\n2016-09-01,28.81\r\n2016-12-01,28.82\r\n2017-03-01,31.6\r\n2017-06-01,31.63\r\n2017-09-01,31.69\r\n2017-12-01,31.68\r\n2018-03-01,35.14\r\n2018-06-01,35.19\r\n2018-09-01,35.17\r\n2018-12-01,34.57\r\n&quot;}],&quot;GraphType&quot;:&quot;timeSeries&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI weighted average price of cigarettes, per pack of 25, December 2008\u2013December 2018 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;22461&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2018 quarter  \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Annual increase driven by housing and transport prices&lt;\/h3&gt;&lt;p&gt;Housing and household utilities was the main contributor to the 1.9 percent CPI increase in the December 2018 year. The rise in this group was influenced by higher prices for rents, construction, and local authority rates.&lt;\/p&gt;&lt;p&gt;Actual rentals for housing increased 2.4 percent nationwide in the year to December 2018. Regionally, rent prices rose the most in Wellington (up 4.0 percent). Auckland saw its smallest annual increase in four years (up 2.2 percent). Rents increased 2.9 percent in the rest of the North Island, 0.8 percent in Canterbury, and 2.8 percent in the rest of the South Island.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;22430&quot;,&quot;Title&quot;:&quot;CPI December 2018 quarter \u2013 CPI actual rentals for housing, by region, annual change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Region&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:6416,&quot;Title&quot;:&quot;actual rentals by region annual&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Broad region,Auckland,Wellington,Rest of North Island,Canterbury,Rest of South Island\r\nPercentage change,2.2,4,2.9,0.8,2.8\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI actual rentals for housing, by region, annual change, December 2018 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;22464&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2018 quarter  \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Construction prices increased at an average of 3.6 percent in the December 2018 year across the country. In Auckland, construction prices increased at their slowest rate since March 2013. Prices of newly built houses increased 2.2 percent in Auckland, 2.9 percent in Wellington, 6.9 percent in the rest of the North Island, 1.2 percent in Canterbury, and 5.7 percent in the rest of the South Island.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;22427&quot;,&quot;Title&quot;:&quot;CPI December 2018 quarter \u2013 CPI purchase of new housing, by region, annual change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Region&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:6413,&quot;Title&quot;:&quot;new housing by region&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Broad region,Auckland,Wellington,Rest of North Island,Canterbury,Rest of South Island\r\nPercentage change,2.2,2.9,6.9,1.2,5.7\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI purchase of new housing, by region, annual change, December 2018 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;22467&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2018 quarter  \u2013 key facts 6&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Other housing-related costs with large annual increases were local authority rates and payments (up 5.1 percent), dwelling insurance (up 15 percent), and electricity prices (up 2.1 percent).&lt;\/p&gt;&lt;p&gt;Transport prices had the second-largest upwards contribution over the year, driven by higher prices for petrol (up 11 percent). Regionally, petrol increased 17 percent in Auckland, 7.1 percent in Wellington, 11 percent in the rest of the North Island, 5.9 percent in Canterbury, and 5.3 percent in the rest of the South Island.&lt;\/p&gt;&lt;p&gt;Higher prices for cigarettes and tobacco (up 9.2 percent) also contributed to the 1.9 percent annual CPI increase.&lt;\/p&gt;&lt;p&gt;Communication prices made the largest downward contribution to the change in CPI, down 3.7 percent due to a price drop in telecommunication equipment (down 21 percent). Education decreased 5.5 percent, led by a 16 percent fall in tertiary and other post-school education.&lt;\/p&gt;&lt;h3&gt;Quarterly rise in recreation and transport offset by falls in food&lt;\/h3&gt;&lt;p&gt;Recreation and culture prices rose 2.5 percent in the December 2018 quarter, the largest upwards contributor to the CPI. This rise was driven by higher prices for games, toys, and hobbies (up 13 percent), overseas accommodation prepaid in New Zealand (up 4.9 percent), and domestic accommodation services (up 6.2 percent).&lt;\/p&gt;&lt;p&gt;Transport prices rose 1.1 percent in the December quarter, influenced by seasonal rises for international air transport (up 7.6 percent), rental cars (up 108 percent), and domestic air transport (up 4.0 percent).&lt;\/p&gt;&lt;p&gt;These price rises were largely offset by a fall in food prices over the December quarter. Food prices were down 1.3 percent due to seasonal falls for vegetables (down 21 percent).&lt;\/p&gt;&lt;h3&gt;Tradable prices up 0.9 in the year&lt;\/h3&gt;&lt;p&gt;&lt;strong&gt;Tradable&lt;\/strong&gt; prices increased 0.9 percent in the December 2018 year, with higher prices for petrol, overseas accommodation prepaid in New Zealand, and games, toys, and hobbies. Lower prices for telecommunication equipment, vegetables, and international air transport partly offset the increase.&lt;\/p&gt;&lt;p&gt;On a quarterly basis, prices for tradables fell 0.4 percent, following a 0.9 rise in the September 2018 quarter, mainly driven by a seasonal price fall in vegetables.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Non-tradable&lt;\/strong&gt; prices increased 2.7 percent in the year to December 2018. Higher prices for cigarettes and tobacco, rents, construction, and local authority rates made the largest contributions. Lower prices for tertiary and other post-school education partly offset this increase.&lt;\/p&gt;&lt;h3&gt;Underlying price showed higher inflation for the year&lt;\/h3&gt;&lt;p&gt;The trimmed-mean measures, which exclude extreme price movements, ranged from 2.0 percent to 2.1 percent for the year. This indicates that underlying inflation is higher than the 1.9 percent overall increase in CPI. On a quarterly basis, trimmed means ranged from 0.2 percent to 0.3 percent.&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding petrol increased 1.5 percent in the year to December 2018.&lt;\/li&gt;\n&lt;li&gt;CPI excluding food increased 2.2 percent in the year to December 2018 and rose 0.5 percent in the December 2018 quarter.&lt;\/li&gt;\n&lt;li&gt;CPI excluding cigarettes and tobacco increased 1.7 percent in the year to December 2018.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Changes to accommodation services in the CPI&lt;\/h3&gt;&lt;p&gt;Following the 2017 CPI reweight, from the September 2017 quarter domestic and overseas accommodation services were combined. However, in response to customer feedback, we have separated the classification of accommodation services at the class level into domestic and overseas accommodation. The changes take effect from this quarter, and are revised in the CPI back to the September 2017 quarter.&lt;\/p&gt;&lt;p&gt;Domestic accommodation remains non-tradable, while overseas accommodation is now classified as tradable. This re-classification is consistent with how accommodation services and package holidays were treated before the September 2017 quarter.&lt;\/p&gt;&lt;h3&gt;New rent method&lt;\/h3&gt;&lt;p&gt;Stats NZ is moving to using tenancy bond data for calculating rent in the CPI. We will start to publish the new series on a monthly basis from the January 2019 reference month (published in February 2019) onwards. Back series and a technical paper will also be published with the first release in February 2019.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The new method will be introduced into the CPI in the June quarter 2019 release (to be published in July 2019).&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;h2&gt;CPI visualisations&lt;\/h2&gt;&lt;p&gt;&lt;a title=\&quot;Link to Stats NZ&amp;#039;s archive site. \&quot; href=\&quot;http:\/\/archive.stats.govt.nz\/datavisualisation\/cpi.html?url=\/datavisualisation\/cpi.html&amp;amp;\&quot;&gt;Consumers price index visualisation&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a title=\&quot;Link to Stats NZ&amp;#039;s archive site. \&quot; href=\&quot;http:\/\/archive.stats.govt.nz\/datavisualisation\/cpi_ttnt.html\&quot;&gt;Consumers price index tradables and non-tradables&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/65543d91-a280-4739-b90f-c49cbb7da68c\/#\/nz.govt.stats\/24daf577-e941-4a5c-9ba1-f43c5afb5e1e\/1\&quot;&gt;Consumers price index concepts \u2013 DataInfo+&lt;\/a&gt;&amp;nbsp;gives definitions of terms used in this release and&amp;nbsp;general methodology used to produce&amp;nbsp;the CPI&amp;nbsp;and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/8b0860b8-cf63-4f12-a578-8eed8ba69ac3\/?_ga=2.200485870.1749673349.1620332052-1586433161.1610308723\&quot;&gt;Consumers price index \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce the CPI and related metadata.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5399&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 media enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Media enquiries&lt;\/h2&gt;\n&lt;p&gt;Media team&lt;br&gt;&lt;a href=\&quot;mailto:media@stats.govt.nz?subject=Consumers%20price%20index%20%E2%80%93%20media%20enquiries\&quot;&gt;media@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+64212859191\&quot;&gt;021 285 9191&lt;br&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5402&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 technical enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Technical enquiries&lt;\/h2&gt;\n&lt;p&gt;Prices and deflators team&lt;br&gt;&lt;a href=\&quot;mailto:info@stats.govt.nz?subject=Consumers%20price%20index%20%E2%80%93%20technical%20enquiries\&quot;&gt;info@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+6449314600\&quot;&gt;04 931&amp;nbsp;4600&lt;br&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;607&quot;,&quot;Title&quot;:&quot;ISSN for consumers price index&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;ISSN 1178-0452&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;22470&quot;,&quot;Title&quot;:&quot;Consumers pri
