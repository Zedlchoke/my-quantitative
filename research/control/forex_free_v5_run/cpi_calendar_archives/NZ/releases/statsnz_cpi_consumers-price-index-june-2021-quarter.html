se,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;61905&quot;,&quot;Title&quot;:&quot;CPI June 2021 qrt \u2013 Annual percentage points contribution to CPI, by group, June 2021 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:null,&quot;yAxisDualRightTitle&quot;:&quot;Percentage points contribution&quot;,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:18261,&quot;Title&quot;:&quot;Annual percentage points contribution to CPI, by g&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Household contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage points contribution,0.296,0.167,0.201,1.1,0.157,0.088,1.115,-0.209,0.221,0.045,0.17\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Annual percentage points contribution to CPI, by group, June 2021 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;61995&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2021 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Average quarterly prices&lt;\/h3&gt;&lt;p class=\&quot;Compact\&quot;&gt;The average price for 1 litre of 91 octane petrol was $2.13 in the June 2021 quarter, up from $2.00 in the March 2021 quarter, and up from $1.83 in the June 2020 quarter.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;61908&quot;,&quot;Title&quot;:&quot;CPI June 2021 qrt \u2013 CPI weighted average price of petrol per litre ($), June 2016\u2013June 2021 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Price per litre ($)&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:18234,&quot;Title&quot;:&quot;CPI weighted average price of petrol per litre ($)&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18,Mar-19,Jun-19,Sep-19,Dec-19,Mar-20,Jun-20,Sep-20,Dec-20,Mar-21,Jun-21\r\nWeighted average price,1.78,1.75,1.82,1.9,1.86,1.83,1.94,2,2.06,2.18,2.17,2.01,2.13,2.11,2.14,2.09,1.83,1.86,1.87,2,2.13\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI weighted average price of petrol per litre ($), June 2016\u2013June 2021 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;61998&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2021 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Housing and household utilities push up quarterly inflation&lt;\/h3&gt;\n&lt;p&gt;Housing and household utilities was the main contributor to the 1.3 percent CPI increase in the June 2021 quarter, rising 1.9 percent. The main driver for this was higher prices for purchase of new housing, up 4.6 percent. Actual rentals for housing also contributed, up 0.9 percent. Regionally, rental prices increased 0.5 percent in Auckland, 1.3 percent in Wellington, and 0.6 percent in Canterbury.&lt;\/p&gt;\n&lt;p&gt;Food also rose this quarter, up 1.5 percent. This was mainly due to higher prices for vegetables, up 17 percent. Higher prices for tomatoes, cucumbers, capsicums, and lettuce all contributed to this rise.&lt;\/p&gt;\n&lt;p&gt;Transport rose 2.2 percent in the June 2021 quarter, with higher prices for petrol, up 6.1 percent, and purchase of second-hand motor cars, up 2.9 percent.&lt;\/p&gt;\n&lt;h3&gt;Reintroduction of international airfares&lt;\/h3&gt;\n&lt;p&gt;We are starting to see some international routes having more passengers on flights (due to quarantine-free travel to certain areas in Australia and Rarotonga) and we are starting to reintroduce the price movements for these routes back into the CPI. When these missing items are reintroduced, their weight in the CPI will be much lower than pre COVID-19 weights due to the longer-term impact COVID-19 is having on travel.&lt;\/p&gt;\n&lt;p&gt;The CPI has 19 individual routes (sub-items) for international transport.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;When a route returns to at least 20 percent of its expenditure value (weight):&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;it is reintroduced back into the CPI calculation&lt;\/li&gt;\n&lt;li&gt;the price movement is shown for that route&lt;\/li&gt;\n&lt;li&gt;it is no longer imputed from the headline CPI movement.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;All other routes (that are defined as still missing) continue to be imputed off headline CPI.&lt;\/p&gt;\n&lt;p&gt;The 20 percent threshold is consistent with how other national statistics offices treat items that are defined as missing.&lt;\/p&gt;\n&lt;p&gt;In the December 2020 quarter, we reintroduced the Auckland to Sydney route. In the March 2021 quarter, we reintroduced the Auckland to Melbourne route.&lt;\/p&gt;\n&lt;p&gt;In the June 2021 quarter, we reintroduced an additional five routes:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Auckland to Brisbane&lt;\/li&gt;\n&lt;li&gt;Wellington to Brisbane&lt;\/li&gt;\n&lt;li&gt;Christchurch to Sydney&lt;\/li&gt;\n&lt;li&gt;Wellington to Sydney&lt;\/li&gt;\n&lt;li&gt;Auckland to Rarotonga.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;When an international air transport route comes back, we will also reintroduce the associated overseas accommodation costs when that returns to at least 20 percent of its original expenditure value.&lt;\/p&gt;\n&lt;p&gt;In the June 2021 quarter, a high proportion of people who travelled to Australia indicated on their return that they had been visiting friends or relatives (and were less likely to have booked overseas accommodation). Because of this, the estimated expenditure for overseas accommodation did not cross the 20 percent threshold, and we did not reintroduce any overseas accommodation costs for Australia this quarter.&lt;\/p&gt;\n&lt;p&gt;However, a high proportion of travelers who visited Rarotonga indicated on their return that they had been on holiday, which means they were more likely to have paid for accommodation. Because of this, the estimated expenditure for overseas accommodation did cross the 20 percent threshold, and we therefore reintroduced accommodation costs for Rarotonga this quarter.&lt;\/p&gt;\n&lt;p&gt;International airfare prices fell 7.6 percent in the June 2021 quarter due to:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;five routes being reintroduced into the CPI&lt;\/li&gt;\n&lt;li&gt;the movements of the already introduced routes&lt;\/li&gt;\n&lt;li&gt;imputation of the other routes.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;International airfare prices contribution to the CPI was down 0.60 percentage points.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/impacts-of-covid-19-on-methodology-for-the-june-2021-quarter-cpi\/\&quot;&gt;Impacts of COVID-19 on methodology for the June 2021 quarter CPI&lt;\/a&gt; has more information about the methodological changes.&lt;\/p&gt;\n&lt;h3&gt;Housing costs push up annual non-tradables&lt;\/h3&gt;\n&lt;p&gt;In the year to June 2021 quarter, non-tradables increased 3.3 percent, mainly driven by purchase of new housing and actual rentals for housing.&lt;\/p&gt;\n&lt;p&gt;Non-tradables rose 1.2 percent in the June 2021 quarter.&lt;\/p&gt;\n&lt;p&gt;In the year, tradables increased 3.4 percent, with higher prices for petrol and second-hand vehicles. This was offset by lower prices for telecommunication equipment.&lt;\/p&gt;\n&lt;p&gt;Tradables rose 1.7 percent in the June 2021 quarter.&lt;\/p&gt;\n&lt;h3&gt;Trimmed-mean measures&lt;\/h3&gt;\n&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 3.3 percent to 3.0 percent for the year. This indicates that underlying inflation is lower than the 3.3 percent overall increase in CPI. On a quarterly basis, trimmed means were between 1.3 and 1.1 percent.&lt;\/p&gt;\n&lt;p&gt;For the year ended June 2021:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;CPI excluding food increased 3.8 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding housing and household utilities increased 3.2 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding alcoholic beverages and tobacco increased 3.4 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding food group, household energy subgroup, and vehicle fuels increased 3.3 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;62001&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2021 quarter \u2013 next release date&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Next release&lt;\/h2&gt;&lt;p&gt;&lt;em&gt;Consumers price index: September 2021&lt;\/em&gt; will be released on 18 October 2021.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/65543d91-a280-4739-b90f-c49cbb7da68c\/#\/nz.govt.stats\/24daf577-e941-4a5c-9ba1-f43c5afb5e1e\/1\&quot;&gt;Consumers price index concepts \u2013 DataInfo+&lt;\/a&gt;&amp;nbsp;gives definitions of terms used in this release and&amp;nbsp;general methodology used to produce&amp;nbsp;the CPI&amp;nbsp;and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/8b0860b8-cf63-4f12-a578-8eed8ba69ac3\/?_ga=2.200485870.1749673349.1620332052-1586433161.1610308723\&quot;&gt;Consumers price index \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce the CPI and related metadata.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5399&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 media enquirie
