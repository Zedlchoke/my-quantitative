road region all groups series (series SE1A through SE7A), for the period March 2018.&lt;\/p&gt;\n&lt;p&gt;We also corrected the annual percentage changes for the same series, for the periods March and June 2018.&lt;\/p&gt;\n&lt;p&gt;The same changes for the relevant periods have been applied to the Excel files in &lt;a href=\&quot;http:\/\/www.stats.govt.nz\/information-releases\/consumers-price-index-march-2018-quarter\&quot;&gt;Consumers price index: March 2018 quarter&lt;\/a&gt; and the &lt;a href=\&quot;http:\/\/www.stats.govt.nz\/information-releases\/consumers-price-index-september-2018-quarter\&quot;&gt;Consumers price index: September 2018 quarter&lt;\/a&gt;.&lt;\/p&gt;\n&lt;p&gt;This error does not impact any other CPI series.&lt;\/p&gt;\n&lt;p&gt;Stats NZ is an open and transparent organisation and corrects errors as soon as practicable. We have rigorous processes to check data before publication. We review any error to reduce and mitigate future risks. We regret the error and apologise for any inconvenience caused.&lt;\/p&gt;\n&lt;\/div&gt;&quot;},{&quot;ID&quot;:&quot;16041&quot;,&quot;Title&quot;:&quot;Consumers Price Index: June 2018 quarter \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;&lt;p&gt;Inflation rates for the June 2018 quarter:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;quarter: 0.4 percent&lt;\/li&gt;\n&lt;li&gt;annual: 1.5 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Annual change&lt;\/h3&gt;&lt;p&gt;From the June 2017 quarter to the June 2018 quarter, the CPI increased 1.5 percent.&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities increased 3.1 percent; rentals for housing were up 2.5 percent; and construction was up 3.9 percent.&lt;\/li&gt;\n&lt;li&gt;Transport increased 2.0 percent, with prices for petrol up 10 percent.&lt;\/li&gt;\n&lt;li&gt;Miscellaneous goods and services increased 3.1 percent, with insurance prices up 5.7 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;16006&quot;,&quot;Title&quot;:&quot;CPI: June 2018 quarter \u2013 Consumers price index annual change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:4423,&quot;Title&quot;:&quot;cpi annual change&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Jun-14,Sep-14,Dec-14,Mar-15,Jun-15,Sep-15,Dec-15,Mar-16,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18\r\nPercentage change,1.6,1,0.8,0.3,0.4,0.4,0.1,0.4,0.4,0.4,1.3,2.2,1.7,1.9,1.6,1.1,1.5\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index annual change&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;16024&quot;,&quot;Title&quot;:&quot;CPI: June 2018 quarter \u2013 Annual percentage points contribution to CPI&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage points contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:4444,&quot;Title&quot;:&quot;annual percentage points contribution&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Subgroup,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Household contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services,\r\nPercentage points contribution,0.121,0.403,-0.032,0.758,-0.004,0.017,0.295,-0.159,-0.053,-0.105,0.243\r\n&quot;}],&quot;GraphType&quot;:&quot;barPositiveNegative&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Annual percentage points contribution to CPI, by group, June 2018 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;16044&quot;,&quot;Title&quot;:&quot;Consumers Price Index: June 2018 quarter \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Quarterly change&lt;\/h3&gt;&lt;p&gt;In the June 2018 quarter compared with the March 2018 quarter, the CPI rose 0.4 percent (up 0.3 percent with seasonal adjustment).&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities rose 0.9 percent, influenced by higher prices for rents (up 0.8 percent) and construction (up 1.1 percent).&lt;\/li&gt;\n&lt;li&gt;Food prices rose 0.8 percent, influenced by seasonally higher prices for vegetables (up 7.0&amp;nbsp;percent).&lt;\/li&gt;\n&lt;li&gt;Recreation and culture prices fell 1.4 percent, influenced by lower prices for audio-visual&amp;nbsp;equipment (down 15 percent) and subscriber TV (down 7.2 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;16009&quot;,&quot;Title&quot;:&quot;CPI: June 2018 quarter \u2013 Consumers price index quarterly change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quo 065,-0.132,0.003,0.06\r\n&quot;}],&quot;GraphType&quot;:&quot;barPositiveNegative&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Quarterly percentage points contribution to CPI, by group, June 2018 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;16053&quot;,&quot;Title&quot;:&quot;Consumers Price Index: June 2018 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Average quarterly prices&lt;\/h3&gt;&lt;p&gt;The average price for 1 litre of 91 octane petrol was $2.06 in the June 2018 quarter, up from $2.00 in the March 2018 quarter, and $1.86 in the June 2017 quarter.&lt;\/p&gt;&lt;h3&gt;Housing prices drive 1.5 percent annual CPI&lt;\/h3&gt;&lt;p&gt;Housing and household utilities made the largest upwards contribution to the CPI in the year ended June 2018, influenced by rent and construction prices. Nationally, rents increased 2.5 percent in the year. Regionally, prices increased 4.2 percent in Wellington, 2.5 percent in Auckland, and 0.3 percent in Canterbury.&lt;\/p&gt;&lt;p&gt;Construction of newly built houses increased 3.9 percent in the June 2018 year, down from 4.7 percent in the year to March 2018. Regionally, prices in Auckland and Wellington (both up 3.4 percent) rose less than the rest of the North Island (up 5.4 percent). Prices in the South Island excluding Canterbury rose the most (up 7.2 percent).&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;16015&quot;,&quot;Title&quot;:&quot;CPI: June 2018 quarter \u2013 CPI purchase of new housing&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&qu r\n2007-09-01,1088\r\n2007-12-01,1101\r\n2008-03-01,1107\r\n2008-06-01,1120\r\n2008-09-01,1135\r\n2008-12-01,1134\r\n2009-03-01,1132\r\n2009-06-01,1134\r\n2009-09-01,1134\r\n2009-12-01,1142\r\n2010-03-01,1141\r\n2010-06-01,1150\r\n2010-09-01,1152\r\n2010-12-01,1171\r\n2011-03-01,1167\r\n2011-06-01,1170\r\n2011-09-01,1180\r\n2011-12-01,1178\r\n2012-03-01,1181\r\n2012-06-01,1186\r\n2012-09-01,1195\r\n2012-12-01,1197\r\n2013-03-01,1202\r\n2013-06-01,1214\r\n2013-09-01,1220\r\n2013-12-01,1230\r\n2014-03-01,1245\r\n2014-06-01,1255\r\n2014-09-01,1269\r\n2014-12-01,1286\r\n2015-03-01,1306\r\n2015-06-01,1317\r\n2015-09-01,1334\r\n2015-12-01,1347\r\n2016-03-01,1362\r\n2016-06-01,1392\r\n2016-09-01,1431\r\n2016-12-01,1455\r\n2017-03-01,1479\r\n2017-06-01,1502\r\n2017-09-01,1520\r\n2017-12-01,1539.55\r\n2018-03-01,1563.582\r\n2018-06-01,1583.108\r\n&quot;}],&quot;GraphType&quot;:&quot;timeSeries&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI construction, North Island, quarterly indexes, base: June 2006 quarter(=1000)&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;16059&quot;,&quot;Title&quot;:&quot;Consumers Price Index: June 2018 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Food prices increased 0.7 percent in the year to June 2018. This was driven by a 3.0 percent increase for ready-to-eat food, which was affected by the minimum wage increase on 1&lt;sup&gt;st&lt;\/sup&gt; April 2018.&lt;\/p&gt;&lt;p&gt;Higher prices for cigarettes and tobacco (up 11 percent), and petrol (up 10 percent), also contributed to the 1.5 percent annual CPI increase.&lt;\/p&gt;&lt;p&gt;Prices fell over the year for a range of goods and services, including vegetables, tertiary education and audio-visual equipment. Vegetable prices fell 10 percent, down from record-highs last year caused by wet weather.&lt;\/p&gt;&lt;h3&gt;Quarterly housing and fuel rises offset by cars and TV&lt;\/h3&gt;&lt;p&gt;Housing and household utility prices rose 0.9 percent in the June 2018 quarter. This was the largest upward contributor to the CPI, driven by higher prices for rent (up 0.8 percent) and seasonally higher electricity (up 1.7 percent).&lt;\/p&gt;&lt;p&gt;Transport prices rose 0.2 percent in the latest quarter. Rising petrol prices (up 3.2 percent) were the main influencer, slightly offset by lower prices for used cars (down 3.3 percent).&lt;\/p&gt;&lt;p&gt;Regionally, petrol prices rose the most in Canterbury (up 4.9 percent), and Wellington (up 4.2 percent). In Auckland, prices rose 2.6 percent in the quarter.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;16018&quot;,&quot;Title&quot;:&quot;CPI: June 2018 quarter \u2013 CPI petrol, by region, quarterly change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Region&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:4432,&quot;Title&quot;:&quot;CPI petrol by region quarterly&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Region,Auckland,Wellington,Rest of North Island,Canterbury,Rest of South Island\r\nPercentage change,2.6,4.2,2.5,4.9,3.8\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI petrol, by region, quarterly change, June 2018 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;16062&quot;,&quot;Title&quot;:&quot;Consumers Price Index: June 2018 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Recreation and culture prices fell 1.4 percent in the June quarter, the largest downward contributor to the CPI, driven by lower prices for cultural services (down 4.7 percent). This was influenced by price falls for subscriber TV, down 7.2 percent. Audio visual equipment fell 15 percent, led by quality improvements for televisions reflected as an effective price fall.&lt;\/p&gt;&lt;h3&gt;Fuel prices lead annual tradables increase&lt;\/h3&gt;&lt;p&gt;Tradables increased 0.1 percent in the year ended June 2018, with higher prices for petrol countered by lower prices for vegetables, and audio-visual equipment.&lt;\/p&gt;&lt;p&gt;Non-tradables increased 2.5 percent in the June 2018 year, driven by higher prices for cigarettes and tobacco, rents, and construction. Lower prices for tertiary education, and telecommunication services partly offset the increases.&lt;\/p&gt;&lt;h3&gt;Underlying price change higher for the year&lt;\/h3&gt;&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 1.7 percent to 1.8 percent for the year, which is higher than the 1.5 percent overall increase in the CPI. On a quarterly basis, trimmed means ranged from 0.3 percent to 0.5 percent.&amp;nbsp;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;16030&quot;,&quot;Title&quot;:&quot;CPI: June 2018 quarter \u2013 CPI trimmed means and all groups&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Level of tri
