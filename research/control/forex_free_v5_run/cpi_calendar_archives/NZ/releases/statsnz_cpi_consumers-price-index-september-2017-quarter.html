hold utilities&amp;nbsp;rose 1.0 percent, influenced by&amp;nbsp;local authority&amp;nbsp;rates (up 3.5 percent), rentals for housing (up 0.6 percent), and purchase of new housing (up 1.1 percent).&lt;\/li&gt;\n&lt;li&gt;Transport prices fell 1.1 percent, with cheaper petrol prices (down 1.7 percent), and international airfares (down 5.5 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Annual change&lt;\/h3&gt;&lt;p&gt;From the September 2016 quarter to the September 2017 quarter, the CPI inflation rate&amp;nbsp;was 1.9 percent.&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities increased 3.0 percent, with purchase of new housing up 5.4 percent, and rentals for housing up 2.2 percent.&lt;\/li&gt;\n&lt;li&gt;Food prices increased 2.8 percent, with vegetables up 9.0 percent.&lt;\/li&gt;\n&lt;li&gt;Communication prices decreased 5.3 percent, with telecommunications services down 4.5 percent and equipment down 22 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Average prices&lt;\/h3&gt;&lt;ul&gt;\n&lt;li&gt;The average price of 1 litre of 91 octane petrol was $1.83 in the&amp;nbsp;September 2017 quarter, down from $1.86 in the&amp;nbsp;June 2017 quarter, and up from $1.75 in the&amp;nbsp;September 2016 quarter.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;p&gt;&lt;a title=\&quot;links to stat.govt.nz \u2013 opens in new window. \&quot; href=\&quot;http:\/\/archive.stats.govt.nz\/browse_for_stats\/economic_indicators\/CPI_inflation\/cpi-infogr-animation\&quot;&gt;Consumers price index \u2013 animation and infographic&lt;\/a&gt; has more about how the CPI works.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5366&quot;,&quot;Title&quot;:&quot;CPI Sep 17 qtr \u2013 Consumers price index quarterly change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&q  price index: September 2017 quarter \u2013 commentary 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;&lt;strong&gt;Communication&lt;\/strong&gt; prices fell 1.3 percent, reflecting better-value telecommunication services (down 1.5 percent).&lt;\/p&gt;&lt;h2&gt;Tradable prices grow slightly in September quarter&lt;\/h2&gt;&lt;p&gt;&lt;strong&gt;Tradables&lt;\/strong&gt; rose 0.2 percent in the September 2017 quarter, following a 0.2 percent fall in the June 2017 quarter. Higher prices for vegetables were mostly offset by lower petrol, international airfare, and fruit prices.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Non-tradables&lt;\/strong&gt; rose 0.7 percent in the latest quarter, with higher prices for local authority rates, rents, and new housing. Better-value telecommunication services and cheaper vehicle-relicensing fees partly offset the increase.&lt;\/p&gt;&lt;p&gt;The following graph shows the index points contribution to the CPI of items that rose or fell in price for each quarter (see also table 13, available from the &#039;Download data&#039; section).&lt;\/p&gt;&lt;p&gt;&lt;img class=\&quot;leftAlone\&quot; title=\&quot;Graph, Percentage points contribution to the CPI, items that rose or fell in price, September 2014 to September 2017 quarters. \&quot; src=\&quot;assets\/Uploads\/Consumers-price-index\/Consumers-price-index-September-2017-quarter\/Download-data\/pctge-pts-cntrbn.png\&quot; alt=\&quot;Percentage points contribution to the CPI, items that rose or fell in price. \&quot; width=\&quot;564\&quot; height=\&quot;277\&quot;&gt;&lt;\/p&gt;&lt;h2&gt;Annual inflation rate 1.9 percent&lt;\/h2&gt;&lt;p&gt;In the year to the September 2017 quarter, the CPI increased 1.9 percent, following a 1.7 percent increase in the year to June 2017.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Housing and household utilities&lt;\/strong&gt; were the main upward contributor (up 3.0 percent), influenced by:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;newly built houses, excluding land (up 5.4 percent), with increases of 6.8 percent in Auckland, 3.2 percent in Wellington, and 2.6 percent in Canterbury.&lt;\/li&gt;\n&lt;li&gt;actual rentals for housing (up 2.2 percent), with increases of 2.7 percent in Auckland and 3.7 percent in Wellington, partly offset by a 1.9 percent decrease in Canterbury.&lt;\/li&gt;\n&lt;li&gt;local authority rates (up 3.7 percent). This value is slightly higher than the quarterly movement because a small proportion of rates came through in the December 2016 quarter. This year, 98 percent of rates are accounted for in the September quarter&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;5450&quot;,&quot;Title&quot;:&quot;CPI Sep 17 qtr \u2013 CPI purchase of new housing by region&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Index&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:965,&quot;Title&quot;:&quot;Auckland&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;timeseries&quot;,&quot;GraphCsvData&quot;:&quot;2006-06-01,1000\r\n2006-09-01,1014\r\n2006-12-01,1025\r\n2007-03-01,1037\r\n2007-06-01,1056\r\n2007-09-01,1073\r\n2007-12-01,1091\r\n2008-03-01,1108\r\n2008-06-01,1114\r\n2008-09-01,1131\r\n2008-12-01,1118\r\n2009-03-01,1115\r\n2009-06-01,1118\r\n2009-09-01,1123\r\n2009-12-01,1126\r\n2010-03-01,1130\r\n2010-06-01,1133\r\n2010-09-01,1139\r\n2010-12-01,1167\r\n2011-03-01,1165\r\n2011-06-01,1173\r\n2011-09-01,1182\r\n2011-12-01,1199\r\n2012-03-01,1207\r\n2012-06-01,1212\r\n2012-09-01,1214\r\n2012-12-01,1217\r\n2013-03-01,1221\r\n2013-06-01,1240\r\n2013-09-01,1252\r\n2013-12-01,1271\r\n2014-03-01,1293\r\n2014-06-01,1308\r\n2014-09-01,1323\r\n2014-12-01,1360\r\n2015-03-01,1369\r\n2015-06-01, 12-01,1161\r\n2014-03-01,1165\r\n2014-06-01,1179\r\n2014-09-01,1181\r\n2014-12-01,1188\r\n2015-03-01,1195\r\n2015-06-01,1200\r\n2015-09-01,1206\r\n2015-12-01,1221\r\n2016-03-01,1228\r\n2016-06-01,1232\r\n2016-09-01,1256\r\n2016-12-01,1269\r\n2017-03-01,1272\r\n2017-06-01,1278\r\n2017-09-01,1296\r\n&quot;}],&quot;GraphType&quot;:&quot;timeSeries&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI purchase of new housing by region, quarterly indexes, Base: June 2006 quarter (=1000)&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;5429&quot;,&quot;Title&quot;:&quot;Consumers price index: September 2017 quarter \u2013 commentary 6&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Other housing-related prices also increased for the year, with property maintenance services up 3.4 percent, real estate services up 8.1 percent, and dwelling insurance up 12 percent.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Food&lt;\/strong&gt; prices increased 2.8 percent, with vegetables up 9.0 percent and fruit up 2.2 percent.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Alcoholic beverages and tobacco&lt;\/strong&gt; prices increased 4.5 percent, primarily reflecting the annual increase in tobacco tax in the March quarter.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Transport&lt;\/strong&gt; prices increased 2.0 percent, influenced by higher prices for petrol (up 4.5 percent).&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Communication&lt;\/strong&gt; group prices decreased 5.3 percent, with better-value telecommunications services (down 4.5 percent), and equipment (down 22 percent). Price decreases for these items mostly represent continual improvements in quality and capability.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Tradables&lt;\/strong&gt; increased 1.0 percent in the year to September 2017. Higher prices for petrol; vegetables; and milk, cheese, and eggs, made the main upwards contributions. These were partly offset by decreases for audio-visual equipment, package holidays, and computing equipment.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Non-tradables&lt;\/strong&gt; increased 2.6 percent in the year to September 2017. Prices for cigarettes and tobacco made the most-significant upwards contribution, followed by purchase of new housing (excluding land), rentals for housing, and local authority rates. These increases were partly offset by decreases for telecommunications services and vehicle-relicensing fees.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5453&quot;,&quot;Title&quot;:&quot;CPI Sep 17 qtr \u2013 CPI tradables, non-tradables, and all groups&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Index&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:974,&quot;Title&quot;:&quot;CPI all groups&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;timeseries&quot;,&quot;GraphCsvData&quot;:&quot;2006-06-01,1000\r\n2006-09-01,1007\r\n2006-12-01,1005\r\n2007-03-01,1010\r\n2007-06-01,1020\r\n2007-09-01,1025\r\n2007-12-01,1037\r\n2008-03-01,1044\r\n2008-06-01,1061\r\n2008-09-01,1077\r\n2008-12-01,1072\r\n2009-03-01,1075\r\n2009-06-01,1081\r\n2009-09-01,1095\r\n2009-12-01,1093\r\n2010-03-01,1097\r\n2010-06-01,1099\r\n2010-09-01,1111\r\n2010-12-01,1137\r\n2011-03-01,1146\r\n2011-06-01,1157\r\n2011-09-01,1162\r\n2011-12-01,1158\r\n2012-03-01,1164\r\n2012-06-01,1168\r\n2012-09-01,1171\r\n2012-12-01,1169\r\n2013-03-01,1174\r\n2013-06-01,1176\r\n2013-09-01,1187\r\n2013-12-01,1188\r\n2014-03-01,1192\r\n2014-06-0 &quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:983,&quot;Title&quot;:&quot;CPI trimmed means and all groups, Sep17qtr&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;,All groups,5,10,15,20,25,30\r\nQuarterly,0.5,0.5,0.5,0.5,0.5,0.5,0.5\r\nAnnual,1.9,1.9,2,2,2,2,2.1\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI trimmed means and all groups, percentage changes, September 2017 quarter&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;5435&quot;,&quot;Title&quot;:&quot;Consumers price index: September 2017 quarter \u2013 commentary 8&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Table 3.03 of the attached Excel tables shows selected groupings in the year to the September 2017 quarter.&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding housing and household utilities group increased 1.6 percent.&lt;\/li&gt;\n&lt;li&gt;CPI excluding alcoholic beverages and tobacco group increased 1.7 percent.&lt;\/li&gt;\n&lt;li&gt;CPI excluding transport group increased 1.9 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;p&gt;The &#039;non-tradables less central and local government charges and cigarettes and tobacco subgroup&#039; measure, which aims to reflect price change excluding direct government influence, rose 0.8 percent for the quarter, and 2.2 percent for the September 2017 year. Central and local government charges rose 2.1 percent in the year to the September 2017 quarter.&lt;\/p&gt;&lt;h2&gt;Updated CPI for the December 2017 quarter&lt;\/h2&gt;&lt;p&gt;The release of the December 2017 quarter CPI will be a week later than usual, as we are implementing a review of the index. CPI reviews happen every three years and help ensure the index remains relevant.&lt;\/p&gt;&lt;p&gt;&lt;em&gt;Consumers price index: December 2017 quarter&lt;\/em&gt; will be published on 25 January 2018. The reviewed index will incorporate:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;an updated basket of goods and services&lt;\/li&gt;\n&lt;li&gt;an updated expenditure weighting pattern.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;p&gt;We will release a paper on the CPI review on 12 January 2018. The paper will include:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;the new expenditure weights, down to the third (class) level of the expenditure classification&lt;\/li&gt;\n&lt;li&gt;details of changes made to the basket of goods and services.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;p&gt;The paper will be available from our website and will be sent to all CPI information release subscribers.&lt;\/p&gt;&lt;p&gt;The reweighted food price index (FPI) for October will also be released later than usual, on 20 November 2017. Subsequent CPI and FPI releases will be published at the usual times.&lt;\/p&gt;&lt;p&gt;Please see our online release calendar for information on release dates.&lt;\/p&gt;&lt;p&gt;For further information about the CPI review, please contact:&lt;\/p&gt;&lt;p&gt;Bryan Downes or Fiona Smillie&lt;br&gt;0508 525 525 toll-free&lt;br&gt;Email &lt;a href=\&quot;mailto:cpireview@stats.govt.nz?subject=CPI%20review%202017\&quot;&gt;cpireview@stats.govt.nz&lt;\/a&gt; with \u2018CPI review 2017\u2019 in the subject line.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5399&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 media enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Media enquiries&lt;\/h2&gt;\n&lt;p&gt;Media team&lt;br&gt;&lt;a href=\&quot;mailto:media@stats.govt.nz?subject=Consumers%20price%20index%20%E2%80%93%20media%20enquiries\&quot;&gt;media@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+64212859191\&quot;&gt;021 285 9191&lt;br&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5402&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 technical enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Technical enquiries&lt;\/h2&gt;\n&lt;p&gt;Prices and deflators team&lt;br&gt;&lt;a href=\&quot;mailto:info@stats.govt.nz?subject=Consumers%20price%20index%20%E2%80%93%20technical%20enquiries\&quot;&gt;info@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+6449314600\&quot;&gt;04 931&amp;nbsp;4600&lt;br&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;607&quot;,&quot;Title&quot;:&quot;ISSN for consumers price index&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;ISSN 1178-0452&lt;\/p&gt;&quot;}],&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;PageBlockSortOrder&quot;:{&quot;5360&quot;:2,&quot;5363&quot;:3,&quot;5366&quot;:4,&quot;5369&quot;:5,&quot;5414&quot;:6,&quot;5438&quot;:7,&quo
