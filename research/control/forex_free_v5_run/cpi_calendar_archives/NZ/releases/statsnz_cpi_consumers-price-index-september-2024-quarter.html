\&quot;&gt;Download data&lt;\/a&gt; have more analytical groupings.&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;123297&quot;,&quot;Title&quot;:&quot;CPI Sept24 qtr \u2013 g4 \u2013 Consumer inflation, September 2020\u2013September 2024 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percentage change&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:32811,&quot;Title&quot;:&quot;Consumer inflation, September 2020\u2013September 2024 quarters - column&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Period ended,Sep-20,Dec-20,Mar-21,Jun-21,Sep-21,Dec-21,Mar-22,Jun-22,Sep-22,Dec-22,Mar-23,Jun-23,Sep-23,Dec-23,Mar-24,Jun-24,Sep-24\r\nCPI all groups (quarterly),0.7,0.5,0.8,1.3,2.2,1.4,1.8,1.7,2.2,1.4,1.2,1.1,1.8,0.5,0.6,0.4,0.6\r\n&quot;},{&quot;ID&quot;:32823,&quot;Title&quot;:&quot;Consumer inflation, September 2020\u2013September 2024 quarters - line&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;Period ended,Sep-20,Dec-20,Mar-21,Jun-21,Sep-21,Dec-21,Mar-22,Jun-22,Sep-22,Dec-22,Mar-23,Jun-23,Sep-23,Dec-23,Mar-24,Jun-24,Sep-24\r\nCPI all groups (annual),1.4,1.4,1.5,3.3,4.9,5.9,6.9,7.3,7.2,7.2,6.7,6,5.6,4.7,4,3.3,2.2\r\nTradeables (annual),-0.1,-0.3,0.5,3.4,5.7,6.9,8.5,8.7,8.1,8.2,6.4,5.2,4.7,3,1.6,0.3,-1.6\r\nNon-tradeables (annual),2.6,2.8,2.1,3.3,4.5,5.3,6,6.3,6.6,6.6,6.8,6.6,6.3,5.9,5.8,5.4,4.9\r\n&quot;}],&quot;GraphType&quot;:&quot;columnLine&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumer inflation, September 2020\u2013September 2024 quarters&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot; quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;123681&quot;,&quot;Title&quot;:&quot;CPI Sept24 qtr \u2013 g6 \u2013 Quarterly percentage point contribution to consumers price index, by group, September 2024 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage point contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:32817,&quot;Title&quot;:&quot;Quarterly percentage point contribution to consumers price index, by group, September 2024 quarter&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Housing contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage point contribution,0.246,0.044,-0.009,0.547,0.005,0.169,-0.293,-0.015,0.075,-0.129,0.059\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Quarterly percentage point contribution to consumers price index, by group, September 2024 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;123288&quot;,&quot;Title&quot;:&quot;Consumers price index: September 2024 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Annual change&lt;\/h2&gt;\n&lt;p&gt;Within the 2.2 percent increase in the CPI in the 12 months to the September 2024 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;actual rentals for housing, up 4.5 percent (18.9 percent contribution to the 2.2 percent rise for all groups)&lt;\/li&gt;\n&lt;li&gt;local authority rates and payments, up 12.2 percent (15.8 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;cigarettes and tobacco, up 10.0 percent (13.8 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;These were partly offset by lower prices for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;petrol, down 8.0 percent (-14.8 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;vegetables, down 17.9 percent (-14.1 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;123684&quot;,&quot;Title&quot;:&quot;CPI Sept24 qtr \u2013 g7 \u2013 Annual percentage point contribution to consumers price index, by group, September 2024 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage point contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:32820,&quot;Title&quot;:&quot;Annual percentage point contribution to consumers price index, by group, September 2024 quarter&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Housing contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage point contribution,0.139,0.437,0.036,1.285,0.001,0.328,-0.716,0.091,0.214,-0.064,0.449\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Annual percentage point contribution to consumers price index, by group, September 2024 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;123714&quot;,&quot;Title&quot;:&quot;Consumers price index: September 2024 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Tradeable and non-tradeable inflation&lt;\/h2&gt;\n&lt;p&gt;Non-tradeable inflation measures final goods and services that do not face foreign competition and is an indicator of domestic demand and supply conditions. However, the inputs of these goods and services can be influenced by foreign competition.&lt;\/p&gt;\n&lt;p&gt;Within the 4.9 percent increase in non-tradeables inflation in the 12 months to the September 2024 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;actual rentals for housing, up 4.5 percent (15.0 percent contribution to the 4.9 percent rise for all groups non-tradeable)&lt;\/li&gt;\n&lt;li&gt;local authority rates and payments, up 12.2 percent (12.6 percent contribution to all groups non-tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;These were partly offset by lower prices for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;early childhood education, down 22.8 percent (-4.5 percent contribution to all groups non-tradeable)&lt;\/li&gt;\n&lt;li&gt;domestic air transport, down 11.2 percent (-2.8 percent contribution to all groups non-tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Tradeable inflation measures final goods and services that are influenced by foreign markets.&lt;\/p&gt;\n&lt;p&gt;Within the 1.6 percent decrease in tradeable inflation in the 12 months to the September 2024 quarter, lower prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;petrol, down 8.0 percent (51.5 percent contribution to the 1.6 percent fall in all groups tradeable)&lt;\/li&gt;\n&lt;li&gt;vegetables, down 17.9 percent (49.1 percent contribution to all groups tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;These were partly offset by higher prices for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;overseas accommodation prepaid in New Zealand, up 5.1 percent (-16.4 percent contribution to all groups tradeable)&lt;\/li&gt;\n&lt;li&gt;oils and fats, up 24.9 percent (-10.5 percent contribution to all groups tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Annual inflation, international comparisons&lt;\/h2&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;height: 100%; width: 100%;\&quot; width=\&quot;100%\&quot;&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Country&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;12-month inflation rate&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Time reference&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;New Zealand&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;2.2 percent&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;September 2024&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;Australia&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;2.7 percent*&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;August 2024&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;United Kingdom&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;2.2 percent**&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;August 2024&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;United States of America&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;2.4 percent&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;September 2024&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;OECD average&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;4.7 percent&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;August 2024&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;European Union&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;200\&quot;&gt;\n&lt;p&gt;2.2 percent&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;August 2024&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;3\&quot; width=\&quot;599\&quot;&gt;\n&lt;p&gt;* Australia\u2019s inflation rate is taken from the monthly indicator release.&lt;\/p&gt;\n&lt;p&gt;** United Kingdom\u2019s CPI figure is not their headline figure, which is \u2018Consumer Prices Index &lt;br&gt;including owner occupiers\u2019 housing costs (CPIH)\u2019.&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/www.oecd.org\/en\/data\/indicators\/inflation-cpi.html\&quot;&gt;OECD Inflation (CPI)&lt;\/a&gt; has more data on international inflation rates.&lt;\/p&gt;\n&lt;h2&gt;Prescription charges&lt;\/h2&gt;\n&lt;p&gt;The $5 prescription co-payment was reinstated on 1 July 2024. The impact of this was reflected in the pharmaceutical products class.&lt;\/p&gt;\n&lt;p&gt;We have also introduced more frequent collection of prescription fee data and are now accurately capturing the effect of the &lt;a href=\&quot;https:\/\/www.govt.nz\/browse\/health\/gps-and-prescriptions\/prescription-subsidy-scheme\/\&quot;&gt;Prescription subsidy scheme&lt;\/a&gt; as well.&lt;\/p&gt;\n&lt;p&gt;A household becomes eligible for the prescription subsidy scheme once they have paid for 20 prescription items from 1 February each year. Using historical data, we\u2019ve observed that over the course of a year, because of the 20 item cap, the average price the consumer pays for prescriptions falls approximately 60 percent to January.&lt;\/p&gt;\n&lt;p&gt;In 2024, the prescription count began on 1 July 2024 due to the reinstatement of the co-payment. This will reset on 1 February 2025, like previous years. This will be captured in the Consumers price index: March 2025 quarter.&lt;\/p&gt;\n&lt;h2&gt;Early childhood education&lt;\/h2&gt;\n&lt;p&gt;We have made an adjustment to early childhood education in the CPI to reflect the rebate households may now receive through the &lt;a href=\&quot;https:\/\/www.ird.govt.nz\/familyboost\&quot;&gt;FamilyBoost&lt;\/a&gt; scheme.&lt;\/p&gt;\n&lt;p&gt;Inland Revenue has provided data about the anticipated fall in household expenditure on early childhood education in 2024\/25 due to FamilyBoost. A fall of about $174 million is expected in CPI expenditure on early childhood education.&lt;\/p&gt;\n&lt;p&gt;Early childhood education fell 22.8 percent in the September 2024 quarter. This reflects regular price changes for early childhood education, and the impact of the FamilyBoost rebate.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/65543d91-a280-4739-b90f-c49cbb7da68c\/#\/nz.govt.stats\/24daf577-e941-4a5c-9ba1-f43c5afb5e1e\/1\&quot;&gt;Consumers price index concepts \u2013 DataInfo+&lt;\/a&gt;&amp;nbsp;gives definitions of terms used in this release and&amp;nbsp;general methodology used to produce&amp;nbsp;the CPI&amp;nbsp;and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/8b0860b8-cf63-4f12-a578-8eed8ba69ac3\/?_ga=2.200485870.1749673349.1620332052-1586433161.1610308723\&quot;&gt;Consumers price index \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce the CPI and related metadata.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5399&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 media enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Media enquiries&lt;\/h2&gt;\n&lt;p&gt;Media team&lt;br&gt;&lt;a href=\&quot;mailto:media@stats.govt.nz?subject=Consumers%20price%20index%20%E2%80%93%20media%20enquiries\&quot;&gt;media@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+64212859191\&quot;&gt;021 285 9191&lt;br&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5402&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 technical enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Gr
