arter of previous year in table 12 was incorrect (1.5 percent). We corrected this to 1.7 percent.&amp;nbsp;&lt;\/p&gt;\n&lt;\/div&gt;&quot;},{&quot;ID&quot;:&quot;29166&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2019 quarter \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;&lt;p&gt;Inflation rates for the June 2019 quarter:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;quarterly \u2013 0.6 percent&lt;\/li&gt;\n&lt;li&gt;annual \u2013 1.7 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Quarterly change&lt;\/h3&gt;&lt;p&gt;In the June 2019 quarter compared with the March 2019 quarter, the CPI rose 0.6 percent (up 0.5 percent with seasonal adjustment).&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities rose 0.7 percent, influenced by higher prices for rentals for housing (up 1.0 percent).&lt;\/li&gt;\n&lt;li&gt;Food prices rose 0.6 percent, influenced by higher prices for restaurant meals and ready-to-eat food (up 1.4 percent).&lt;\/li&gt;\n&lt;li&gt;Household contents and services rose 2.5 percent, influenced by higher prices for furniture and furnishings (up 4.8 percent).&lt;\/li&gt;\n&lt;li&gt;Transport rose 0.6 percent, influenced by higher prices for petrol (up 5.8 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;29099&quot;,&quot;Title&quot;:&quot;CPI June 2019 quarter \u2013 Consumers price index, quarterly change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:8300,&quot;Title&quot;:&quot;cpi quarterly change&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,J ,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Average quarterly prices&lt;\/h3&gt;&lt;ul&gt;\n&lt;li&gt;The average price for 1 litre of 91 octane petrol was $2.13 in the June 2019 quarter, up from $2.01 in the March 2019 quarter, and from $2.06 in the June 2018 quarter.&lt;\/li&gt;\n&lt;li&gt;The average price for 1 pack of 25 cigarettes was $37.49 in the June 2019 quarter, up from $37.48 in the March 2019 quarter, and from $35.19 in the June 2018 quarter.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;29157&quot;,&quot;Title&quot;:&quot;CPI June 2019 quarter \u2013 CPI weighted average price of petrol, per litre, June 2009\u2013June 2019 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Price per litre ($)&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:8328,&quot;Title&quot;:&quot;weighted average price of petrol per litre&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;timeseries&quot;,&quot;GraphCsvData&quot;:&quot;2009-06-01,1.6\r\n2009-09-01,1.64\r\n2009-12-01,1.62\r\n2010-03-01,1.73\r\n2010-06-01,1.76\r\n2010-09-01,1.73\r\n2010-12-01,1.85\r\n2011-03-01,2.03\r\n2011-06-01,2.11\r\n2011-09-01,2.04\r\n2011-12-01,2.06\r\n2012-03-01,2.1\r\n2012-06-01,2.11\r\n2012-09-01,2.09\r\n2012-12-01,2.07\r\n2013-03-01,2.11\r\n2013-06-01,2.05\r\n2013-09-01,2.17\r\n2013-12-01,2.09\r\n2014-03-01,2.11\r\n2014-06-01,2.11\r\n2014-09-01,2.12\r\n2014-12-01,2\r\n2015-03-01,1.79\r\n2015-06-01,1.95\r\n2015-09-01,1.98\r\n2015-12-01,1.84\r\n2016-03-01,1.69\r\n2016-06-01,1.78\r\n2016-09-01,1.75\r\n2016-12-01,1.82\r\n2017-03-01,1.9\r\n2017-06-01,1.86\r\n2017-09-01,1.83\r\n2017-12-01,1.94\r\n2018-03-01,2\r\n2018-06-01,2.06\r\n2018-09-01,2.18\r\n2018-12-01,2.17\r\n2019-03-01,2.01\r\n2019-06-01,2.13\r\n&quot;}],&quot;GraphType&quot;:&quot;timeSeries&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI weighted average price of petrol, per litre, June 2009\u2013June 2019 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;29175&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2019 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Higher housing and food costs contribute to quarterly inflation&amp;nbsp;&lt;\/h3&gt;&lt;p&gt;Housing and household utility prices rose 0.7 percent in the June 2019 quarter. This was the largest upward contributor to the CPI, driven by higher prices for rent (up 1.0 percent) and purchase of housing (up 0.7 percent). Regionally, rent prices rose the most in Wellington (up 1.4 percent), compared with 0.6 percent in Auckland, and 0.5 percent in Canterbury.&lt;\/p&gt;&lt;p&gt;Food prices rose 0.6 percent in the June 2019 quarter, the second-largest upwards contributor. The rise was influenced by higher prices for restaurant meals and ready-to-eat food (up 1.4 percent), grocery food (up 0.2 percent), and fruit and vegetables (up 0.6 percent).&lt;\/p&gt;&lt;p&gt;Transport prices rose slightly, up 0.6 percent. Higher prices for petrol (up 5.8 percent) was the largest individual contributor to inflation this quarter. However, this was offset by price falls for used cars (down 3.9 percent), domestic air transport (down 13 percent), and road passenger transport (down 13 percent).&lt;\/p&gt;&lt;h3&gt;Rental for housing, and cigarettes and tobacco drive annual inflation&lt;\/h3&gt;&lt;p&gt;Housing and household utilities was the main upwards contributor to the 1.7 percent CPI increase in the June 2019 year. The rise in this group was influenced by higher prices for rents, purchase of housing, and local authority rates.&lt;\/p&gt;&lt;p&gt;Actual rentals for housing increased 2.5 percent nationwide in the year to June 2019. Regionally, rent prices increased the most in Wellington, up 3.8 percent. Rents increased 2.0 percent in Auckland, 3.6 percent in the rest of the North Island, 0.9 percent in Canterbury, and 3.3 percent in the rest of the South Island.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;29154&quot;,&quot;Title&quot;:&quot;CPI June 2019 quarter \u2013 CPI actual rentals for housing, by region, change from June 2018 quarter\u2013June 2019 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Region&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:8325,&quot;Title&quot;:&quot;cpi actual rentals for housing&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Broad region,Auckland,Wellington,Rest of North Island,Canterbury,Rest of South Island\r\nPercentage change,2,3.8,3.6,0.9,3.3\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI actual rentals for housing, by region, annual change, June 2018 quarter\u2013June 2019 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;29178&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2019 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Construction prices increased 3.5 percent in the year to June 2019 across the country. Prices of newly built houses increased 3.0 percent in both Auckland and Wellington, 5.1 percent in the rest of the North Island, 1.9 percent in Canterbury, and 4.6 percent in the rest of the South Island.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;29151&quot;,&quot;Title&quot;:&quot;CPI June 2019 quarter \u2013 CPI purchase of new housing, by region, annual change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Region&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:8322,&quot;Title&quot;:&quot;cpi purchase of new housing&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Broad region,Auckland,Wellington,Rest of North Island,Canterbury,Rest of South Island\r\nPercentage change,3,3,5.1,1.9,4.6\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI purchase of new housing, by region, annual change, June 2018 quarter\u2013June 2019 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;29181&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2019 quarter \u2013 key facts 6&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Alcoholic beverages and tobacco were the second-largest contributors over the year, with prices up 3.5 percent. This was driven by an increase in cigarettes and tobacco (up 7.7 percent).&lt;\/p&gt;&lt;p&gt;Food was another leading contributor to the annual CPI increase, with prices increasing 1.1 percent. This was due to restaurant meals and ready-to-eat food, which rose 3.3 percent. These rises coincided with a $1.20 an hour increase in the minimum wage from 1 April 2019.&lt;\/p&gt;&lt;h3&gt;Higher petrol prices lead tradable increase&lt;\/h3&gt;&lt;p&gt;&lt;strong&gt;Tradables&lt;\/strong&gt; rose 0.9 percent in the June 2019 quarter, following a 1.3 percent fall in the March 2019 quarter. The latest increase was mainly driven by higher petrol. Lower prices for second-hand cars partly offset the increase.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Tradables&lt;\/strong&gt; increased 0.1 percent in the June 2019 year, with higher prices for petrol, overseas accommodation, and meat and poultry. Lower prices for telecommunication equipment, vegetables, and second-hand cars partly offset the rises.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Non-tradables&lt;\/strong&gt; increased 2.8 percent in the June 2019 year. Higher prices for rents, cigarettes and tobacco, and purchase of housing made the largest contributions.&lt;\/p&gt;&lt;h3&gt;Underlying price showed higher inflation for the year&lt;\/h3&gt;&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 1.9 percent to 2.1 percent for the year. This indicates that underlying inflation is higher than the 1.7 percent overall increase in CPI. On a quarterly basis, trimmed means ranged from 0.6 percent to 0.7 percent.&lt;\/p&gt;&lt;p&gt;For the year ended June 2019:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding housing and household utilities increased 1.2 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding cigarettes and tobacco increased 1.5 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding food increased 1.8 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;New rent method&lt;\/h3&gt;&lt;p&gt;A new rent method has now been introduced into the CPI release to replace the previous survey-based method.&amp;nbsp; The CPI rent movement for this quarter will be based on the monthly rental price indexes for April, May, and June 2019.&lt;\/p&gt;&lt;p&gt;There are many benefits to moving to a new methodology and data source. Landlords will no longer need to fill in a rent survey, but there will be full coverage of all tenancy bonds. This will reduce respondent burden, save money, and mean more frequent and more accurate releases.&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;methods\/new-methodology-for-rental-prices-in-the-cpi\&quot;&gt;New methodology for rental prices in the CPI&lt;\/a&gt; has more detail.&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;insights?filters=Rental%20price%20indexes%2CInformation%20releases\&quot;&gt;Rental price indexes&lt;\/a&gt; provides the monthly series available from the January 2019 reference month, including a back series.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to Da
