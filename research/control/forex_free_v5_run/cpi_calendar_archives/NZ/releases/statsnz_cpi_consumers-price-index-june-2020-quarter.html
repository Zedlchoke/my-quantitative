he March 2020 quarter, the CPI fell 0.5 percent (down 0.4 percent with seasonal adjustment).&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Transport fell 4.9 percent, influenced by lower prices for petrol (down 12 percent).&lt;\/li&gt;\n&lt;li&gt;Food prices rose 1.1 percent, influenced by higher vegetable prices (up 16 percent).&lt;\/li&gt;\n&lt;li&gt;Housing and household utilities rose 0.6 percent, influenced by higher prices for rentals for housing (up 0.6 percent) (&lt;span style=\&quot;color: #0b0c0c;\&quot;&gt;&lt;a href=\&quot;information-releases\/consumers-price-index-june-2020-quarter#rent\&quot;&gt;see explanatory note on rent&lt;\/a&gt;)&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;42114&quot;,&quot;Title&quot;:&quot;CPI June 2020 quarter \u2013 Consumers price index, quarterly change, June 2016\u2013June 2020&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:12729,&quot;Title&quot;:&quot;cpi quarterly chg jun2016-20&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18,Mar-19,Jun-19,Sep-19,Dec-19,Mar-20,Jun-20\r\nPercentage change,0.4,0.3,0.4,1,0,0.5,0.1,0.5,0.4,0.9,0.1,0.1,0.6,0.7,0.5,0.8,-0.5\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, quarterly change, June 2016\u2013June 2020&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&q th rentals for housing up 3.4 percent. (&lt;a href=\&quot;information-releases\/consumers-price-index-june-2020-quarter#rent\&quot;&gt;see explanatory note on rent&lt;\/a&gt;)&lt;\/li&gt;\n&lt;li&gt;Food prices increased 3.7 percent, with vegetables up 13 percent.&lt;\/li&gt;\n&lt;li&gt;Transport decreased 4.2 percent, with petrol down 13 percent.&lt;\/li&gt;\n&lt;li&gt;Alcoholic beverages and tobacco increased 5.1 percent, with cigarettes and tobacco up 10 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;42108&quot;,&quot;Title&quot;:&quot;CPI June 2020 quarter \u2013 Consumers price index, annual change, June 2016\u2013June 2020&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:12723,&quot;Title&quot;:&quot;cpi annual chg june 2016-20&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Year ended,Jun-16,Sep-16,Dec-16,Mar-17,Jun-17,Sep-17,Dec-17,Mar-18,Jun-18,Sep-18,Dec-18,Mar-19,Jun-19,Sep-19,Dec-19,Mar-20,Jun-20\r\nPercentage change,0.4,0.4,1.3,2.2,1.7,1.9,1.6,1.1,1.5,1.9,1.9,1.5,1.7,1.5,1.9,2.5,1.5\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumers price index, annual change, June 2016\u2013June 2020&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;42111&quot;,&quot;Title&quot;:&quot;CPI June 2020 quarter \u2013 Annual percentage points contribution to CPI, by group, June 2020 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage points contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:12726,&quot;Title&quot;:&quot;annual pct points contrib to cpi by group&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Household contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services,\r\nPercentage points contribution,0.714,0.388,-0.111,0.805,-0.049,0.059,-0.593,-0.04,0.109,0.016,0.22\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Annual percentage points contribution to CPI, by group, June 2020 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;42188&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2020 quarter - key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Impacts of COVID-19 on the June 2020 quarter&lt;\/h2&gt;&lt;p&gt;The COVID-19 pandemic and subsequent alert level response have created some interruptions in data collection and methodological challenges for the June 2020 quarter CPI. They have also created a lot of volatility in the data.&lt;\/p&gt;&lt;p&gt;We were unable to price some items and estimated them using various methods.&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;methods\/impacts-of-covid-19-on-the-methodology-used-for-the-june-2020-quarter-cpi\&quot;&gt;Impacts of COVID-19 on the methodology used for the June 2020 quarter CPI&lt;\/a&gt; has further details on various topics, including data collection, imputation, and free services. It also has information about measuring rent prices and supressing domestic airfares.&lt;\/p&gt;&lt;p&gt;&lt;a name=\&quot;rent\&quot;&gt;&lt;\/a&gt;We also faced some challenges capturing the rent freeze in the CPI announced by the Government in March 2020. This took effect from 26 March 2020 and applies to existing tenancies, but not new tenancies. It will be in place until 25 September 2020 (unless extended).&lt;\/p&gt;&lt;p&gt;However, the CPI uses tenancy bond data to model rent price movements and is set up to account for new and existing tenancies.&lt;\/p&gt;&lt;p&gt;Bonds lodged within the last two years (excluding the current period) have their rent amount carried forward, with no change unless a new bond was lodged. If a bond was lodged more than two years ago, the rent amount is adjusted by the bonds lodged in the last two years (including the current period). This assumes that the rental price change for tenancies lodged more than two years ago moves in a similar way to the current rental market.&lt;\/p&gt;&lt;p&gt;The model is not designed to account for a rent freeze,* so bonds lodged more than two years ago will continue to be adjusted by the bonds lodged in the last two years. This means the rent freeze is only partially captured by the model.&lt;\/p&gt;&lt;p&gt;If the full impact of the rent freeze were captured this quarter, the movement for rentals of housing would be approximately flat.&lt;\/p&gt;&lt;p&gt;The overestimation of rentals of housing had no material impact on the overall CPI movement on a quarterly or annual basis.&lt;\/p&gt;&lt;p&gt;In the June 2020 quarter, the COVID-19 domestic travel restrictions limited the number of players in the domestic air passenger transport market. To prevent disclosing information about respondents, we suppressed the domestic airfares index for the June 2020 quarter. We also suppressed the road passenger transport index, which is in the same category, so that it will not be possible to derive domestic airfare changes by subtracting all others in the category. The road transport index includes buses, taxis, and rental cars.&lt;\/p&gt;&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;*&lt;strong&gt;16 July 2020&lt;\/strong&gt;: We have corrected this phrase, which incorrectly stated that the model parameters are designed to account for a rent freeze.&lt;\/span&gt;&lt;\/p&gt;&lt;h2&gt;Average quarterly prices&lt;\/h2&gt;&lt;p&gt;The average price for 1 litre of 91 octane petrol was $1.83 in the June 2020 quarter, down from $2.09 in the March 2020 quarter, and down from $2.13 in the June 2019 quarter.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;42120&quot;,&quot;Title&quot;:&quot;CPI June 2020 quarter \u2013 CPI weighted average price of petrol per litre, June 2010\u2013June 2020 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Price per litre ($)&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:12735,&quot;Title&quot;:&quot;Price per litre ($)&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;timeseries&quot;,&quot;GraphCsvData&quot;:&quot;2010-06-01,1.76\r\n2010-09-01,1.73\r\n2010-12-01,1.85\r\n2011-03-01,2.03\r\n2011-06-01,2.11\r\n2011-09-01,2.04\r\n2011-12-01,2.06\r\n2012-03-01,2.1\r\n2012-06-01,2.11\r\n2012-09-01,2.09\r\n2012-12-01,2.07\r\n2013-03-01,2.11\r\n2013-06-01,2.05\r\n2013-09-01,2.17\r\n2013-12-01,2.09\r\n2014-03-01,2.11\r\n2014-06-01,2.11\r\n2014-09-01,2.12\r\n2014-12-01,2\r\n2015-03-01,1.79\r\n2015-06-01,1.95\r\n2015-09-01,1.98\r\n2015-12-01,1.84\r\n2016-03-01,1.69\r\n2016-06-01,1.78\r\n2016-09-01,1.75\r\n2016-12-01,1.82\r\n2017-03-01,1.9\r\n2017-06-01,1.86\r\n2017-09-01,1.83\r\n2017-12-01,1.94\r\n2018-03-01,2\r\n2018-06-01,2.06\r\n2018-09-01,2.18\r\n2018-12-01,2.17\r\n2019-03-01,2.01\r\n2019-06-01,2.13\r\n2019-09-01,2.11\r\n2019-12-01,2.14\r\n2020-03-01,2.09\r\n2020-06-01,1.83\r\n&quot;}],&quot;GraphType&quot;:&quot;timeSeries&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI \u2013 weighted average price of petrol per litre, June 2010\u2013June 2020 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;42191&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2020 quarter - key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Lower petrol prices lead quarterly deflation&lt;\/h2&gt;&lt;p&gt;Transport prices fell 4.9 percent in the June 2020 quarter. Lower prices for petrol was the biggest contributor to deflation this quarter. Petrol prices fell 12 percent in the quarter, the largest fall since the 2008 global financial crisis, when they fell 22 percent.&lt;\/p&gt;&lt;p&gt;Food prices rose 1.1 percent in the quarter, mainly driven by a 16 percent rise in vegetables prices.&lt;\/p&gt;&lt;p&gt;Housing and household utilities rose 0.6 percent this quarter, with (unadjusted) rentals for housing up 0.6 percent nationwide. By broad region, rentals for housing rose 0.4 percent in Auckland, 1.0 percent in Wellington, and 0.2 percent in Canterbury (&lt;a href=\&quot;information-releases\/consumers-price-index-june-2020-quarter#rent\&quot;&gt;see caveats&lt;\/a&gt;).&lt;\/p&gt;&lt;h2&gt;Higher housing and food costs contribute to annual inflation&lt;\/h2&gt;&lt;p&gt;Housing and household utilities (up 3.2 percent) was the main contributor to the 1.5 percent CPI increase for the year ended June 2020. The increase was influenced by higher prices for rents, property rates and related services, and purchase of housing.&lt;\/p&gt;&lt;p&gt;Actual rentals for housing increased 3.4 percent across the country in the June 2020 year. Regionally, rental prices increased 1.9 percent in Auckland, 5.3 percent in Wellington, and 1.7 percent in Canterbury (&lt;a href=\&quot;information-releases\/consumers-price-index-june-2020-quarter#rent\&quot;&gt;see caveats&lt;\/a&gt;).&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;42123&quot;,&quot;Title&quot;:&quot;CPI June 2020 quarter \u2013 CPI \u2013 actual rentals for housing, by region, annual change, June 2008\u2013June 2020&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:12738,&quot;Title&quot;:&quot;Auckland&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;timeseries&quot;,&quot;GraphCsvData&quot;:&quot;2008-06-01,2.6\r\n2008-09-01,2.4\r\n2008-12-01,2.3\r\n2009-03-01,1.5\r\n2009-06-01,0.9\r\n2009-09-01,0.6\r\n2009-12-01,0.6\r\n2010-03-01,0.8\r\n2010-06-01,1.4\r\n2010-09-01,1.9\r\n2010-12-01,1.8\r\n2011-03-01,2\r\n2011-06-01,2.3\r\n2011-09-01,2.5\r\n2011-12-01,2.7\r\n2012-03-01,2.9\r\n2012-06-01,2.6\r\n2012-09-01,2.6\r\n2012-12-01,2.9\r\n2013-03-01,2.7\r\n2013-06-01,2.6\r\n2013-09-01,2.4\r\n2013-12-01,2.4\r\n2014-03-01,2.3\r\n2014-06-01,2.2\r\n2014-09-01,2.2\r\n2014-12-01,2.2\r\n2015-03-01,2.6\r\n2015-06-01,2.9\r\n2015-09-01,3\r\n2015-12-01,3.3\r\n2016-03-01,3.2\r\n2016-06-01,3.5\r\n2016-09-01,3.4\r\n2016-12-01,3.2\r\n2017-03- -03-01,2\r\n2013-06-01,1.5\r\n2013-09-01,1.2\r\n2013-12-01,1.7\r\n2014-03-01,1.4\r\n2014-06-01,1.4\r\n2014-09-01,1.6\r\n2014-12-01,1.3\r\n2015-03-01,1.3\r\n2015-06-01,1.2\r\n2015-09-01,1.9\r\n2015-12-01,2\r\n2016-03-01,2.1\r\n2016-06-01,1.9\r\n2016-09-01,1.1\r\n2016-12-01,1.2\r\n2017-03-01,1.5\r\n2017-06-01,1.9\r\n2017-09-01,2.2\r\n2017-12-01,2.1\r\n2018-03-01,1.8\r\n2018-06-01,2.1\r\n2018-09-01,1.9\r\n2018-12-01,2.8\r\n2019-03-01,2.9\r\n2019-06-01,3.3\r\n2019-09-01,4\r\n2019-12-01,4.1\r\n2020-03-01,5.3\r\n2020-06-01,4.5\r\n&quot;}],&quot;GraphType&quot;:&quot;timeSeries&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI \u2013 actual rentals for housing, by region, annual change, June 2008\u2013June 2020&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;42194&quot;,&quot;Title&quot;:&quot;Consumers price index: June 2020 quarter - key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Food prices were also a leading contributor to the annual increase in the CPI, with prices up 3.7 percent for the June 2020 year. This was driven by grocery foods (up 3.3 percent), restaurant meals and ready-to-eat food (up 3.7 percent), and fruit and vegetables (up 5.3 percent).&lt;\/p&gt;&lt;p&gt;Transport decreased 4.2 percent for the year, with private transport supplies and services down 8.5 percent.&lt;\/p&gt;&lt;h2&gt;Non-tradables flat in the June quarter&lt;\/h2&gt;&lt;p&gt;&lt;b&gt;Non-tradables&lt;\/b&gt; were flat in the June 2020 quarter, its smallest quarterly movement since 2016. Higher prices for restaurant meals and ready-to-eat food, rents, and purchase of housing were offset by lower prices for accommodation services and passenger transport services.&lt;\/p&gt;&lt;p&gt;Non-tradables increased 3.1 percent in the June 2020 year. This is the fourth consecutive quarter where it was above 3 percent on an annual basis. It was due to higher prices for rents, and cigarettes and tobacco.&lt;\/p&gt;&lt;p&gt;&lt;b&gt;Tradables&lt;\/b&gt; fell 1.2 percent in the June 2020 quarter. In the June 2020 year, tradables decreased 0.6 percent, mainly driven by lower prices for petrol.&lt;\/p&gt;&lt;h2&gt;Underlying price movement showed higher inflation for the year&lt;\/h2&gt;&lt;p&gt;The trimmed-mean measures, which exclude extreme price movements, ranged from 1.5 percent to 2.1 percent for the June 2020 year. This indicates that underlying inflation is higher than the 1.5 percent overall increase in the CPI.&lt;\/p&gt;&lt;p&gt;On a quarterly basis, trimmed means ranged from -0.5 percent to 0.2 percent.&lt;\/p&gt;&lt;p&gt;For the year ended June 2020:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding housing and household utilities increased 1.0 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding transport increased 2.4 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding food increased 1.0 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h2&gt;2020 CPI basket review&lt;\/h2&gt;&lt;p&gt;We will introduce new weights and basket changes in the &lt;em&gt;Food price index: July 2020&lt;\/em&gt; (to be published on 13 August 2020), &lt;em&gt;Consumers price index: September 2020 quarter&lt;\/em&gt; (to be published on 23 October 2020), and &lt;em&gt;Household living-costs price indexes: June 2020 quarter&lt;\/em&gt; (to be published on 4 November 2020).&lt;\/p&gt;&lt;p&gt;Every three years we refresh the indexes and refresh the items in the basket of goods and services that are priced as part of the CPI.&lt;\/p&gt;&lt;p&gt;The purpose of this exercise is to ensure that the indexes remain accurate and relevant, and fairly represent what New Zealand consumers buy. If the basket is not updated regularly, we miss out on what consumers substitute for more expensive items, leading to an upward bias in the index.&lt;\/p&gt;&lt;p&gt;The weights are largely updated using data collected in the 2018\/19 Household Expenditure Survey (this survey runs every three years). We know that expenditure patterns for consumer goods and services may have changed since then, to varying degrees, due to COVID-19. We are considering the pros and cons of adjusting weights for selected CPI basket items in cases where there has been a large change in expenditure (for example, international airfares) using alternative data sources. We may consider updating weights for some items annually (where rapid change may be expected) and\/or consider producing an analytical series to sit alongside the CPI with adjusted weights for selected items.&lt;\/p&gt;&lt;p&gt;We are also talking to our international colleagues and customers to seek guidance on this topic and will let you know about our plans before we make any changes.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quo
