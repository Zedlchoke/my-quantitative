Block&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Food was another leading contributor to the annual CPI, increasing 2.5 percent. This was driven by a 3.4 percent price increase in restaurant meals and ready-to-eat food.&amp;nbsp; In April 2019, the minimum wage rose from $16.50 to $17.70 an hour.&amp;nbsp; Changes to the minimum wage tend to impact more on workers in the retail and food industries.&lt;\/p&gt;&lt;h2&gt;Higher transport prices contribute the most to quarterly inflation&lt;\/h2&gt;&lt;p&gt;Transport prices rose 2.1 percent in December 2019 quarter. Higher prices for international air transport and petrol were the main contributors. International air transport had a seasonal rise of 9.3 percent this quarter, following a 7.6 percent rise in the December 2018 quarter. Petrol prices rose 1.6 percent.&lt;\/p&gt;&lt;p&gt;Recreation and culture rose 1.6 percent in the December 2019 quarter. This was the second largest upward contributor to the CPI, driven by higher prices for accommodation services (up 4.4 percent) and newspapers, books, and stationery (up 3.0 percent).&lt;\/p&gt;&lt;p&gt;Housing and household utilities rose 0.5 percent in the December 2019 quarter. Rentals for housing rose 0.8 percent this quarter across the country. Auckland rose 0.5 percent and Wellington rose 1.0 percent. Canterbury rose 0.4 percent, with a 1.1 percent rise in the rest of South Island.&lt;\/p&gt;&lt;h3&gt;Higher transport costs lead tradable increase&lt;\/h3&gt;&lt;p&gt;&lt;strong&gt;Tradables&lt;\/strong&gt; rose 0.4 percent in the December 2019 quarter, mainly driven by higher prices for international airfares and petrol. Lower prices for vegetables partly offset the rise.&lt;\/p&gt;&lt;p&gt;In the December 2019 year, tradables increased 0.1 percent, with higher prices for meat and poultry, breads and cereals, and women\u2019s clothing. Lower prices for games, toys, and hobbies; new cars; and telecommunication equipment partly offset the rises.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Non-tradables&lt;\/strong&gt; increased 3.1 percent in the year to December 2019. Higher prices for rents, cigarettes and tobacco, and local authority rates made the largest contributions.&lt;\/p&gt;&lt;h3&gt;Underlying price showed higher inflation for the year&lt;\/h3&gt;&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 2.0 percent to 2.1 percent for the year. This indicates that underlying inflation is higher than the 1.9 percent overall increase in CPI. On a quarterly basis, trimmed means ranged from 0.4 percent to 0.5 percent.&lt;\/p&gt;&lt;p&gt;For the year ended December 2019:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding housing and household utilities increased 1.5 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding cigarettes and tobacco increased 1.7 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding food increased 1.7 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h2&gt;&lt;a name=\&quot;correction\&quot;&gt;&lt;\/a&gt;Correction to domestic air transport class&lt;\/h2&gt;&lt;p&gt;We have corrected an error in the domestic air transport class, which arose as part of the regular reweight of airfares. The error affects the domestic air transport class by up to 24 index points, for periods between the March 2017 quarter and the September 2019 quarter.&lt;\/p&gt;&lt;p&gt;There is no impact on the overall published CPI all groups over this time period. The table below shows the impacts on the different levels of published CPI data.&lt;\/p&gt;&lt;table class=\&quot;stats-bordered\&quot;&gt;&lt;caption&gt;Impacts of error in domestic air transport class on different levels of published CPI, March 2017 quarter\u2013September 2019 quarter&lt;\/caption&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;5\&quot;&gt;CPI&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;&lt;th scope=\&quot;row\&quot;&gt;Series ID&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;Classification ;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;5\&quot;&gt;&amp;nbsp;Broad regions&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Series ID&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Classification&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Index type&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Max index point difference&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Time period&lt;\/th&gt;&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;CPIQ.SE107&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Transport&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Auckland&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;1&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Multiple&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;CPIQ.SE207&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Transport&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Wellington&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;2&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;2019.3&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;CPIQ.SE307&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Transport&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Rest of North Island&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;1&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Multiple&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;CPIQ.SE407&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Transport&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;North Island&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;1&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Multiple&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;CPIQ.SE507&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Transport&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Canterbury&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;2&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Multiple&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;CPIQ.SE607&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Transport&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Rest of South Island&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;1&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Multiple&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;CPIQ.SE707&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Transport&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;South Island&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;2&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Multiple&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;5\&quot;&gt;&amp;nbsp;COICOP&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Series ID&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Classification&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Index type&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Max index point difference&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;&amp;nbsp;Time period&lt;\/th&gt;&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;CPIQ.SE9NS2060&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Transport&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Group&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;1&lt;\/td&gt;\n&lt;td&gt;&amp;nbsp;Multiple&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;See &#039;Consumers price index: December 2019 quarter \u2013 corrections&#039; under &lt;a href=\&quot;information-releases\/consumers-price-index-december-2019-quarter#download-data\&quot;&gt;Download data&lt;\/a&gt; for more detail about the correction.&lt;\/p&gt;&lt;p&gt;As part of the correction process, we have temporarily suppressed some values for the following six analytical series to enable thorough quality assurance. We will let you know as soon as possible when we will publish these values.&lt;\/p&gt;&lt;div&gt;\n&lt;div&gt;\n&lt;div id=\&quot;_com_1\&quot;&gt;\n&lt;table class=\&quot;stats-bordered\&quot;&gt;&lt;caption&gt;Analytical series with temporarily suppressed values, March 2017\u2013December 2019 quarters&lt;\/caption&gt;\n&lt;tbody&gt;\n&lt;tr&gt;&lt;th scope=\&quot;row\&quot;&gt;Series ID&lt;\/th&gt;&lt;th scope=\&quot;row\&quot;&gt;Series name&lt;\/th&gt;&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CPIQ.SE9NS6510&lt;\/td&gt;\n&lt;td&gt;All groups non-tradables less housing and household utilities group&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CPIQ.SE9NS6520&lt;\/td&gt;\n&lt;td&gt;All groups non-tradables less purchase of new housing class&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CPIQ.SE9NS6530&lt;\/td&gt;\n&lt;td&gt;All groups non-tradables less rentals for housing, home ownership, and property maintenance subgroups&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CPIQ.SE9NS6570&lt;\/td&gt;\n&lt;td&gt;All groups non-tradables less central and local government charges&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CPIQ.SE9NS6580&lt;\/td&gt;\n&lt;td&gt;All groups non-tradables less cigarettes and tobacco subgroup&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CPIQ.SE9NS6590&lt;\/td&gt;\n&lt;td&gt;All groups non-tradables less central and local government charges and cigarettes and tobacco sub group&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;Stats NZ is an open and transparent organisation and corrects errors as soon as practicable. We have rigorous processes to check data before publication. We regret the error and any inconvenience caused.&lt;\/p&gt;\n&lt;h3&gt;Impact of error on other statistics&lt;\/h3&gt;\n&lt;p&gt;The corrections will also be reflected in the household living-cost price indexes, which will be published on Wednesday, 5 February 2020. The revised price index series are used in compiling household consumption expenditure on transport for the quarterly gross domestic product release. The revisions do not have a significant impact on the estimates of household consumption expenditure previously published in &lt;a href=\&quot;information-releases\/gross-domestic-product-september-2019-quarter\&quot;&gt;Gross domestic product: September 2019 quarter&lt;\/a&gt;.&lt;\/p&gt;\n&lt;p&gt;There is no impact on the producers price index and the overseas trade indexes.&lt;\/p&gt;\n&lt;\/div&gt;\n&lt;\/div&gt;\n&lt;\/div&gt;&quot;},{&quot;ID&quot;:
