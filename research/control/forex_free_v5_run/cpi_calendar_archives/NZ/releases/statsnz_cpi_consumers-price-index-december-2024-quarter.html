quot;Title&quot;:&quot;CPI Dec24 qtr \u2013 g1 \u2013 Consumer inflation, December 2020\u2013December 2024 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percentage change&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:33484,&quot;Title&quot;:&quot;Consumer inflation, December 2020\u2013December 2024 quarters \u2013 columns&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Period ended,Dec-20,Mar-21,Jun-21,Sep-21,Dec-21,Mar-22,Jun-22,Sep-22,Dec-22,Mar-23,Jun-23,Sep-23,Dec-23,Mar-24,Jun-24,Sep-24,Dec-24\r\nCPI all groups (quarterly),0.5,0.8,1.3,2.2,1.4,1.8,1.7,2.2,1.4,1.2,1.1,1.8,0.5,0.6,0.4,0.6,0.5\r\n&quot;},{&quot;ID&quot;:33486,&quot;Title&quot;:&quot;Consumer inflation, December 2020\u2013December 2024 quarters \u2013 line&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;Period ended,Dec-20,Mar-21,Jun-21,Sep-21,Dec-21,Mar-22,Jun-22,Sep-22,Dec-22,Mar-23,Jun-23,Sep-23,Dec-23,Mar-24,Jun-24,Sep-24,Dec-24\r\nCPI all groups (annual),1.4,1.5,3.3,4.9,5.9,6.9,7.3,7.2,7.2,6.7,6,5.6,4.7,4,3.3,2.2,2.2\r\nTradeables (annual),-0.3,0.5,3.4,5.7,6.9,8.5,8.7,8.1,8.2,6.4,5.2,4.7,3,1.6,0.3,-1.6,-1.1\r\nNon-tradeables (annual),2.8,2.1,3.3,4.5,5.3,6,6.3,6.6,6.6,6.8,6.6,6.3,5.9,5.8,5.4,4.9,4.5\r\n&quot;}],&quot;GraphType&quot;:&quot;columnLine&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Consumer inflation, December 2020\u2013December 2024 quarters&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;126362&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2024 quarter \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Quarterly change&lt;\/h2&gt;\n&lt;p&gt;Within the 0.5 percent rise in the CPI in the December 2024 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;international air transport, up 6.6 percent (23.3 percent contribution to the 0.5 percent rise for all groups)&lt;\/li&gt;\n&lt;li&gt;second-hand cars, up 4.7 percent (18.6 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;actual rentals for housing, up 0.8 percent (14.8 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;These were partly offset by lower prices for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;vegetables, down 11.5 percent (-33.0 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;confectionery, nuts, and snacks, down 3.7 percent (-11.6 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;126404&quot;,&quot;Title&quot;:&quot;CPI Dec24 qtr \u2013 g2 \u2013 Quarterly percentage point contribution to consumers price index, by group, December 2024 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage point contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:33492,&quot;Title&quot;:&quot;Quarterly percentage point contribution to consumers price index, by group, December 2024 quarter&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Housing contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage point contribution,-0.111,0.011,-0.033,0.13,-0.019,-0.007,0.194,0.049,0.211,0,0.075\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Quarterly percentage point contribution to consumers price index, by group, December 2024 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;126361&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2024 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Annual change&lt;\/h2&gt;\n&lt;p&gt;Within the 2.2 percent increase in the CPI in the 12 months to the December 2024 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;actual rentals for housing, up 4.2 percent (18.0 percent contribution to the 2.2 percent rise for all groups)&lt;\/li&gt;\n&lt;li&gt;local authority rates and payments, up 12.2 percent (16.1 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;cigarettes and tobacco, up 7.6 percent (11.0 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;These were partly offset by lower prices for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;petrol, down 9.2 percent (-18.6 percent contribution to all groups)&lt;\/li&gt;\n&lt;li&gt;vegetables, down 14.6 percent (-9.9 percent contribution to all groups).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;126405&quot;,&quot;Title&quot;:&quot;CPI Dec24 qtr \u2013 g3 \u2013 Annual percentage point contribution to consumers price index, by group, December 2024 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Group&quot;,&quot;yAxisTitle&quot;:&quot;Percentage point contribution&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:33491,&quot;Title&quot;:&quot;Annual percentage point contribution to consumers price index, by group, December 2024 quarter&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Group,Food,Alcoholic beverages and tobacco,Clothing and footwear,Housing and household utilities,Housing contents and services,Health,Transport,Communication,Recreation and culture,Education,Miscellaneous goods and services\r\nPercentage point contribution,0.242,0.361,-0.033,1.209,-0.041,0.239,-0.521,0.071,0.321,-0.065,0.418\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Annual percentage point contribution to consumers price index, by group, December 2024 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;126499&quot;,&quot;Title&quot;:&quot;Consumers price index: December 2024 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Tradeable and non-tradeable inflation&lt;\/h2&gt;\n&lt;p&gt;Non-tradeable inflation measures final goods and services that do not face foreign competition and is an indicator of domestic demand and supply conditions. However, the inputs of these goods and services can be influenced by foreign competition.&lt;\/p&gt;\n&lt;p&gt;Within the 4.5 percent increase in non-tradeables inflation in the 12 months to the December 2024 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;actual rentals for housing, up 4.2 percent (15.2 percent contribution to the 4.5 percent rise for all groups non-tradeable)&lt;\/li&gt;\n&lt;li&gt;local authority rates and payments, up 12.2 percent (13.6 percent contribution to all groups non-tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;These were partly offset by lower prices for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;early childhood education, down 22.8 percent (-4.9 percent contribution to all groups non-tradeable)&lt;\/li&gt;\n&lt;li&gt;domestic accommodation, down 9.0 percent (-2.8 percent contribution to all groups non-tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Tradeable inflation measures final goods and services that are influenced by foreign markets.&lt;\/p&gt;\n&lt;p&gt;Within the 1.1 percent decrease in tradeable inflation in the 12 months to the December 2024 quarter, lower prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;petrol, down 9.2 percent (88.6 percent contribution to the 1.1 percent fall in all groups tradeable)&lt;\/li&gt;\n&lt;li&gt;vegetables, down 14.6 percent (47.4 percent contribution to all groups tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;These were partly offset by higher prices for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;overseas accommodation prepaid in New Zealand, up 9.2 percent (-40.9 percent contribution to all groups tradeable)&lt;\/li&gt;\n&lt;li&gt;games, toys, and hobbies, up 11.0 percent (-18.8 percent contribution to all groups tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Annual inflation, international comparisons&lt;\/h2&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;font-weight: 400;\&quot;&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;b&gt;&lt;span&gt;Country&lt;\/span&gt;&lt;\/b&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;b&gt;&lt;span&gt;12-month inflation rate&lt;\/span&gt;&lt;\/b&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;b&gt;&lt;span&gt;Time reference&lt;\/span&gt;&lt;\/b&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;New Zealand&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;2.2 percent&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;December 2024&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;Australia&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;2.3 percent*&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;November 2024&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;United Kingdom&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;2.5 percent**&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;December 2024&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;United States of America&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;2.9 percent&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;December 2024&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;OECD average&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;4.5 percent&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;November 2024&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;European Union&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;2.5 percent&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;span&gt;November 2024&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;3\&quot;&gt;\n&lt;p&gt;&lt;span&gt;* Australia\u2019s inflation rate is taken from the monthly indicator release.&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span&gt;** United Kingdom\u2019s CPI figure is not their headline figure, which is \u2018Consumer Prices Index&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;br&gt;&lt;\/span&gt;&lt;span&gt;&amp;nbsp;including owner occupiers\u2019 housing costs (CPIH)&lt;\/span&gt;&lt;span&gt;\u2019&lt;\/span&gt;&lt;span&gt;.&lt;\/span&gt;&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/www.oecd.org\/en\/data\/indicators\/inflation-cpi.html\&quot;&gt;OECD Inflation&lt;\/a&gt; has more data on international inflation rates.&lt;\/p&gt;\n&lt;h2&gt;Exclusion of December 2024 rental data&lt;\/h2&gt;\n&lt;p&gt;For the December 2024 quarter CPI, we have produced a quarterly movement for rental prices using the two months of data published for October and November 2024.&lt;\/p&gt;\n&lt;p&gt;The administrative data for this information is provided by the Ministry of Business, Innovation and Employment (MBIE). MBIE has recently completed upgrades to their tenancy bond-lodgement system, and we need more time to integrate this data for the rental price indexes. &lt;br&gt;&lt;br&gt;We\u2019re working to integrate this dataset in time for the release of &lt;em&gt;Consumers price index: March 2025 quarter&lt;\/em&gt; in April 2025.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/65543d91-a280-4739-b90f-c49cbb7da68c\/#\/nz.govt.stats\/24daf577-e941-4a5c-9ba1-f43c5afb5e1e\/1\&quot;&gt;Consumers price index concepts \u2013 DataInfo+&lt;\/a&gt;&amp;nbsp;gives definitions of terms used in this release and&amp;nbsp;general methodology used to produce&amp;nbsp;the CPI&amp;nbsp;and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/8b0860b8-cf63-4f12-a578-8eed8ba69ac3\/?_ga=2.200485870.1749673349.1620332052-1586433161.1610308723\&quot;&gt;Consumers price index \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce the CPI and related metadata.&lt;\/p&
