umentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788484197&quot;,&quot;DocumentSize&quot;:&quot;603 KB&quot;,&quot;DocumentPreviewImage&quot;:false}],&quot;Heading&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}},&quot;Presentation&quot;:null},{&quot;ID&quot;:&quot;13388&quot;,&quot;Title&quot;:&quot;Correction \u2013 Consumers price index: March quarter 2018 &quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;div style=\&quot;background-color: #f6f6f6; border-left: #ec6607 3px solid; padding: 30px;\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;16 October 2018&lt;\/strong&gt;. We have corrected the &lt;em&gt;Consumers price index: March 2018 quarter&lt;\/em&gt; Excel file. In table 18, we corrected the quarterly index values, and quarterly percentage changes for the seven broad region all groups series (series SE1A through SE7A), for the period March 2018.&lt;\/p&gt;\n&lt;p&gt;We also corrected the annual percentage changes for the same series, for the period March 2018.&lt;\/p&gt;\n&lt;p&gt;The same changes for the relevant periods have&amp;nbsp; been applied to the Excel files in &lt;a href=\&quot;http:\/\/www.stats.govt.nz\/information-releases\/consumers-price-index-june-2018-quarter\&quot;&gt;Consumers price index: June 2018 quarter&lt;\/a&gt; and the &lt;a href=\&quot;http:\/\/www.stats.govt.nz\/information-releases\/consumers-price-index-september-2018-quarter\&quot;&gt;Consumers price index: September 2018 quarter&lt;\/a&gt;.&lt;\/p&gt;\n&lt;p&gt;This error does not impact any other CPI series.&lt;\/p&gt;\n&lt;p&gt;Stats NZ is an open and transparent organisation and corrects errors as soon as practicable. We have rigorous processes to check data before publication. We review any error to reduce and mitigate future risks. We regret the error and apologise for any inconvenience caused.&lt;\/p&gt;\n&lt;p&gt;&lt;strong&gt;20 April 2018&lt;\/strong&gt;. We have corrected the &#039;Consumers price index: March 2018 quarter&#039; Excel file. In tables 8.01, 8.02, and 9, we updated the expenditure weight September 2017 quarter for the communications group from 3.16 to 3.20.&lt;\/p&gt;\n&lt;\/div&gt;&quot;},{&quot;ID&quot;:&quot;13266&quot;,&quot;Title&quot;:&quot;Consumers Price Index: March 2018 quarter \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;&lt;p&gt;Inflation rates for the March 2018 quarter:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;quarter: 0.5 percent&lt;\/li&gt;\n&lt;li&gt;annual: 1.1 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h3&gt;Annual change&lt;\/h3&gt;&lt;p&gt;From the March 2017 quarter to the March 2018 quarter, the CPI increased 1.1 percent.&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Housing and household utilities increased 3.1 percent; construction was up 4.7 percent, and rentals for housing up 2.1 percent.&lt;\/li&gt;\n&lt;li&gt;Alcoholic beverages and tobacco increased 4.5 percent; cigarettes and tobacco was up 11 percent due to an increase in excise duty for tobacco and tobacco products.&amp;nbsp;&lt;\/li&gt;\n&lt;li&gt;Transport decreased 0.2 percent as seasonal international air transport decreased 14 percent. These falls are larger than typically seasonal movements.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;13121&quot;,&quot;Title&quot;:&quot;CPI March 2018 quarter \u2013 Consumers price index annual change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&qu &quot;Annual percentage points contribution to CPI, by group, March 2018 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;13269&quot;,&quot;Title&quot;:&quot;Consumers Price Index: March 2018 quarter \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Quarterly change&lt;\/h3&gt;&lt;p&gt;In the March 2018 quarter compared with the December 2017 quarter, the CPI rose 0.5 percent (up 0.5 percent with seasonal adjustment).&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;Alcoholic beverages and tobacco rose 4.3 percent, influenced by higher prices for cigarettes and tobacco (up 10 percent)&lt;\/li&gt;\n&lt;li&gt;Housing and household utilities rose 0.6 percent, influenced by higher prices for rents (up 0.6 percent).&lt;\/li&gt;\n&lt;li&gt;Food prices rose 0.5 percent, influenced by higher prices for fruit and vegetables (up 1.3 percent)&lt;\/li&gt;\n&lt;li&gt;Education prices fell 5.6 percent, influenced by lower prices for tertiary and other post-school education (down 16 percent).&amp;nbsp;&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;13125&quot;,&quot;Title&quot;:&quot;CPI March 2018 quarter \u2013 Consumers price index quarterly change&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:3560,&quot;Title&quot;:&quot;Consumers price index quarterly change&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;13272&quot;,&quot;Title&quot;:&quot;Consumers Price Index: March 2018 quarter \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Average quarterly prices&lt;\/h3&gt;&lt;ul&gt;\n&lt;li&gt;The average price for 1 litre of 91 octane petrol was $2.00 in the March 2018 quarter, up from $1.94 in the December 2017 quarter and $1.90 in the March 2017 quarter.&lt;\/li&gt;\n&lt;li&gt;The average price of a pack of 25 cigarettes was $35.14 in the March 2018 quarter, $31.68 in the March 2017 quarter, and $13.46 in the March 2010 quarter.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;13131&quot;,&quot;Title&quot;:&quot;CPI March 2018 quarter \u2013 Weighted average price series, cigarettes, $ per packet of 25&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Quarter&quot;,&quot;yAxisTitle&quot;:&quot;Price ($)&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:3551,&quot;Title&quot;:&quot;Weighted average price, cigarettes&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;timeseries&quot;,&quot;GraphCsvData&quot;:&quot;2006-06-01,11.95\r\n2006-09-01,11.95\r\n2006-12-01,12.09\r\n2007-03-01,12.44\r\n2007-06-01,12.45\r\n2007-09-01,12.46\r\n2007-12-01,12.46\r\n2008-03-01,12.9\r\n2008-06-01,12.9\r\n2008-09-01,12.9\r\n2008-12-01,12.9\r\n2009-03-01,13.43\r\n2009-06-01,13.43\r\n2009-09-01,13.32\r\n2009-12-01,13.28\r\n2010-03-01,13.46\r\n2010-06-01,14.31\r\n2010-09-01,14.73\r\n2010-12-01,15.02\r\n2011-03-01,16.39\r\n2011-06-01,16.39\r\n2011-09-01,16.39\r\n2011-12-01,16.39\r\n2012-03-01,18.46\r\n2012-06-01,18.46\r\n2012-09-01,18.46\r\n2012-12-01,18.46\r\n2013-03-01,20.79\r\n2013-06-01,20.79\r\n2013-09-01,20.79\r\n2013-12-01,20.79\r\n2014-03-01,22.88\r\n2014-06-01,22.86\r\n2014-09-01,23.25\r\n2014-12-01,23.3\r\n2015-03-01,26.42\r\n2015-06-01,26.42\r\n2015-09-01,26.43\r\n2015-12-01,26.43\r\n2016-03-01,28.79\r\n2016-06-01,28.8\r\n2016-09-01,28.81\r\n2016-12-01,28.82\r\n2017-03-01,31.6\r\n2017-06-01,31.63\r\n2017-09-01,31.69\r\n2017-12-01,31.68\r\n2018-03-01,35.14\r\n&quot;}],&quot;GraphType&quot;:&quot;timeSeries&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Weighted average price series, cigarettes, $ per packet of 25&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;   &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;13275&quot;,&quot;Title&quot;:&quot;Consumers Price Index: March 2018 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Housing and cigarette prices drive annual increase&lt;\/h3&gt;&lt;p&gt;Housing and household utilities made the largest upwards contribution to the 1.1 percent CPI increase in the year ended March 2018, influenced by construction and rent prices. Nationally, newly built houses increased 4.7 percent in the March 2018 year. Regionally, newly built houses increased 5.8 percent in Auckland, 3.2 percent in Wellington, and 0.4 percent in Canterbury.&lt;\/p&gt;&lt;p&gt;Actual rentals for housing was another leading contributor to the annual CPI increase. Nationally, rents were up 2.1 percent in the year ended March 2018. Regionally, rents increased 2.5 percent in Auckland and 4.2 percent in Wellington. Rents decreased 1.5 percent in Canterbury.&lt;\/p&gt;&lt;p&gt;The increased excise duty on tobacco in January influenced a 4.5 percent annual increase in alcoholic beverage and tobacco prices. Prices for cigarettes and tobacco increased 11 percent in the March 2018 year.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The annual inflation rate of 1.1 percent in the year ended March 2018 fell from 1.6 percent in the year ended December 2017, due to decreases in tertiary education prices and international air transport, and smaller increases in food prices.&lt;\/p&gt;&lt;h3&gt;Quarterly rise in alcohol and tobacco offset by falls in education&lt;\/h3&gt;&lt;p&gt;Alcohol and tobacco prices rose 4.3 percent in the March 2018 quarter. This was the largest upwards contributor to the CPI and driven by higher prices for cigarettes (up 10 percent). The annual indexation increase to excise duty on cigarettes and tobacco took place on 1 January this year.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Housing and household utility prices rose 0.6 percent in the latest quarter, the second-largest upwards contributor, influenced by higher prices for rents (up 0.6 percent). Regionally, rental prices rose in Auckland (up 0.5 percent), Wellington (up 1.8 percent), and Canterbury (up 0.3 percent) in the March 2018 quarter.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;13134&quot;,&quot;Title&quot;:&quot;CPI March 2018 quarter \u2013 CPI purchase of new housing, by region, quarterly change, March 2018 quarter&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:3566,&quot;Title&quot;:&quot;CPI purchase of new housing, by region, quarterly &quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Region,New Zealand,Auckland,Wellington,Canterbury\r\nQuarterly change,0.4,0.3,0.3,-1.1\r\n&quot;}],&quot;GraphType&quot;:&quot;column&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;CPI purchase of new housing, by region, quarterly change, March 2018 quarter&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;13278&quot;,&quot;Title&quot;:&quot;Consumers Price Index: March 2018 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Education prices fell 5.6 percent in the latest quarter, the largest downwards contributor to the CPI, influenced by lower prices for tertiary and other post-school education (down 16 percent). The introduction of a fee-free year of provider-based tertiary education, or industry training, influenced this price fall.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Transport prices fell 0.2 percent in the March 2018 quarter, the second-largest downward contributor, driven by lower prices for passenger transport services (down 8.8 percent).&amp;nbsp; International air transport was the main influencer (down 14 percent), with cheaper seasonal prices that were lower than for the March 2017 quarter.&amp;nbsp;&lt;\/p&gt;&lt;h3&gt;Tradables put the brakes on CPI&lt;\/h3&gt;&lt;p&gt;&lt;strong&gt;Tradables&lt;\/strong&gt; decreased 0.4 percent in the year ended March 2018, with lower prices for audio-visual equipment and international air transport. Higher prices for petrol partly offset the decreases.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Non-tradables&lt;\/strong&gt; increased 2.3 percent in the March 2018 year. Higher prices for cigarettes and tobacco, construction, and rents made the major contributions. Lower prices for education services partly offset the increases, with the introduction of one year of fee-free provider-based tertiary education or industry training.&lt;\/p&gt;&lt;h3&gt;Underlying price change higher for the year&lt;\/h3&gt;&lt;p&gt;The trimmed-mean measures \u2013 which exclude extreme price movements \u2013 ranged from 1.3 percent to 1.7 percent for the year, which is higher than the 1.1 percent overall increase in the CPI. On a quarterly basis, trimmed means ranged from 0.6 percent to 0.7 percent.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;For the year ended March 2018:&lt;\/p&gt;&lt;ul&gt;\n&lt;li&gt;CPI excluding alcoholic beverages and tobacco increased 0.9 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding food rose 1.2 percent&lt;\/li&gt;\n&lt;li&gt;CPI excluding education rose 1.3 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&lt;h2&gt;CPI visualisations&lt;\/h2&gt;&lt;p&gt;&lt;a title=\&quot;Link to Stats NZ&amp;#039;s archive site. \&quot; href=\&quot;http:\/\/archive.stats.govt.nz\/datavisualisation\/cpi.html?url=\/datavisualisation\/cpi.html&amp;amp;\&quot;&gt;Consumers price index visualisation&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a title=\&quot;Link to Stats NZ&amp;#039;s archive site. \&quot; href=\&quot;http:\/\/archive.stats.govt.nz\/datavisualisation\/cpi_ttnt.html\&quot;&gt;Consumers price index tradables and non-tradables&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/65543d91-a280-4739-b90f-c49cbb7da68c\/#\/nz.govt.stats\/24daf577-e941-4a5c-9ba1-f43c5afb5e1e\/1\&quot;&gt;Consumers price index concepts \u2013 DataInfo+&lt;\/a&gt;&amp;nbsp;gives definitions of terms used in this release and&amp;nbsp;general methodology used to produce&amp;nbsp;the CPI&amp;nbsp;and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/8b0860b8-cf63-4f12-a578-8eed8ba69ac3\/?_ga=2.200485870.1749673349.1620332052-1586433161.1610308723\&quot;&gt;Consumers price index \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce the CPI and related metadata.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5399&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 media enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Media enquiries&lt;\/h2&gt;\n&lt;p&gt;Media team&lt;br&gt;&lt;a href=\&quot;mailto:media@stats.govt.nz?subject=Consumers%20price%20index%20%E2%80%93%20media%20enquiries\&quot;&gt;media@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+64212859191\&quot;&gt;021 285 9191&lt;br&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;5402&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 technical enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Technical enquiries&lt;\/h2&gt;\n&
