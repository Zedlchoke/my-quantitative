mechanism_hypothesis:
  economic_claim: >-
    The Amihud illiquidity premium in this cross-section is compensation for
    bearing liquidity risk. It operates when flow is dispersed across the
    long tail (liquidity risk is priced) and dies when flow concentrates in
    liquid majors (illiquid names become abandoned ballast; the
    long-illiquid/short-liquid spread decays structurally). Compensation
    additionally concentrates in volatility-expansion regimes, when
    capital-binding pressure on intermediaries is high.
  selection_rule: >-
    Variables are declared economics-first and calibrated ONLY on data
    before 2024-08-22 (catalog b20 2020-01..2024-08; funding scan_2026).
    No threshold was chosen by inspecting P&L on 2024-08-22+; the single
    S0R contact is the disclosed descriptive replay above.

gate_spec_frozen:
  apply_law:
    - Gate state computed at each Monday 00:00:00Z stamp T from COMPLETED
      daily UTC blocks strictly before T (PIT; same bar law as the engine).
    - State changes only at stamps (weekly cadence, no intra-week trading).
    - GATED = (V1_state == ON) AND (V2_state == ON). Book formed at T is
      taken only when GATED; otherwise the book is flat for that week.
  v1_rotation_direction:
    name: liquidity-rotation direction (BTC DV-share momentum)
    operationalization_o1_frozen:
      conc28: mean over trailing 28 daily UTC blocks of
              DV(BTCUSDT) / sum(DV(symbols PIT-eligible that day)),
              DV = sum(quote_volume) of completed 15m bars in the block.
      eligible: symbol listed (>=28d of prior daily blocks) at that day.
      s90: conc28(T) - conc28-windowed-mean over trailing 90d ending at T.
      thresholds_prewindow:   # Mondays 2020-01-06..2024-08-19, n=242
        on_if_le: 0.021317    # p70
        off_if_ge: 0.057702   # p90
        hysteresis: between the two, carry previous state (initial state ON)
    operationalization_o2_posthoc:
      label: POST_HOC_PROPOSED_OUTCOME_EXPOSED
      definition: 90d return of EW liquid-majors index (BTC,ETH,SOL,XRP,ADA,
                  DOGE,LINK,AVAX,BCH,BNB) minus EW PIT alt-cohort index.
      provenance: proposed AFTER observing DIAG S0R forensics; NOT replayed
                  in this dossier; penalized evidentially (see endpoints);
                  may only be substituted for O1 by an explicit owner
                  amendment BEFORE any cell runs.
    calibration_source: catalog_live_crypto_b20 (2020-01-01..2024-08-21)
  v2_vol_floor:
    name: BTC 30d realized-vol floor
    definition: stdev of 30 daily log closes of BTCUSDT (completed daily
                blocks) annualized x sqrt(365).
    thresholds_prewindow:
      on_if_ge: 0.328930    # p10 of pre-window Mondays (n=238)
      off_if_lt: 0.296037   # = on_if_ge * 0.90 (hysteresis)
      carry_between: true
    calibration_source: catalog_live_crypto_b20 (2020-01-01..2024-08-21)

