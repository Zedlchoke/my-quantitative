# ETH-only mean-reversion demo (Testnet/Demo — no real money).
#
# Params from walk-forward quick grid (4/32 meets_acceptance), top combo:
#   stop=1.5, TP=2.0, vhf=0.25, adx=20, vol_ratio=1.8
#
# Risk: 1% equity/trade, 2% max daily loss, circuit breaker after 4 losses.
# HTF filter: no long below 1h EMA200, no short above (blocks bear-crash knives).
#
# Demo progression:
#   1. Signal-only (enable_trading: false) — watch logs 1–2 weeks
#   2. OOS: python -m research.oos_validate --config config/research_mean_reversion_eth.yaml
#   3. enable_trading: true on Testnet only after review

environment: TESTNET
enable_trading: false
run_seconds: 0
log_level: INFO

market:
  account_type: USDT_FUTURES
  symbols: [ETHUSDT]
  base_currency: USDT
  venue: BINANCE
  contract_type: PERP
  oms_type: NETTING
  bar_step: 15
  bar_aggregation: MINUTE
  price_type: LAST
  leverage: 2

strategy_type: mean_reversion

strategy:
  fast_ema_period: 20
  slow_ema_period: 50
  trend_ema_period: 200
  atr_period: 14
  history_days: 10

mean_reversion:
  bb_period: 20
  bb_k: 2.0
  rsi_period: 2
  rsi_oversold: 10.0
  rsi_overbought: 90.0
  vhf_period: 28
  vhf_max: 0.25
  adx_period: 14
  adx_max: 20.0
  volume_sma_period: 20
  volume_max_ratio: 1.8
  atr_period: 14
  atr_stop_multiple: 1.5
  take_profit_multiple: 2.0
  htf_trend_filter: true
  htf_ema_period: 200
  htf_minutes: 60
  wyckoff_gate: true           # pause MR in markdown; half size in transition
  wyckoff_directional_bias: true  # phase side bias — WF 3/3 pass vs gate-only 2/3
  history_days: 220            # warmup for Wyckoff daily EMA200

risk:
  risk_per_trade: 5              # fallback if equity unavailable
  risk_pct_per_trade: 1.0        # 1% of equity per trade (demo start)
  max_risk_per_trade_usdt: 50    # cap per trade on testnet
  max_notional: 500
  max_daily_loss: 12             # fallback absolute cap
  max_daily_loss_pct: 2.0        # 2% equity max loss/day
  max_trades_per_day: 3
  cooldown_bars_after_loss: 6
  circuit_breaker_losses: 4      # pause after 4 consecutive losses
  circuit_breaker_pause_bars: 96 # 24h on 15m bars
  atr_stop_multiple: 1.5
  allow_short: true
  close_position_on_stop: true
