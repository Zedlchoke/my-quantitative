# BTC-only regime-switch walk-forward research configuration.
market:
  account_type: USDT_FUTURES
  symbols: [BTCUSDT]
  base_currency: USDT
  venue: BINANCE
  contract_type: PERP
  oms_type: NETTING
  bar_step: 15
  bar_aggregation: MINUTE
  price_type: LAST
  leverage: 3

data:
  catalog_path: ./catalog
  environment: TESTNET
  lookback_days: 30
  start: null
  end: null

backtest:
  start: null
  end: null
  starting_balance: "100000 USDT"
  fee_model: maker_taker
  fixed_fee: "1 USDT"
  fill_model: one_tick_slippage
  prob_fill_on_limit: 1.0
  prob_slippage: 0.5
  random_seed: 42

strategy_type: regime_switch

strategy:
  fast_ema_period: 20
  slow_ema_period: 50
  trend_ema_period: 200
  atr_period: 14
  history_days: 10

regime_switch:
  trend_fast_ema_period: 20
  trend_slow_ema_period: 50
  trend_ema_period: 200
  trend_atr_period: 14
  trend_stop_multiple: 2.0
  mean_reversion_bb_period: 20
  mean_reversion_bb_k: 2.0
  mean_reversion_rsi_period: 2
  mean_reversion_rsi_oversold: 10.0
  mean_reversion_rsi_overbought: 90.0
  mean_reversion_vhf_period: 28
  mean_reversion_vhf_max: 0.35
  mean_reversion_adx_period: 14
  mean_reversion_adx_max: 25.0
  mean_reversion_volume_sma_period: 20
  mean_reversion_volume_max_ratio: 1.5
  mean_reversion_atr_period: 14
  mean_reversion_stop_multiple: 1.0
  mean_reversion_take_profit_multiple: 1.5
  history_days: 10

risk:
  risk_per_trade: 5
  max_notional: 300
  max_daily_loss: 20
  max_trades_per_day: 4
  cooldown_bars_after_loss: 4
  atr_stop_multiple: 2.0
  allow_short: true
  close_position_on_stop: true

report:
  output_dir: ./results
  include_csv: true
  include_json: true
