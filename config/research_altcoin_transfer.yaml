# Frozen ETH directional-MR rules transferred to a liquid altcoin cohort.
# This is a research challenge, not a claim that the ETH edge transfers.
# Public LIVE data is intentionally separated from Testnet execution/catalogs.

market:
  account_type: USDT_FUTURES
  symbols: [SOLUSDT, BNBUSDT, XRPUSDT, DOGEUSDT, LINKUSDT, ADAUSDT]
  base_currency: USDT
  venue: BINANCE
  contract_type: PERP
  oms_type: NETTING
  bar_step: 15
  bar_aggregation: MINUTE
  price_type: LAST
  leverage: 1

data:
  catalog_path: ./catalog_live_crypto
  environment: LIVE             # public market data only; never enables execution
  lookback_days: 730
  start: null
  end: null

backtest:
  mode: portfolio               # one balance shared by the entire cohort
  start: null
  end: null
  starting_balance: "100000 USDT"
  fee_model: maker_taker
  fixed_fee: "1 USDT"
  fill_model: one_tick_slippage
  prob_fill_on_limit: 1.0
  prob_slippage: 0.5
  random_seed: 42

strategy_type: mean_reversion

strategy:
  fast_ema_period: 20
  slow_ema_period: 50
  trend_ema_period: 200
  atr_period: 14
  history_days: 220

mean_reversion:
  bb_period: 20
  bb_k: 2.0
  rsi_period: 2
  rsi_oversold: 10.0
  rsi_overbought: 90.0
  vhf_period: 28
  vhf_max: 0.25
  adx_period: 14
  adx_max: 20.0
  volume_sma_period: 20
  volume_max_ratio: 1.8
  atr_period: 14
  atr_stop_multiple: 1.5
  take_profit_multiple: 2.0
  htf_trend_filter: true
  htf_ema_period: 200
  htf_minutes: 60
  wyckoff_gate: true
  wyckoff_directional_bias: true
  history_days: 220

risk:
  risk_per_trade: 5
  max_notional: 300
  max_daily_loss: 20
  max_trades_per_day: 4
  cooldown_bars_after_loss: 4
  circuit_breaker_losses: 4
  circuit_breaker_pause_bars: 96
  atr_stop_multiple: 1.5
  allow_short: true
  close_position_on_stop: true

portfolio_risk:
  enabled: true
  max_gross_notional: 900
  max_portfolio_risk_pct: 2.0
  max_concurrent_positions: 3
  max_positions_per_cluster: 1
  max_daily_loss_pct: 1.5
  circuit_breaker_losses: 5
  clusters:
    SOLUSDT: layer1
    BNBUSDT: layer1
    XRPUSDT: payments
    DOGEUSDT: meme
    LINKUSDT: infrastructure
    ADAUSDT: layer1
  asset_classes:
    SOLUSDT: crypto
    BNBUSDT: crypto
    XRPUSDT: crypto
    DOGEUSDT: crypto
    LINKUSDT: crypto
    ADAUSDT: crypto

report:
  output_dir: ./results/altcoin_transfer
  include_csv: true
  include_json: true
