# TradFi public-production data, signal-only. LIVE execution remains hard-blocked.
environment: LIVE
enable_trading: false
run_seconds: 0
log_level: INFO

market:
  account_type: USDT_FUTURES
  symbols: [SPYUSDT, QQQUSDT]
  base_currency: USDT
  venue: BINANCE
  contract_type: PERP
  oms_type: NETTING
  bar_step: 15
  bar_aggregation: MINUTE
  price_type: LAST
  leverage: 1

strategy_type: mean_reversion

strategy:
  fast_ema_period: 20
  slow_ema_period: 50
  trend_ema_period: 200
  atr_period: 14
  history_days: 10

mean_reversion:
  bb_period: 20
  bb_k: 2.0
  rsi_period: 2
  rsi_oversold: 10.0
  rsi_overbought: 90.0
  vhf_period: 28
  vhf_max: 0.25
  adx_period: 14
  adx_max: 20.0
  volume_sma_period: 20
  volume_max_ratio: 1.8
  atr_period: 14
  atr_stop_multiple: 1.5
  take_profit_multiple: 2.0
  htf_trend_filter: false
  wyckoff_gate: false
  wyckoff_directional_bias: false
  tradfi_session_filter: true
  tradfi_market_type: EQUITY
  tradfi_allowed_sessions: [REGULAR]
  history_days: 10

risk:
  risk_per_trade: 2
  max_notional: 100
  max_daily_loss: 10
  max_trades_per_day: 2
  cooldown_bars_after_loss: 4
  circuit_breaker_losses: 3
  circuit_breaker_pause_bars: 96
  atr_stop_multiple: 1.5
  allow_short: true
  close_position_on_stop: true

portfolio_risk:
  enabled: true
  max_gross_notional: 150
  max_portfolio_risk_pct: 0.5
  max_concurrent_positions: 1
  max_positions_per_cluster: 1
  max_daily_loss_pct: 0.5
  circuit_breaker_losses: 3
  clusters:
    SPYUSDT: us_equity_index
    QQQUSDT: us_equity_index
  asset_classes:
    SPYUSDT: tradfi
    QQQUSDT: tradfi
