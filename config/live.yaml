# Live configuration — Binance USD-M perpetual on Testnet/Demo, no real money.
# NOTES bước 4: default strategy_type=ema_atr (walk-forward chưa pass acceptance).
# LIVE is disabled by a hard safety guard in config.settings.

environment: TESTNET           # TESTNET | DEMO
enable_trading: false          # set true only on Testnet/Demo paper trading
run_seconds: 0                 # 0 = run until Ctrl+C
log_level: INFO

market:
  account_type: USDT_FUTURES   # USDT_FUTURES (USD-M) | COIN_FUTURES (COIN-M)
  symbols: [BTCUSDT, ETHUSDT]  # multiple symbols supported
  base_currency: USDT          # USDT (USD-M) | BTC (COIN-M)
  venue: BINANCE
  contract_type: PERP
  oms_type: NETTING            # one-way / netting mode
  bar_step: 15
  bar_aggregation: MINUTE
  price_type: LAST
  leverage: 3

strategy:
  fast_ema_period: 20
  slow_ema_period: 50
  trend_ema_period: 200
  atr_period: 14
  history_days: 10

strategy_type: ema_atr   # ema_atr | mean_reversion | regime_switch

risk:
  risk_per_trade: 5
  max_notional: 300
  max_daily_loss: 20
  max_trades_per_day: 4
  cooldown_bars_after_loss: 4
  atr_stop_multiple: 2.0
  allow_short: true
  close_position_on_stop: true
